<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光之戰士飛地</title>
<script>
  // 舊的調查連結（?s=…）自動轉到出席表頁
  if (new URLSearchParams(location.search).get("s")) location.replace("schedule.html" + location.search + location.hash);
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8ECF3; --surface:#F7F9FC; --ink:#1B2232; --muted:#5A6377; --line:#C9D1DE;
  --accent:#2F63C9; --accent-ink:#FFFFFF; --gold:#B8860B; --danger:#C23A4F;
  --tank:#2F63C9; --heal:#2E8B57; --dps:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
    --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
    --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
  --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
  --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1040px;margin:0 auto;padding:20px 16px 48px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;letter-spacing:.2em;color:var(--muted);margin:0}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.me img{width:28px;height:28px;border-radius:50%}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.hero{border-left:4px solid var(--gold);padding:4px 0 4px 18px;margin:0 0 22px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,6vw,48px);line-height:1.15;margin:0}
.hero .slogan{font-size:17px;color:var(--muted);margin:6px 0 0}
.hero .intro{margin:10px 0 0;max-width:64ch;white-space:pre-wrap}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.target{padding:2px 10px;border-radius:4px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.target.main{border-color:var(--gold);color:var(--gold);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.panel h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 0 12px}
.panel h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.discord{background:#5865F2;border-color:#5865F2;color:#fff;font-size:16px;padding:12px 22px;font-weight:700}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form{display:grid;gap:12px;max-width:620px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:500}
.form input,.form textarea,.form select,.sel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;background:var(--surface);padding:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.slot.r-tank{--rc:var(--tank)} .slot.r-heal{--rc:var(--heal)} .slot.r-dps{--rc:var(--dps)}
.slot .lab{position:absolute;top:6px;left:8px;font-weight:900;font-family:"Noto Serif TC",serif;color:var(--rc);font-size:15px}
.slot img{width:56px;height:56px;border-radius:50%;margin:8px 0 4px;background:var(--bg)}
.slot .nm{font-weight:700}
.slot .ch{font-size:12px;color:var(--muted);word-break:break-all}
.slot .jb{margin-top:4px;font-size:12px;font-weight:700;color:var(--rc)}
.slot.empty{justify-content:center;color:var(--muted);border-style:dashed;border-top-style:solid}
.bio{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.others{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.person img{width:28px;height:28px;border-radius:50%}
.person .jb{font-size:12px;font-weight:700}
.jb.tank{color:var(--tank)} .jb.heal{color:var(--heal)} .jb.dps{color:var(--dps)}

/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mod{display:grid;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.mod:hover{border-color:var(--accent)}
.mod .t{font-weight:700;font-size:16px}
.mod .d{font-size:13px;color:var(--muted)}
.badge{justify-self:start;font-size:12px;padding:0 8px;border-radius:4px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:700}
.badge.open{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--heal)}

/* manage */
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 90px repeat(4,minmax(96px,1fr)) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .who{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .who img{width:30px;height:30px;border-radius:50%}
.mrow .who div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead{font-size:12px;color:var(--muted);font-weight:700;border-top:0;padding-bottom:0}
.mtable{overflow-x:auto}
.mtable .inner{min-width:760px}
.mrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:13px;width:100%}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
.req img{width:36px;height:36px;border-radius:50%}
.req .info{flex:1;min-width:180px}
.modrow{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.modrow:first-child{border-top:0}
.tgtrow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:6px}
.tgtrow input,.tgtrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px}
.x{border:0;background:none;color:var(--muted);font-size:18px;border-radius:50%}
.x:hover{color:var(--danger)}

.center{text-align:center;padding:48px 16px}
.center h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,6vw,44px);margin:0 0 8px}
.center p{max-width:46ch;margin:0 auto 22px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <p class="brand" id="brand">光之戰士飛地</p>
    <div class="me" id="me"></div>
  </header>
  <main id="view"><div class="center muted">載入中…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { FIREBASE_CONFIG, OWNER_EMAIL, OWNER_DISCORD_ID, WORKER_URL, DIRECTORY } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCustomToken, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ---------- 常數 ---------- */
const JOBS=[
  {k:"PLD",n:"騎士",r:"tank"},{k:"WAR",n:"戰士",r:"tank"},{k:"DRK",n:"暗黑騎士",r:"tank"},{k:"GNB",n:"絕槍戰士",r:"tank"},
  {k:"WHM",n:"白魔道士",r:"heal"},{k:"SCH",n:"學者",r:"heal"},{k:"AST",n:"占星術士",r:"heal"},{k:"SGE",n:"賢者",r:"heal"},
  {k:"MNK",n:"武僧",r:"dps"},{k:"DRG",n:"龍騎士",r:"dps"},{k:"NIN",n:"忍者",r:"dps"},{k:"SAM",n:"武士",r:"dps"},{k:"RPR",n:"鐮刀",r:"dps"},{k:"VPR",n:"蝰蛇",r:"dps"},
  {k:"BRD",n:"吟遊詩人",r:"dps"},{k:"MCH",n:"機工士",r:"dps"},{k:"DNC",n:"舞者",r:"dps"},
  {k:"BLM",n:"黑魔道士",r:"dps"},{k:"SMN",n:"召喚士",r:"dps"},{k:"RDM",n:"赤魔道士",r:"dps"},{k:"PCT",n:"繪靈法師",r:"dps"}
];
const JOB=Object.fromEntries(JOBS.map(j=>[j.k,j]));
const ROLE_NAME={tank:"坦克",heal:"補師",dps:"輸出"};
const SLOTS=[{k:"MT",r:"tank"},{k:"ST",r:"tank"},{k:"H1",r:"heal"},{k:"H2",r:"heal"},{k:"D1",r:"dps"},{k:"D2",r:"dps"},{k:"D3",r:"dps"},{k:"D4",r:"dps"}];
const MODULES=[
  {k:"guide",n:"攻略法整理",d:"各階段機制、解法與站位分配"},
  {k:"bis",n:"BiS 追蹤",d:"每個人的配裝進度與缺件"},
  {k:"mit",n:"減傷軸",d:"時間軸與個人減傷分工"},
  {k:"review",n:"復盤紀錄",d:"每次開荒的進度與檢討"}
];
const MOD_STATUS={owner:"只有團長",selected:"指定成員",all:"全團開放"};
const PERM={none:"不可見",view:"可檢視",own:"編輯自己的",all:"編輯全部"};
const DEFAULT_PERMS={guide:"view",bis:"own",mit:"view",review:"own"};
const TARGET_TYPES={ultimate:"絕境戰",savage:"零式",other:"其他"};
const DEFAULT_TARGETS=[
  {n:"絕伊甸",t:"ultimate"},{n:"輕量級零式 1 層（M1S）",t:"savage"},{n:"輕量級零式 2 層（M2S）",t:"savage"},
  {n:"輕量級零式 3 層（M3S）",t:"savage"},{n:"輕量級零式 4 層（M4S）",t:"savage"}
];

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const W=WORKER_URL.replace(/\/+$/,"");
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2800);}
const armed={};
function armedTwice(key,btn,label){if(armed[key]&&Date.now()-armed[key]<4000)return true;armed[key]=Date.now();btn.textContent=label;return false;}
function dirName(dc){const p=DIRECTORY.find(x=>x.did===dc);return p?p.n:"";}
function avatarUrl(u){
  if(!u||!u.dc)return "https://cdn.discordapp.com/embed/avatars/0.png";
  if(u.avatar)return "https://cdn.discordapp.com/avatars/"+u.dc+"/"+u.avatar+".png?size=128";
  let i=0;try{i=Number((BigInt(u.dc)>>22n)%6n);}catch(_){}
  return "https://cdn.discordapp.com/embed/avatars/"+i+".png";
}
const nameOf=u=>u?(u.nick||u.dcName||"未命名"):"未知成員";
const jobLabel=k=>JOB[k]?JOB[k].k+" "+JOB[k].n:"";
function jobOptions(sel,blank){
  let h=blank?'<option value="">'+blank+'</option>':"";
  for(const r of ["tank","heal","dps"])h+='<optgroup label="'+ROLE_NAME[r]+'">'+JOBS.filter(j=>j.r===r).map(j=>'<option value="'+j.k+'"'+(j.k===sel?" selected":"")+'>'+j.k+" "+j.n+'</option>').join("")+'</optgroup>';
  return h;
}

/* ---------- 狀態 ---------- */
let app,db,auth,me=null,claims={},isOwner=false;
let users={},statics=[],members={},curTid=null,view="home",mgTab="members";
let unsub=[],memUnsub=null,ready={users:false,statics:false};
let profileDraft=null;

/* ---------- 啟動 ---------- */
app=initializeApp(FIREBASE_CONFIG);db=getFirestore(app);auth=getAuth(app);
{
  const m=location.hash.match(/dctoken=([^&]+)/),er=location.hash.match(/dcerror=([^&]+)/);
  if(m||er)history.replaceState(null,"",location.pathname+location.search);
  if(m)signInWithCustomToken(auth,decodeURIComponent(m[1])).catch(e=>{console.error(e);toast("Discord 登入失敗，請再試一次");});
  if(er)toast("Discord 登入失敗："+decodeURIComponent(er[1]));
}
onAuthStateChanged(auth,async u=>{
  me=u;claims={};
  unsub.forEach(f=>f());unsub=[];if(memUnsub){memUnsub();memUnsub=null;}
  users={};statics=[];members={};ready={users:false,statics:false};
  if(u){try{claims=(await u.getIdTokenResult()).claims||{};}catch(_){}}
  isOwner=!!(u&&((u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase())||claims.dc===OWNER_DISCORD_ID));
  if(u&&(claims.dc||isOwner))subscribe();
  render();
});
function subscribe(){
  unsub.push(onSnapshot(collection(db,"users"),s=>{
    users={};s.docs.forEach(d=>users[d.id]=d.data());ready.users=true;
    syncDiscordInfo();render(true);
  },err));
  unsub.push(onSnapshot(collection(db,"statics"),s=>{
    statics=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));ready.statics=true;
    if(!statics.find(x=>x.id===curTid)){curTid=statics[0]?statics[0].id:null;watchMembers();}
    render(true);
  },err));
}
function watchMembers(){
  if(memUnsub){memUnsub();memUnsub=null;}members={};
  if(!curTid)return;
  memUnsub=onSnapshot(collection(db,"statics",curTid,"members"),s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());render(true);},err);
}
function err(e){console.error(e);toast(e&&e.code==="permission-denied"?"讀取被拒絕，請確認 Firestore 規則已更新":"讀取資料失敗");}
// Discord 名稱、頭像有變時自動更新
let synced=false;
function syncDiscordInfo(){
  if(synced||!claims.dc||!me)return;const p=users[me.uid];if(!p)return;synced=true;
  if(p.dcName!==(claims.dcn||"")||p.avatar!==(claims.dca||""))
    updateDoc(doc(db,"users",me.uid),{dcName:claims.dcn||"",avatar:claims.dca||"",updatedAt:Date.now()}).catch(console.error);
}

/* ---------- 權限判斷 ---------- */
const cur=()=>statics.find(s=>s.id===curTid)||null;
const myMember=()=>me?members[me.uid]:null;
function canSee(mod){
  if(isOwner)return true;const st=cur(),m=myMember();
  if(!st||!m||m.status!=="active")return false;
  const status=(st.modules||{})[mod]||"owner";const p=(m.perms||{})[mod]||"none";
  if(status==="all")return true;
  if(status==="selected")return p!=="none";
  return false;
}

/* ---------- 畫面 ---------- */
function render(fromSnapshot){
  renderMe();
  const v=$("#view");
  if(!me)return v.innerHTML=signedOutHTML();
  if(!claims.dc&&!isOwner)return v.innerHTML='<div class="center"><h1>請改用 Discord 登入</h1><p>這個網站的團員身分是用 Discord 帳號確認的。</p><button class="btn" data-act="logout">登出</button></div>';
  if(!ready.users||!ready.statics)return v.innerHTML='<div class="center muted">載入中…</div>';
  if(fromSnapshot&&(view==="profile"||(view==="manage"&&mgTab==="team")))return; // 填表中不重畫
  if(claims.dc&&!users[me.uid])view="profile";
  if(view==="profile")return v.innerHTML=profileHTML(),bindProfile();
  if(!statics.length)return v.innerHTML=isOwner?createStaticHTML():'<div class="center"><h1>還沒有固定團</h1><p>團長建立固定團後，這裡就會出現。</p>'+scheduleLink()+'</div>';
  if(view==="manage"&&isOwner)return v.innerHTML=manageHTML(),afterManage();
  view="home";v.innerHTML=homeHTML();
}
function renderMe(){
  const el=$("#me");
  if(!me){el.innerHTML="";return;}
  const p=users[me.uid];
  const nm=p?nameOf(p):(claims.dcn||me.email||"");
  el.innerHTML=(claims.dc?'<img src="'+esc(avatarUrl(p||{dc:claims.dc,avatar:claims.dca}))+'" alt="">':'')+'<span>'+esc(nm)+(isOwner?'（團長）':'')+'</span>'+
    (claims.dc&&p?'<button class="linkbtn" data-act="profile">我的角色卡</button>':'')+'<button class="linkbtn" data-act="logout">登出</button>';
  const st=cur();document.title=st?st.name+"｜光之戰士飛地":"光之戰士飛地";
}
const scheduleLink=()=>'<p><a href="schedule.html">前往出席時間調查 →</a></p>';
function signedOutHTML(){
  return'<div class="center"><h1>光之戰士飛地</h1><p>用 Discord 登入，查看固定團的陣容、攻略和配裝進度。</p>'+
    '<button class="btn discord" data-act="dclogin">用 Discord 登入</button>'+
    '<p class="small" style="margin-top:28px"><a href="schedule.html">只想填出席時間？不用登入，直接前往 →</a></p>'+
    '<p class="small"><button class="linkbtn" data-act="glogin">團長備用登入（Google）</button></p></div>';
}

/* 角色卡 */
function profileHTML(){
  const p=users[me.uid];const first=!p;
  if(!profileDraft)profileDraft=p?{...p,subJobs:[...(p.subJobs||[])]}:{nick:dirName(claims.dc)||claims.dcn||"",charName:"",server:"",job:"",subJobs:[],bio:""};
  const d=profileDraft;
  return'<div class="panel"><h2>'+(first?'歡迎'+(dirName(claims.dc)?'，'+esc(dirName(claims.dc)):'')+'！先建立你的角色卡':'編輯我的角色卡')+'</h2>'+
    (first?'<p class="muted">這些資料會顯示在固定團的陣容上，之後隨時可以修改。</p>':'')+
    '<div class="form">'+
    '<div class="row2"><label>暱稱<input id="pNick" maxlength="20" value="'+esc(d.nick)+'" placeholder="團裡大家怎麼叫你"></label>'+
    '<label>遊戲角色名稱<input id="pChar" maxlength="30" value="'+esc(d.charName)+'" placeholder="例如：Satoru Gojo"></label></div>'+
    '<div class="row2"><label>伺服器<input id="pServer" maxlength="20" value="'+esc(d.server)+'" placeholder="例如：Ultros、鳳凰"></label>'+
    '<label>主職業<select id="pJob">'+jobOptions(d.job,"請選擇")+'</select></label></div>'+
    '<div><div style="font-size:14px;font-weight:500;margin-bottom:4px">副職業（可複選）</div><div class="chips" id="pSubs">'+
      JOBS.map(j=>'<button type="button" class="chip" data-sub="'+j.k+'" aria-pressed="'+d.subJobs.includes(j.k)+'">'+j.k+'</button>').join("")+'</div></div>'+
    '<label>開荒宣言（選填）<input id="pBio" maxlength="60" value="'+esc(d.bio)+'" placeholder="例如：這次一定要過 P5！"></label>'+
    '<div><button class="btn primary" data-act="saveProfile">'+(first?'建立角色卡':'儲存')+'</button>'+(first?'':' <button class="btn" data-act="cancelProfile">取消</button>')+'</div>'+
    '</div></div>';
}
function bindProfile(){
  const sync=()=>{const d=profileDraft;d.nick=$("#pNick").value;d.charName=$("#pChar").value;d.server=$("#pServer").value;d.job=$("#pJob").value;d.bio=$("#pBio").value;};
  ["#pNick","#pChar","#pServer","#pJob","#pBio"].forEach(s=>$(s).addEventListener("input",sync));
  $("#pJob").addEventListener("change",sync);
}
async function saveProfile(btn){
  const d=profileDraft;
  const nick=d.nick.trim(),charName=d.charName.trim(),server=d.server.trim();
  if(!nick){toast("請填暱稱");return;}
  if(!d.job){toast("請選主職業");return;}
  btn.disabled=true;
  const p=users[me.uid];
  try{
    const data={
      dc:claims.dc,dcName:claims.dcn||"",avatar:claims.dca||"",
      nick,charName,server,job:d.job,subJobs:d.subJobs.filter(k=>k!==d.job).slice(0,10),bio:d.bio.trim(),
      createdAt:p&&p.createdAt?p.createdAt:Date.now(),updatedAt:Date.now()
    };
    await setDoc(doc(db,"users",me.uid),data);
    users[me.uid]=data; // 先更新畫面，不等資料庫回傳
    profileDraft=null;view="home";toast(p?"已更新角色卡":"角色卡建立完成！");render();
  }catch(e){console.error(e);toast("儲存失敗，請再試一次");btn.disabled=false;}
}

/* 建立固定團（團長） */
function createStaticHTML(){
  return'<div class="panel"><h2>建立固定團</h2><div class="form">'+
    '<label>固定團名稱<input id="cName" maxlength="30" value="絕伊甸固定團"></label>'+
    '<div class="hint">目標副本預設會放入絕伊甸，以及打 BiS 用的輕量級零式 1～4 層，之後可以在「管理」裡修改。</div>'+
    '<div><button class="btn primary" data-act="createStatic">建立</button></div></div></div>'+
    (claims.dc?'':'<div class="notice">你目前是用 Google 備用登入。建議改用 Discord 登入，才能建立自己的角色卡並出現在陣容裡。</div>');
}
async function createStatic(btn){
  const name=$("#cName").value.trim();if(!name){toast("請輸入名稱");return;}
  btn.disabled=true;
  try{
    const ref=await addDoc(collection(db,"statics"),{name,slogan:"",intro:"",targets:DEFAULT_TARGETS,roles:{},
      modules:{guide:"owner",bis:"owner",mit:"owner",review:"owner"},createdAt:Date.now()});
    curTid=ref.id;watchMembers();toast("已建立「"+name+"」");
  }catch(e){console.error(e);toast("建立失敗：請確認 Firestore 規則已更新");btn.disabled=false;}
}

/* 團隊首頁 */
function homeHTML(){
  const st=cur();const m=myMember();
  const picker=statics.length>1?'<div class="chips" style="margin-bottom:14px">'+statics.map(s=>'<button class="chip" data-tid="'+esc(s.id)+'" aria-pressed="'+(s.id===curTid)+'">'+esc(s.name)+'</button>').join("")+'</div>':"";
  let h=picker+heroHTML(st);
  if(isOwner)h+='<div style="margin:-8px 0 18px"><button class="btn sm" data-act="manage">管理固定團</button></div>';
  if(!isOwner&&(!m||m.status!=="active"))return h+joinHTML(m)+scheduleLink();
  return h+rosterHTML(st)+modulesHTML(st);
}
function heroHTML(st){
  const t=st.targets||[];
  return'<section class="hero"><h1>'+esc(st.name)+'</h1>'+(st.slogan?'<p class="slogan">'+esc(st.slogan)+'</p>':'')+
    (st.intro?'<p class="intro">'+esc(st.intro)+'</p>':'')+
    (t.length?'<div class="targets">'+t.map((x,i)=>'<span class="target'+(i===0?' main':'')+'">'+esc(x.n)+'</span>').join("")+'</div>':'')+'</section>';
}
function joinHTML(m){
  if(m&&m.status==="pending")return'<div class="panel"><h2>已送出加入申請</h2><p class="muted">等待團長核准。核准後重新整理這個頁面就能看到完整內容。</p><button class="btn sm" data-act="withdraw">取消申請</button></div>';
  return'<div class="panel"><h2>加入這個固定團</h2><p class="muted">送出申請後，由團長核准。</p><div class="form"><label>想對團長說的話（選填）<input id="jNote" maxlength="100" placeholder="例如：我是 D3 的鐮刀"></label><div><button class="btn primary" data-act="join">申請加入</button></div></div></div>';
}
function cardHTML(slot,uid){
  const u=uid&&users[uid];
  if(!u)return'<div class="slot r-'+slot.r+' empty"><span class="lab">'+slot.k+'</span>尚未分配</div>';
  const j=JOB[u.job];
  return'<div class="slot r-'+slot.r+'"><span class="lab">'+slot.k+'</span><img src="'+esc(avatarUrl(u))+'" alt="" loading="lazy">'+
    '<div class="nm">'+esc(nameOf(u))+'</div><div class="ch">'+esc(u.charName||"")+(u.server?' @ '+esc(u.server):'')+'</div>'+
    (j?'<div class="jb">'+esc(jobLabel(u.job))+'</div>':'')+(u.bio?'<div class="bio">「'+esc(u.bio)+'」</div>':'')+'</div>';
}
function rosterHTML(st){
  const roles=st.roles||{};const active=Object.keys(members).filter(id=>members[id].status==="active");
  const assigned=new Set(Object.values(roles));
  const rest=active.filter(id=>!assigned.has(id));
  return'<div class="panel"><h2>陣容</h2><div class="roster">'+SLOTS.map(s=>cardHTML(s,roles[s.k])).join("")+'</div>'+
    (rest.length?'<h3>其他成員</h3><div class="others">'+rest.map(id=>{const u=users[id];const j=u&&JOB[u.job];return'<div class="person"><img src="'+esc(avatarUrl(u))+'" alt=""><span>'+esc(nameOf(u))+'</span>'+(j?'<span class="jb '+j.r+'">'+j.k+'</span>':'')+'</div>';}).join("")+'</div>':'')+'</div>';
}
function modulesHTML(st){
  const mods=(st.modules||{});
  const vis=MODULES.filter(x=>canSee(x.k));
  return'<div class="panel"><h2>功能</h2><div class="mods">'+
    '<a class="mod" href="schedule.html"><span class="t">出席時間調查</span><span class="d">填寫可以出團的時段</span><span class="badge open">使用中</span></a>'+
    vis.map(x=>{const s=mods[x.k]||"owner";return'<button class="mod" data-mod="'+x.k+'"><span class="t">'+x.n+'</span><span class="d">'+x.d+'</span>'+
      (isOwner?'<span class="badge'+(s==="all"?' open':'')+'">'+MOD_STATUS[s]+'可見・建置中</span>':'<span class="badge">建置中</span>')+'</button>';}).join("")+
    '</div>'+(!isOwner&&!vis.length?'<p class="muted small" style="margin:12px 0 0">更多功能準備中，敬請期待。</p>':'')+'</div>';
}

/* 管理（團長） */
function manageHTML(){
  const st=cur();
  const pending=Object.keys(members).filter(id=>members[id].status==="pending");
  return'<div style="margin-bottom:12px"><button class="linkbtn" data-act="home">← 回固定團首頁</button></div>'+
    '<h1 style="font-family:Noto Serif TC,serif;margin:0 0 12px">管理「'+esc(st.name)+'」</h1>'+
    '<nav class="tabs">'+[["members","成員"+(pending.length?"（"+pending.length+" 個申請）":"")],["modules","功能開放"],["team","團隊資料"]].map(([k,n])=>'<button class="tab" data-mg="'+k+'" aria-selected="'+(mgTab===k)+'">'+n+'</button>').join("")+'</nav>'+
    (mgTab==="members"?membersMgHTML(st,pending):mgTab==="modules"?modulesMgHTML(st):teamMgHTML(st));
}
function membersMgHTML(st,pending){
  const roles=st.roles||{};const slotOf=id=>Object.keys(roles).find(k=>roles[k]===id)||"";
  const active=Object.keys(members).filter(id=>members[id].status==="active").sort((a,b)=>{
    const ia=SLOTS.findIndex(s=>s.k===slotOf(a)),ib=SLOTS.findIndex(s=>s.k===slotOf(b));return(ia<0?99:ia)-(ib<0?99:ib);});
  const outsiders=Object.keys(users).filter(id=>!members[id]);
  let h='';
  if(pending.length)h+='<div class="panel"><h2>加入申請</h2>'+pending.map(id=>{const u=users[id],m=members[id];
    return'<div class="req"><img src="'+esc(avatarUrl(u))+'" alt=""><div class="info"><b>'+esc(nameOf(u))+'</b> <span class="muted small">'+esc(u?(u.charName||"")+" "+jobLabel(u.job):"")+'</span>'+
      (m.note?'<div class="small">「'+esc(m.note)+'」</div>':'')+'</div><button class="btn sm primary" data-approve="'+id+'">核准</button><button class="btn sm danger" data-reject="'+id+'">拒絕</button></div>';}).join("")+
    '<label class="small" style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="welcomeOn" checked> 核准時在 Discord 發歡迎公告</label></div>';
  h+='<div class="panel"><h2>成員（'+active.length+'）</h2>';
  if(!active.length)h+='<p class="muted">還沒有成員。可以從下方把已登入過的人直接加入，或等他們申請。</p>';
  else h+='<div class="mtable"><div class="inner"><div class="mrow mhead"><span>成員</span><span>職責</span>'+MODULES.map(x=>'<span>'+x.n+'</span>').join("")+'<span></span></div>'+
    active.map(id=>{const u=users[id],m=members[id],sl=slotOf(id);
      return'<div class="mrow"><div class="who"><img src="'+esc(avatarUrl(u))+'" alt=""><div><b>'+esc(nameOf(u))+'</b><div class="small muted">'+esc(u?jobLabel(u.job):"")+'</div></div></div>'+
        '<select data-slot="'+id+'" aria-label="職責"><option value="">無</option>'+SLOTS.map(s=>'<option'+(s.k===sl?' selected':'')+'>'+s.k+'</option>').join("")+'</select>'+
        MODULES.map(x=>{const v=(m.perms||{})[x.k]||"none";return'<select data-perm="'+id+'" data-mod="'+x.k+'" aria-label="'+x.n+'權限">'+Object.entries(PERM).map(([k,n])=>'<option value="'+k+'"'+(k===v?' selected':'')+'>'+n+'</option>').join("")+'</select>';}).join("")+
        (id===me.uid?'<span></span>':'<button class="btn sm danger" data-remove="'+id+'">移出</button>')+'</div>';}).join("")+'</div></div>'+
    '<p class="hint" style="margin:8px 0 0">權限只在功能設為「指定成員」或「全團開放」時才有作用；「不可見」在「指定成員」模式下會看不到該功能。</p>';
  h+='</div>';
  h+='<div class="panel"><h2>直接加入成員</h2>'+(outsiders.length?'<p class="muted small">這些人已經用 Discord 登入、建立過角色卡，但還不是成員。</p><div class="others">'+
    outsiders.map(id=>{const u=users[id];return'<div class="person"><img src="'+esc(avatarUrl(u))+'" alt=""><span>'+esc(nameOf(u))+(id===me.uid?'（你）':'')+'</span><button class="btn sm" data-add="'+id+'">加入</button></div>';}).join("")+'</div>':
    '<p class="muted">目前沒有其他登入過的人。請團員先用 Discord 登入並建立角色卡。</p>')+'</div>';
  return h;
}
function modulesMgHTML(st){
  const mods=st.modules||{};
  return'<div class="panel"><h2>功能開放狀態</h2><p class="muted small">建置期間維持「只有團長」，確認好用後再開放。各功能的資料也會由資料庫規則依這個設定把關。</p>'+
    MODULES.map(x=>'<div class="modrow"><div><b>'+x.n+'</b><div class="small muted">'+x.d+'</div></div><select class="sel" data-modstatus="'+x.k+'">'+
      Object.entries(MOD_STATUS).map(([k,n])=>'<option value="'+k+'"'+((mods[x.k]||"owner")===k?' selected':'')+'>'+n+'</option>').join("")+'</select></div>').join("")+
    '<p class="hint" style="margin:10px 0 0">「指定成員」＝權限不是「不可見」的成員；「全團開放」＝所有成員都看得到，能不能編輯依各自權限。</p></div>';
}
let tgtDraft=null;
function teamMgHTML(st){
  if(!tgtDraft)tgtDraft=(st.targets||[]).map(x=>({...x}));
  return'<div class="panel"><h2>團隊資料</h2><div class="form">'+
    '<label>固定團名稱<input id="tName" maxlength="30" value="'+esc(st.name)+'"></label>'+
    '<label>口號（選填）<input id="tSlogan" maxlength="40" value="'+esc(st.slogan||"")+'" placeholder="例如：一起把伊甸打穿！"></label>'+
    '<label>簡介（選填）<textarea id="tIntro" rows="3" maxlength="400" placeholder="開荒時間、目標、注意事項……">'+esc(st.intro||"")+'</textarea></label>'+
    '<div><div style="font-size:14px;font-weight:500;margin-bottom:6px">目標副本（第一個會標示為主要目標）</div><div id="tgtList">'+tgtListHTML()+'</div>'+
    '<button class="btn sm" data-act="tgtAdd">＋ 新增副本</button><div class="hint">之後 BiS 追蹤和攻略法整理會依這份清單分類，例如輕量級零式的掉落紀錄。</div></div>'+
    '<div><button class="btn primary" data-act="saveTeam">儲存團隊資料</button></div></div></div>';
}
function tgtListHTML(){
  return tgtDraft.map((x,i)=>'<div class="tgtrow"><input data-tgtn="'+i+'" maxlength="30" value="'+esc(x.n)+'" aria-label="副本名稱"><select data-tgtt="'+i+'" aria-label="類型">'+
    Object.entries(TARGET_TYPES).map(([k,n])=>'<option value="'+k+'"'+(x.t===k?' selected':'')+'>'+n+'</option>').join("")+'</select><button class="x" data-tgtrm="'+i+'" aria-label="移除">×</button></div>').join("");
}
function afterManage(){
  if(mgTab!=="team")return;
  const list=$("#tgtList");
  list.addEventListener("input",e=>{const i=e.target.dataset.tgtn;if(i!=null)tgtDraft[+i].n=e.target.value;});
  list.addEventListener("change",e=>{const i=e.target.dataset.tgtt;if(i!=null)tgtDraft[+i].t=e.target.value;});
}

/* ---------- 動作 ---------- */
async function workerPost(path,body){
  const idToken=await me.getIdToken();
  const r=await fetch(W+path,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...body,idToken})});
  return r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));
}
async function welcome(uid){
  const u=users[uid],st=cur();if(!u||!u.dc||!st)return;
  try{const j=await workerPost("/welcome",{dc:u.dc,name:nameOf(u),job:jobLabel(u.job),charName:u.charName||"",static:st.name});
    if(!j.ok)toast("歡迎公告沒發出去："+(j.error||""));}catch(e){console.error(e);}
}
async function setSlot(uid,slot){
  const st=cur();const roles={...(st.roles||{})};
  for(const k of Object.keys(roles))if(roles[k]===uid)delete roles[k];
  if(slot)roles[slot]=uid;
  await updateDoc(doc(db,"statics",curTid),{roles});
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const act=t.closest("[data-act]");
  try{
    if(act){
      const a=act.dataset.act;
      if(a==="dclogin"){location.href=W+"/auth/discord/login?return="+encodeURIComponent(location.origin+location.pathname);return;}
      if(a==="glogin"){await signInWithPopup(auth,new GoogleAuthProvider());return;}
      if(a==="logout"){await signOut(auth);view="home";return;}
      if(a==="profile"){profileDraft=null;view="profile";render();return;}
      if(a==="cancelProfile"){profileDraft=null;view="home";render();return;}
      if(a==="saveProfile")return saveProfile(act);
      if(a==="createStatic")return createStatic(act);
      if(a==="manage"){view="manage";tgtDraft=null;render();return;}
      if(a==="home"){view="home";render();return;}
      if(a==="join"){
        await setDoc(doc(db,"statics",curTid,"members",me.uid),{status:"pending",requestedAt:Date.now(),note:($("#jNote").value||"").trim().slice(0,100)});
        toast("已送出申請");return;
      }
      if(a==="withdraw"){await deleteDoc(doc(db,"statics",curTid,"members",me.uid));toast("已取消申請");return;}
      if(a==="tgtAdd"){tgtDraft.push({n:"",t:"savage"});$("#tgtList").innerHTML=tgtListHTML();return;}
      if(a==="saveTeam"){
        const name=$("#tName").value.trim();if(!name){toast("請輸入名稱");return;}
        const targets=tgtDraft.map(x=>({n:x.n.trim(),t:x.t})).filter(x=>x.n).slice(0,20);
        act.disabled=true;
        await updateDoc(doc(db,"statics",curTid),{name,slogan:$("#tSlogan").value.trim(),intro:$("#tIntro").value.trim(),targets});
        tgtDraft=null;toast("已儲存");act.disabled=false;return;
      }
    }
    const tid=t.closest("[data-tid]");if(tid){curTid=tid.dataset.tid;watchMembers();render();return;}
    const mg=t.closest("[data-mg]");if(mg){mgTab=mg.dataset.mg;tgtDraft=null;render();return;}
    const md=t.closest("button[data-mod]");if(md&&!t.closest("select")){toast("「"+MODULES.find(x=>x.k===md.dataset.mod).n+"」還在建置中");return;}
    const rm=t.closest("[data-tgtrm]");if(rm){tgtDraft.splice(+rm.dataset.tgtrm,1);$("#tgtList").innerHTML=tgtListHTML();return;}
    const sub=t.closest("[data-sub]");if(sub){const k=sub.dataset.sub,s=profileDraft.subJobs;const i=s.indexOf(k);i<0?s.push(k):s.splice(i,1);sub.setAttribute("aria-pressed",i<0);return;}
    const ap=t.closest("[data-approve]");if(ap){
      const id=ap.dataset.approve;ap.disabled=true;const send=$("#welcomeOn")?$("#welcomeOn").checked:true;
      await updateDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已核准 "+nameOf(users[id]));if(send)welcome(id);return;
    }
    const rj=t.closest("[data-reject]");if(rj){if(!armedTwice("rj"+rj.dataset.reject,rj,"確定？"))return;await deleteDoc(doc(db,"statics",curTid,"members",rj.dataset.reject));toast("已拒絕");return;}
    const ad=t.closest("[data-add]");if(ad){
      const id=ad.dataset.add;ad.disabled=true;
      await setDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已加入 "+nameOf(users[id]));if(id!==me.uid)welcome(id);return;
    }
    const rmv=t.closest("[data-remove]");if(rmv){
      const id=rmv.dataset.remove;if(!armedTwice("rm"+id,rmv,"確定移出？"))return;
      await setSlot(id,"");await deleteDoc(doc(db,"statics",curTid,"members",id));toast("已移出");return;
    }
  }catch(e2){console.error(e2);toast(e2&&e2.code==="permission-denied"?"沒有權限執行這個動作":"操作失敗，請再試一次");}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.slot!==undefined){await setSlot(t.dataset.slot,t.value);toast(t.value?"已設為 "+t.value:"已取消職責");return;}
    if(t.dataset.perm){await updateDoc(doc(db,"statics",curTid,"members",t.dataset.perm),{["perms."+t.dataset.mod]:t.value});toast("已更新權限");return;}
    if(t.dataset.modstatus){await updateDoc(doc(db,"statics",curTid),{["modules."+t.dataset.modstatus]:t.value});toast("已更新為「"+MOD_STATUS[t.value]+"」");return;}
  }catch(e2){console.error(e2);toast("更新失敗");}
});
</script>
