<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光之戰士飛地</title>
<script>
  // 舊的調查連結（?s=…）自動轉到出席表頁

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8ECF3; --surface:#F7F9FC; --ink:#1B2232; --muted:#5A6377; --line:#C9D1DE;
  --accent:#2F63C9; --accent-ink:#FFFFFF; --gold:#B8860B; --danger:#C23A4F;
  --tank:#2F63C9; --heal:#2E8B57; --dps:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
    --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
    --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
  --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
  --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1040px;margin:0 auto;padding:20px 16px 48px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{text-decoration:none;font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;letter-spacing:.2em;color:var(--muted);margin:0}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.me img{width:28px;height:28px;border-radius:50%}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.hero{border-left:4px solid var(--gold);padding:4px 0 4px 18px;margin:0 0 22px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,6vw,48px);line-height:1.15;margin:0}
.hero .slogan{font-size:17px;color:var(--muted);margin:6px 0 0}
.hero .intro{margin:10px 0 0;max-width:64ch;white-space:pre-wrap}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.target{padding:2px 10px;border-radius:4px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.target.main{border-color:var(--gold);color:var(--gold);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.panel h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 0 12px}
.panel h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.discord{background:#5865F2;border-color:#5865F2;color:#fff;font-size:16px;padding:12px 22px;font-weight:700}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form{display:grid;gap:12px;max-width:620px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:500}
.form input,.form textarea,.form select,.sel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jobcat{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.jobcat .catn{font-size:13px;color:var(--muted);padding-top:4px}
@media (max-width:560px){.jobcat{grid-template-columns:1fr;gap:4px}}
.chip.jc-tank[aria-pressed="true"]{background:var(--tank);border-color:var(--tank);color:#fff}
.chip.jc-heal[aria-pressed="true"]{background:var(--heal);border-color:var(--heal);color:#fff}
.chip.jc-dps[aria-pressed="true"]{background:var(--dps);border-color:var(--dps);color:#fff}

/* roster */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;background:var(--surface);padding:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.slot.r-tank{--rc:var(--tank)} .slot.r-heal{--rc:var(--heal)} .slot.r-dps{--rc:var(--dps)}
.slot .lab{position:absolute;top:6px;left:8px;font-weight:900;font-family:"Noto Serif TC",serif;color:var(--rc);font-size:15px}
.slot img{width:56px;height:56px;border-radius:50%;margin:8px 0 4px;background:var(--bg)}
.slot .nm{font-weight:700}
.slot .ch{font-size:12px;color:var(--muted);word-break:break-all}
.slot .jb{margin-top:4px;font-size:12px;font-weight:700;color:var(--rc)}
.slot.empty{justify-content:center;color:var(--muted);border-style:dashed;border-top-style:solid}
.bio{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.others{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.person img{width:28px;height:28px;border-radius:50%}
.person .jb{font-size:12px;font-weight:700}
.jb.tank{color:var(--tank)} .jb.heal{color:var(--heal)} .jb.dps{color:var(--dps)}

/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mod{display:grid;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.mod:hover{border-color:var(--accent)}
.mod .t{font-weight:700;font-size:16px}
.mod .d{font-size:13px;color:var(--muted)}
.badge{justify-self:start;font-size:12px;padding:0 8px;border-radius:4px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:700}
.badge.open{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--heal)}

/* manage */
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 90px repeat(4,minmax(96px,1fr)) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .who{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .who img{width:30px;height:30px;border-radius:50%}
.mrow .who div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead{font-size:12px;color:var(--muted);font-weight:700;border-top:0;padding-bottom:0}
.mtable{overflow-x:auto}
.mtable .inner{min-width:760px}
.mrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:13px;width:100%}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
.req img{width:36px;height:36px;border-radius:50%}
.req .info{flex:1;min-width:180px}
.modrow{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.modrow:first-child{border-top:0}
.tgtrow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:6px}
.tgtrow input,.tgtrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px}
.x{border:0;background:none;color:var(--muted);font-size:18px;border-radius:50%}
.x:hover{color:var(--danger)}

.center{text-align:center;padding:48px 16px}
.center h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,6vw,44px);margin:0 0 8px}
.center p{max-width:46ch;margin:0 auto 22px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));margin:0 0 16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.phead h2{margin:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.teamcard{display:grid;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;background:var(--surface);color:var(--ink)}
.teamcard:hover{border-color:var(--accent);border-left-color:var(--gold)}
.teamcard .tn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px}
.teamcard .avs{display:flex;flex-wrap:wrap;gap:2px}
.teamcard .avs img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px;background:var(--bg)}
.teamcard .rel{justify-self:start;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.crystals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crystal{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;background:var(--bg)}
.crystal.r-tank{--rc:var(--tank)} .crystal.r-heal{--rc:var(--heal)} .crystal.r-dps{--rc:var(--dps)}
.crystal img{width:44px;height:44px;border-radius:50%;flex:none;background:var(--surface)}
.crystal .cbody{min-width:0}
.crystal .nm{font-weight:700}
.crystal .ch{font-size:12px;color:var(--muted);word-break:break-all}
.crystal .jb{font-size:12px;font-weight:700;color:var(--rc)}
.crystal .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.crystal .tags .target{font-size:11px;padding:0 6px}
.you{margin-left:6px;font-size:11px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface);font-weight:700;vertical-align:middle}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .who{display:flex;align-items:center;gap:8px;min-width:140px}
.lrow .who img{width:30px;height:30px;border-radius:50%}
.lrow .caps{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1;font-size:14px}
.lrow .caps label{display:flex;align-items:center;gap:4px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .sel{flex:1;min-width:180px}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <a class="brand" id="brand" href="./" data-act="lobby">光之戰士飛地</a>
    <div class="me" id="me"></div>
  </header>
  <main id="view"><div class="center muted">載入中…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { FIREBASE_CONFIG, OWNER_EMAIL, OWNER_DISCORD_ID, WORKER_URL, DIRECTORY } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, collectionGroup, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCustomToken, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ---------- 常數 ---------- */
const JOBS=[
  {k:"PLD",n:"騎士",c:"tank"},{k:"WAR",n:"戰士",c:"tank"},{k:"DRK",n:"暗黑騎士",c:"tank"},{k:"GNB",n:"絕槍戰士",c:"tank"},
  {k:"WHM",n:"白魔道士",c:"heal"},{k:"SCH",n:"學者",c:"heal"},{k:"AST",n:"占星術師",c:"heal"},{k:"SGE",n:"賢者",c:"heal"},
  {k:"MNK",n:"武僧",c:"melee"},{k:"DRG",n:"龍騎士",c:"melee"},{k:"NIN",n:"忍者",c:"melee"},{k:"SAM",n:"武士",c:"melee"},{k:"RPR",n:"奪魂者",c:"melee"},{k:"VPR",n:"毒蛇劍士",c:"melee"},
  {k:"BRD",n:"吟遊詩人",c:"phys"},{k:"MCH",n:"機工士",c:"phys"},{k:"DNC",n:"舞者",c:"phys"},
  {k:"BLM",n:"黑魔道士",c:"magic"},{k:"SMN",n:"召喚士",c:"magic"},{k:"RDM",n:"赤魔道士",c:"magic"},{k:"PCT",n:"繪靈法師",c:"magic"}
].map(j=>({...j,r:j.c==="tank"||j.c==="heal"?j.c:"dps"}));
const JOB_CATS=[{k:"tank",n:"防護職業"},{k:"heal",n:"治療職業"},{k:"melee",n:"近戰職業"},{k:"phys",n:"遠程物理職業"},{k:"magic",n:"遠程魔法職業"}];
const SERVERS=["伊弗利特","迦樓羅","利維坦","鳳凰","奧汀","巴哈姆特","泰坦"];
const JOB=Object.fromEntries(JOBS.map(j=>[j.k,j]));
const ROLE_NAME={tank:"坦克",heal:"補師",dps:"輸出"};
const SLOTS=[{k:"MT",r:"tank"},{k:"ST",r:"tank"},{k:"H1",r:"heal"},{k:"H2",r:"heal"},{k:"D1",r:"dps"},{k:"D2",r:"dps"},{k:"D3",r:"dps"},{k:"D4",r:"dps"}];
const MODULES=[
  {k:"guide",n:"攻略法整理",d:"各階段機制、解法與站位分配"},
  {k:"bis",n:"BiS 追蹤",d:"每個人的配裝進度與缺件"},
  {k:"mit",n:"減傷軸",d:"時間軸與個人減傷分工"},
  {k:"review",n:"復盤紀錄",d:"每次開荒的進度與檢討"}
];
const MOD_STATUS={owner:"只有團長",selected:"指定成員",all:"全團開放"};
const PERM={none:"不可見",view:"可檢視",own:"編輯自己的",all:"編輯全部"};
const DEFAULT_PERMS={guide:"view",bis:"own",mit:"view",review:"own"};
const TARGET_TYPES={ultimate:"絕境戰",savage:"零式",other:"其他"};
const DEFAULT_TARGETS=[
  {n:"絕伊甸",t:"ultimate"},{n:"輕量級零式 1 層（M1S）",t:"savage"},{n:"輕量級零式 2 層（M2S）",t:"savage"},
  {n:"輕量級零式 3 層（M3S）",t:"savage"},{n:"輕量級零式 4 層（M4S）",t:"savage"}
];

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const W=WORKER_URL.replace(/\/+$/,"");
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2800);}
const armed={};
function armedTwice(key,btn,label){if(armed[key]&&Date.now()-armed[key]<4000)return true;armed[key]=Date.now();btn.textContent=label;return false;}
function dirName(dc){const p=DIRECTORY.find(x=>x.did===dc);return p?p.n:"";}
function avatarUrl(u){
  if(!u||!u.dc)return "https://cdn.discordapp.com/embed/avatars/0.png";
  if(u.avatar)return "https://cdn.discordapp.com/avatars/"+u.dc+"/"+u.avatar+".png?size=128";
  let i=0;try{i=Number((BigInt(u.dc)>>22n)%6n);}catch(_){}
  return "https://cdn.discordapp.com/embed/avatars/"+i+".png";
}
const nameOf=u=>u?(u.nick||u.dcName||"未命名"):"未知成員";
const jobLabel=k=>JOB[k]?JOB[k].n:"";
function jobOptions(sel,blank){
  let h=blank?'<option value="">'+blank+'</option>':"";
  for(const c of JOB_CATS)h+='<optgroup label="'+c.n+'">'+JOBS.filter(j=>j.c===c.k).map(j=>'<option value="'+j.k+'"'+(j.k===sel?" selected":"")+'>'+j.n+'</option>').join("")+'</optgroup>';
  return h;
}

/* ---------- 狀態 ---------- */
let app,db,auth,me=null,claims={},isOwner=false;
let users={},statics=[],mem={},curTid=null,view="lobby",mgTab="";
let unsub=[],ready={users:false,statics:false,mem:false};
let profileDraft=null,tgtDraft=null;
const urlTeam=()=>new URLSearchParams(location.search).get("team");

/* ---------- 啟動 ---------- */
app=initializeApp(FIREBASE_CONFIG);db=getFirestore(app);auth=getAuth(app);
{
  const m=location.hash.match(/dctoken=([^&]+)/),er=location.hash.match(/dcerror=([^&]+)/);
  if(m||er)history.replaceState(null,"",location.pathname+location.search);
  if(m)signInWithCustomToken(auth,decodeURIComponent(m[1])).catch(e=>{console.error(e);toast("Discord 登入失敗，請再試一次");});
  if(er)toast("Discord 登入失敗："+decodeURIComponent(er[1]));
}
curTid=urlTeam();view=curTid?"team":"lobby";
onAuthStateChanged(auth,async u=>{
  me=u;claims={};
  unsub.forEach(f=>f());unsub=[];
  users={};statics=[];mem={};ready={users:false,statics:false,mem:false};
  if(u){try{claims=(await u.getIdTokenResult()).claims||{};}catch(_){}}
  isOwner=!!(u&&((u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase())||claims.dc===OWNER_DISCORD_ID));
  if(u&&(claims.dc||isOwner))subscribe();
  render();
});
function subscribe(){
  unsub.push(onSnapshot(collection(db,"users"),s=>{
    users={};s.docs.forEach(d=>users[d.id]=d.data());ready.users=true;syncDiscordInfo();render(true);
  },err));
  unsub.push(onSnapshot(collection(db,"statics"),s=>{
    statics=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));ready.statics=true;render(true);
  },err));
  unsub.push(onSnapshot(collectionGroup(db,"members"),s=>{
    mem={};s.docs.forEach(d=>{const p=d.ref.parent.parent;if(!p)return;(mem[p.id]||(mem[p.id]={}))[d.id]=d.data();});ready.mem=true;render(true);
  },err));
}
function err(e){console.error(e);toast(e&&e.code==="permission-denied"?"讀取被拒絕，請確認 Firestore 規則已更新":"讀取資料失敗");}
let synced=false;
function syncDiscordInfo(){
  if(synced||!claims.dc||!me)return;const p=users[me.uid];if(!p)return;synced=true;
  if(p.dcName!==(claims.dcn||"")||p.avatar!==(claims.dca||""))
    updateDoc(doc(db,"users",me.uid),{dcName:claims.dcn||"",avatar:claims.dca||"",updatedAt:Date.now()}).catch(console.error);
}

/* ---------- 導覽 ---------- */
function go(v,tid){
  view=v;if(tid!==undefined)curTid=tid;
  const inTeam=(v==="team"||v==="manage")&&curTid;
  const url=location.pathname+(inTeam?"?team="+encodeURIComponent(curTid):"");
  if(url!==location.pathname+location.search)history.pushState(null,"",url);
  if(v==="manage"){mgTab="";tgtDraft=null;}
  window.scrollTo(0,0);render();
}
window.addEventListener("popstate",()=>{curTid=urlTeam();view=curTid?"team":"lobby";render();});

/* ---------- 權限判斷 ---------- */
const cur=()=>statics.find(s=>s.id===curTid)||null;
const membersOf=tid=>mem[tid]||{};
const myMember=()=>me?membersOf(curTid)[me.uid]:null;
const leaderOf=st=>(me&&st&&(st.leaders||{})[me.uid])||null;
function capsOf(st){if(isOwner)return{members:true,info:true,modules:true};const l=leaderOf(st);return l?{members:!!l.members,info:!!l.info,modules:!!l.modules}:{};}
const canManage=st=>isOwner||Object.values(capsOf(st)).some(Boolean);
function canSee(mod){
  const st=cur();if(isOwner||capsOf(st).modules)return true;
  const m=myMember();if(!st||!m||m.status!=="active")return false;
  const status=(st.modules||{})[mod]||"owner";const p=(m.perms||{})[mod]||"none";
  if(status==="all")return true;
  if(status==="selected")return p!=="none";
  return false;
}
const activeIds=tid=>Object.keys(membersOf(tid)).filter(id=>membersOf(tid)[id].status==="active");
const leaderNames=st=>Object.keys(st.leaders||{}).map(id=>nameOf(users[id]));

/* ---------- 畫面 ---------- */
function render(fromSnapshot){
  renderMe();
  const v=$("#view");
  if(!me)return v.innerHTML=signedOutHTML();
  if(!claims.dc&&!isOwner)return v.innerHTML='<div class="center"><h1>請改用 Discord 登入</h1><p>這個網站的團員身分是用 Discord 帳號確認的。</p><button class="btn" data-act="logout">登出</button></div>';
  if(!ready.users||!ready.statics||!ready.mem)return v.innerHTML='<div class="center muted">載入中…</div>';
  if(fromSnapshot&&(view==="profile"||view==="create"||(view==="manage"&&mgTab==="team")))return; // 填表中不重畫
  if(claims.dc&&!users[me.uid])view="profile";
  if(view==="profile")return v.innerHTML=profileHTML(),bindProfile();
  if(view==="create"&&isOwner)return v.innerHTML=createStaticHTML();
  if(view==="team"||view==="manage"){
    const st=cur();
    if(!st){view="lobby";curTid=null;history.replaceState(null,"",location.pathname);}
    else if(view==="manage"&&canManage(st))return v.innerHTML=manageHTML(st),afterManage();
    else{view="team";return v.innerHTML=teamHTML(st);}
  }
  view="lobby";v.innerHTML=lobbyHTML();
}
function renderMe(){
  const el=$("#me");
  const st=(view==="team"||view==="manage")?cur():null;
  document.title=st?st.name+"｜光之戰士飛地":"光之戰士飛地";
  if(!me){el.innerHTML="";return;}
  const p=users[me.uid];
  const nm=p?nameOf(p):(claims.dcn||me.email||"");
  el.innerHTML=(claims.dc?'<img src="'+esc(avatarUrl(p||{dc:claims.dc,avatar:claims.dca}))+'" alt="">':'')+'<span>'+esc(nm)+(isOwner?'（總團長）':'')+'</span>'+
    (claims.dc&&p?'<button class="linkbtn" data-act="profile">我的靈魂水晶</button>':'')+'<button class="linkbtn" data-act="logout">登出</button>';
}
const toolCards=()=>
  '<a class="mod" href="schedule.html"><span class="t">出席時間調查</span><span class="d">填寫可以出團的時段</span><span class="badge open">使用中</span></a>'+
  '<a class="mod" href="moogle.html"><span class="t">莫古莫古大收集試算</span><span class="d">勾選想換的道具，計算所需稀少奇譚神點石</span><span class="badge open">使用中</span></a>';
function signedOutHTML(){
  return'<div class="center"><h1>光之戰士飛地</h1><p>用 Discord 登入，查看固定團的陣容、攻略和配裝進度。</p>'+
    '<button class="btn discord" data-act="dclogin">用 Discord 登入</button>'+
    '<p class="small" style="margin-top:28px"><a href="schedule.html">只想填出席時間？不用登入，直接前往 →</a></p>'+
    '<p class="small"><a href="moogle.html">莫古莫古大收集試算（不用登入）→</a></p>'+
    '<p class="small"><button class="linkbtn" data-act="glogin">總團長備用登入（Google）</button></p></div>';
}

/* 靈魂水晶 */
function profileHTML(){
  const p=users[me.uid];const first=!p;
  if(!profileDraft)profileDraft=p?{...p,subJobs:[...(p.subJobs||[])]}:{nick:dirName(claims.dc)||claims.dcn||"",charName:"",server:"",job:"",subJobs:[],bio:""};
  const d=profileDraft;
  return'<div class="panel"><h2>'+(first?'歡迎'+(dirName(claims.dc)?'，'+esc(dirName(claims.dc)):'')+'！先建立你的靈魂水晶':'編輯我的靈魂水晶')+'</h2>'+
    (first?'<p class="muted">這些資料會顯示在飛地和固定團的陣容上，之後隨時可以修改。</p>':'')+
    '<div class="form">'+
    '<div class="row2"><label>暱稱<input id="pNick" maxlength="20" value="'+esc(d.nick)+'" placeholder="團裡大家怎麼叫你"></label>'+
    '<label>遊戲角色名稱<input id="pChar" maxlength="30" value="'+esc(d.charName)+'" placeholder="例如：Satoru Gojo"></label></div>'+
    '<div class="row2"><label>伺服器<select id="pServer"><option value="">請選擇</option>'+
      [...SERVERS,...(d.server&&!SERVERS.includes(d.server)?[d.server]:[])].map(x=>'<option'+(x===d.server?' selected':'')+'>'+esc(x)+'</option>').join("")+'</select></label>'+
    '<label>主職業<select id="pJob">'+jobOptions(d.job,"請選擇")+'</select></label></div>'+
    '<div><div style="font-size:14px;font-weight:500;margin-bottom:4px">副職業（可複選）</div><div id="pSubs">'+
      JOB_CATS.map(c=>'<div class="jobcat"><span class="catn">'+c.n+'</span><div class="chips">'+JOBS.filter(j=>j.c===c.k).map(j=>'<button type="button" class="chip jc-'+j.r+'" data-sub="'+j.k+'" aria-pressed="'+d.subJobs.includes(j.k)+'">'+j.n+'</button>').join("")+'</div></div>').join("")+'</div></div>'+
    '<label>開荒宣言（選填）<input id="pBio" maxlength="60" value="'+esc(d.bio)+'" placeholder="例如：這次一定要過 P5！"></label>'+
    '<div><button class="btn primary" data-act="saveProfile">'+(first?'建立靈魂水晶':'儲存')+'</button>'+(first?'':' <button class="btn" data-act="cancelProfile">取消</button>')+'</div>'+
    '</div></div>';
}
function bindProfile(){
  const sync=()=>{const d=profileDraft;d.nick=$("#pNick").value;d.charName=$("#pChar").value;d.server=$("#pServer").value;d.job=$("#pJob").value;d.bio=$("#pBio").value;};
  ["#pNick","#pChar","#pServer","#pJob","#pBio"].forEach(s=>$(s).addEventListener("input",sync));
  ["#pJob","#pServer"].forEach(s=>$(s).addEventListener("change",sync));
}
async function saveProfile(btn){
  const d=profileDraft;
  const nick=d.nick.trim(),charName=d.charName.trim(),server=d.server.trim();
  if(!nick){toast("請填暱稱");return;}
  if(!d.job){toast("請選主職業");return;}
  if(!server){toast("請選伺服器");return;}
  btn.disabled=true;
  const p=users[me.uid];
  try{
    const data={dc:claims.dc,dcName:claims.dcn||"",avatar:claims.dca||"",
      nick,charName,server,job:d.job,subJobs:d.subJobs.filter(k=>k!==d.job).slice(0,10),bio:d.bio.trim(),
      createdAt:p&&p.createdAt?p.createdAt:Date.now(),updatedAt:Date.now()};
    await setDoc(doc(db,"users",me.uid),data);
    users[me.uid]=data;profileDraft=null;view=curTid?"team":"lobby";
    toast(p?"已更新靈魂水晶":"靈魂水晶建立完成！");render();
  }catch(e){console.error(e);toast("儲存失敗，請再試一次");btn.disabled=false;}
}

/* 飛地大廳 */
function lobbyHTML(){
  const p=users[me.uid];
  const ids=Object.keys(users).sort((a,b)=>(a===me.uid?-1:b===me.uid?1:nameOf(users[a]).localeCompare(nameOf(users[b]),"zh-Hant")));
  return'<section class="hero"><h1>光之戰士飛地</h1><p class="slogan">'+(p?'歡迎回來，'+esc(nameOf(p))+'。':'歡迎來到光之戰士飛地。')+'</p></section>'+
    '<div class="panel"><div class="phead"><h2>固定團</h2>'+(isOwner?'<button class="btn sm" data-act="create">＋ 建立固定團</button>':'')+'</div>'+
      (statics.length?'<div class="teams">'+statics.map(teamCardHTML).join("")+'</div>':'<p class="muted">還沒有固定團。</p>')+'</div>'+
    '<div class="panel"><h2>飛地成員（'+ids.length+'）</h2>'+
      (ids.length?'<div class="crystals">'+ids.map(crystalHTML).join("")+'</div>':'<p class="muted">還沒有人建立靈魂水晶。</p>')+'</div>'+

function teamCardHTML(st){
  const ms=membersOf(st.id),act=activeIds(st.id),mine=me&&ms[me.uid];
  const ln=leaderNames(st),t=(st.targets||[])[0];
  const rel=[leaderOf(st)?'你是團長':'',mine&&mine.status==="active"?'你是成員':mine&&mine.status==="pending"?'申請中':''].filter(Boolean).join("・")||(isOwner?'':'可申請加入');
  return'<button class="teamcard" data-team="'+esc(st.id)+'"><span class="tn">'+esc(st.name)+'</span>'+
    (t?'<span><span class="target main">'+esc(t.n)+'</span></span>':'')+
    '<span class="small muted">'+act.length+' 位成員'+(ln.length?'・團長：'+esc(ln.join("、")):'')+'</span>'+
    '<span class="avs">'+act.slice(0,10).map(id=>'<img src="'+esc(avatarUrl(users[id]))+'" alt="" loading="lazy">').join("")+'</span>'+
    (rel?'<span class="rel">'+rel+'</span>':'')+'</button>';
}
function crystalHTML(id){
  const u=users[id],j=JOB[u.job];
  const teams=statics.filter(s=>(membersOf(s.id)[id]||{}).status==="active").map(s=>s.name);
  return'<div class="crystal r-'+(j?j.r:"dps")+'"><img src="'+esc(avatarUrl(u))+'" alt="" loading="lazy"><div class="cbody">'+
    '<div class="nm">'+esc(nameOf(u))+(id===me.uid?'<span class="you">你</span>':'')+'</div>'+
    '<div class="ch">'+esc([u.charName,u.server].filter(Boolean).join(" @ "))+'</div>'+
    (j?'<div class="jb">'+esc(j.n)+'</div>':'')+(u.bio?'<div class="bio">「'+esc(u.bio)+'」</div>':'')+
    (teams.length?'<div class="tags">'+teams.map(n=>'<span class="target">'+esc(n)+'</span>').join("")+'</div>':'')+'</div></div>';
}

/* 建立固定團（總團長） */
function createStaticHTML(){
  return'<div style="margin-bottom:12px"><button class="linkbtn" data-act="lobby">← 回飛地大廳</button></div>'+
    '<div class="panel"><h2>建立固定團</h2><div class="form">'+
    '<label>固定團名稱<input id="cName" maxlength="30" value="'+(statics.length?'':'絕伊甸固定團')+'" placeholder="例如：絕伊甸固定團"></label>'+
    '<div class="hint">目標副本預設會放入絕伊甸，以及打 BiS 用的輕量級零式 1～4 層，之後可以在「管理」裡修改。</div>'+
    '<div><button class="btn primary" data-act="createStatic">建立</button></div></div></div>'+
    (claims.dc?'':'<div class="notice">你目前是用 Google 備用登入。建議改用 Discord 登入，才能建立自己的靈魂水晶並出現在陣容裡。</div>');

async function createStatic(btn){
  const name=$("#cName").value.trim();if(!name){toast("請輸入名稱");return;}
  btn.disabled=true;
  try{
    const ref=await addDoc(collection(db,"statics"),{name,slogan:"",intro:"",targets:DEFAULT_TARGETS,roles:{},leaders:{},
      modules:{guide:"owner",bis:"owner",mit:"owner",review:"owner"},createdAt:Date.now()});
    toast("已建立「"+name+"」");go("team",ref.id);
  }catch(e){console.error(e);toast("建立失敗：請確認 Firestore 規則已更新");btn.disabled=false;}
}

/* 固定團頁 */
function teamHTML(st){
  const m=myMember();
  let h='<div style="margin-bottom:12px"><button class="linkbtn" data-act="lobby">← 回飛地大廳</button></div>'+heroHTML(st);
  if(canManage(st))h+='<div style="margin:-8px 0 18px"><button class="btn sm" data-act="manage">管理固定團</button></div>';
  if(!isOwner&&!leaderOf(st)&&(!m||m.status!=="active"))return h+joinHTML(m);
  return h+rosterHTML(st)+modulesHTML(st);
}
function heroHTML(st){
  const t=st.targets||[],ln=leaderNames(st);
  return'<section class="hero"><h1>'+esc(st.name)+'</h1>'+(st.slogan?'<p class="slogan">'+esc(st.slogan)+'</p>':'')+
    (ln.length?'<p class="small muted" style="margin:6px 0 0">團長：'+esc(ln.join("、"))+'</p>':'')+
    (st.intro?'<p class="intro">'+esc(st.intro)+'</p>':'')+
    (t.length?'<div class="targets">'+t.map((x,i)=>'<span class="target'+(i===0?' main':'')+'">'+esc(x.n)+'</span>').join("")+'</div>':'')+'</section>';
}
function joinHTML(m){
  if(m&&m.status==="pending")return'<div class="panel"><h2>已送出加入申請</h2><p class="muted">等待團長核准，核准後這裡會自動顯示完整內容。</p><button class="btn sm" data-act="withdraw">取消申請</button></div>';
  return'<div class="panel"><h2>加入這個固定團</h2><p class="muted">送出申請後，由團長核准。</p><div class="form"><label>想對團長說的話（選填）<input id="jNote" maxlength="100" placeholder="例如：我是 D3 的奪魂者"></label><div><button class="btn primary" data-act="join">申請加入</button></div></div></div>';
}
function cardHTML(slot,uid){
  const u=uid&&users[uid];
  if(!u)return'<div class="slot r-'+slot.r+' empty"><span class="lab">'+slot.k+'</span>尚未分配</div>';
  const j=JOB[u.job];
  return'<div class="slot r-'+slot.r+'"><span class="lab">'+slot.k+'</span><img src="'+esc(avatarUrl(u))+'" alt="" loading="lazy">'+
    '<div class="nm">'+esc(nameOf(u))+'</div><div class="ch">'+esc([u.charName,u.server].filter(Boolean).join(" @ "))+'</div>'+
    (j?'<div class="jb">'+esc(j.n)+'</div>':'')+(u.bio?'<div class="bio">「'+esc(u.bio)+'」</div>':'')+'</div>';
}
function rosterHTML(st){
  const roles=st.roles||{};const assigned=new Set(Object.values(roles));
  const rest=activeIds(st.id).filter(id=>!assigned.has(id));
  return'<div class="panel"><h2>陣容</h2><div class="roster">'+SLOTS.map(s=>cardHTML(s,roles[s.k])).join("")+'</div>'+
    (rest.length?'<h3>替補成員（'+rest.length+'）</h3><div class="others">'+rest.map(id=>{const u=users[id];const j=u&&JOB[u.job];return'<div class="person"><img src="'+esc(avatarUrl(u))+'" alt=""><span>'+esc(nameOf(u))+'</span>'+(j?'<span class="jb '+j.r+'">'+esc(j.n)+'</span>':'')+'</div>';}).join("")+'</div>':'')+'</div>';
}
function modulesHTML(st){
  const mods=st.modules||{};const vis=MODULES.filter(x=>canSee(x.k));const mgr=isOwner||capsOf(st).modules;
  return'<div class="panel"><h2>功能</h2><div class="mods">'+
    '<a class="mod" href="schedule.html"><span class="t">出席時間調查</span><span class="d">填寫可以出團的時段</span><span class="badge open">使用中</span></a>'+
    vis.map(x=>{const s=mods[x.k]||"owner";return'<button class="mod" data-mod="'+x.k+'"><span class="t">'+x.n+'</span><span class="d">'+x.d+'</span>'+
      (mgr?'<span class="badge'+(s==="all"?' open':'')+'">'+MOD_STATUS[s]+'可見・建置中</span>':'<span class="badge">建置中</span>')+'</button>';}).join("")+
    '</div>'+(!mgr&&!vis.length?'<p class="muted small" style="margin:12px 0 0">更多功能準備中，敬請期待。</p>':'')+'</div>';
}

/* 管理 */
function mgTabs(st){
  const c=capsOf(st),t=[];
  if(c.members)t.push(["members","成員"]);
  if(c.modules)t.push(["modules","功能開放"]);
  if(c.info)t.push(["team","團隊資料"]);
  if(isOwner)t.push(["leaders","團長與權限"]);
  return t;
}
function manageHTML(st){
  const tabs=mgTabs(st);if(!tabs.some(([k])=>k===mgTab))mgTab=tabs[0][0];
  const pending=Object.keys(membersOf(st.id)).filter(id=>membersOf(st.id)[id].status==="pending");
  return'<div style="margin-bottom:12px"><button class="linkbtn" data-act="team">← 回 '+esc(st.name)+'</button></div>'+
    '<h1 style="font-family:Noto Serif TC,serif;margin:0 0 12px">管理「'+esc(st.name)+'」</h1>'+
    '<nav class="tabs">'+tabs.map(([k,n])=>'<button class="tab" data-mg="'+k+'" aria-selected="'+(mgTab===k)+'">'+n+(k==="members"&&pending.length?'（'+pending.length+' 個申請）':'')+'</button>').join("")+'</nav>'+
    (mgTab==="members"?membersMgHTML(st,pending):mgTab==="modules"?modulesMgHTML(st):mgTab==="team"?teamMgHTML(st):leadersMgHTML(st));
}
function membersMgHTML(st,pending){
  const ms=membersOf(st.id),roles=st.roles||{};const slotOf=id=>Object.keys(roles).find(k=>roles[k]===id)||"";
  const active=activeIds(st.id).sort((a,b)=>{const ia=SLOTS.findIndex(s=>s.k===slotOf(a)),ib=SLOTS.findIndex(s=>s.k===slotOf(b));return(ia<0?99:ia)-(ib<0?99:ib);});
  const outsiders=Object.keys(users).filter(id=>!ms[id]);
  let h='';
  if(pending.length)h+='<div class="panel"><h2>加入申請</h2>'+pending.map(id=>{const u=users[id],m=ms[id];
    return'<div class="req"><img src="'+esc(avatarUrl(u))+'" alt=""><div class="info"><b>'+esc(nameOf(u))+'</b> <span class="muted small">'+esc(u?[u.charName,jobLabel(u.job)].filter(Boolean).join(" "):"")+'</span>'+
      (m.note?'<div class="small">「'+esc(m.note)+'」</div>':'')+'</div><button class="btn sm primary" data-approve="'+id+'">核准</button><button class="btn sm danger" data-reject="'+id+'">拒絕</button></div>';}).join("")+
    '<label class="small" style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="welcomeOn" checked> 核准時在 Discord 發歡迎公告</label></div>';
  h+='<div class="panel"><h2>成員（'+active.length+'）</h2>';
  if(!active.length)h+='<p class="muted">還沒有成員。可以從下方把飛地成員直接加入，或等他們申請。</p>';
  else h+='<div class="mtable"><div class="inner"><div class="mrow mhead"><span>成員</span><span>職責</span>'+MODULES.map(x=>'<span>'+x.n+'</span>').join("")+'<span></span></div>'+
    active.map(id=>{const u=users[id],m=ms[id],sl=slotOf(id);
      return'<div class="mrow"><div class="who"><img src="'+esc(avatarUrl(u))+'" alt=""><div><b>'+esc(nameOf(u))+'</b><div class="small muted">'+esc(u?jobLabel(u.job):"")+'</div></div></div>'+
        '<select data-slot="'+id+'" aria-label="職責"><option value="">替補</option>'+SLOTS.map(s=>'<option'+(s.k===sl?' selected':'')+'>'+s.k+'</option>').join("")+'</select>'+
        MODULES.map(x=>{const v=(m.perms||{})[x.k]||"none";return'<select data-perm="'+id+'" data-pmod="'+x.k+'" aria-label="'+x.n+'權限">'+Object.entries(PERM).map(([k,n])=>'<option value="'+k+'"'+(k===v?' selected':'')+'>'+n+'</option>').join("")+'</select>';}).join("")+
        (id===me.uid?'<span></span>':'<button class="btn sm danger" data-remove="'+id+'">移出</button>')+'</div>';}).join("")+'</div></div>'+
    '<p class="hint" style="margin:8px 0 0">職責沒有分配的人會顯示在「替補成員」。權限只在功能設為「指定成員」或「全團開放」時才有作用。</p>';
  h+='</div>';
  h+='<div class="panel"><h2>從飛地成員直接加入</h2>'+(outsiders.length?'<p class="muted small">這些人已經建立過靈魂水晶，但還不是這個團的成員。</p><div class="others">'+
    outsiders.map(id=>{const u=users[id];return'<div class="person"><img src="'+esc(avatarUrl(u))+'" alt=""><span>'+esc(nameOf(u))+(id===me.uid?'（你）':'')+'</span><button class="btn sm" data-add="'+id+'">加入</button></div>';}).join("")+'</div>':
    '<p class="muted">飛地成員都已經在這個團裡了。</p>')+'</div>';
  return h;
}
function modulesMgHTML(st){
  const mods=st.modules||{};
  return'<div class="panel"><h2>功能開放狀態</h2><p class="muted small">建置期間維持「只有團長」，確認好用後再開放。各功能的資料也會由資料庫規則依這個設定把關。</p>'+
    MODULES.map(x=>'<div class="modrow"><div><b>'+x.n+'</b><div class="small muted">'+x.d+'</div></div><select class="sel" data-modstatus="'+x.k+'">'+
      Object.entries(MOD_STATUS).map(([k,n])=>'<option value="'+k+'"'+((mods[x.k]||"owner")===k?' selected':'')+'>'+n+'</option>').join("")+'</select></div>').join("")+
    '<p class="hint" style="margin:10px 0 0">「只有團長」包含總團長與有功能開放權限的團長；「指定成員」＝權限不是「不可見」的成員；「全團開放」＝所有成員都看得到。</p></div>';
}
function teamMgHTML(st){
  if(!tgtDraft)tgtDraft=(st.targets||[]).map(x=>({...x}));
  return'<div class="panel"><h2>團隊資料</h2><div class="form">'+
    '<label>固定團名稱<input id="tName" maxlength="30" value="'+esc(st.name)+'"></label>'+
    '<label>口號（選填）<input id="tSlogan" maxlength="40" value="'+esc(st.slogan||"")+'" placeholder="例如：一起把伊甸打穿！"></label>'+
    '<label>簡介（選填）<textarea id="tIntro" rows="3" maxlength="400" placeholder="開荒時間、目標、注意事項……">'+esc(st.intro||"")+'</textarea></label>'+
    '<div><div style="font-size:14px;font-weight:500;margin-bottom:6px">目標副本（第一個會標示為主要目標）</div><div id="tgtList">'+tgtListHTML()+'</div>'+
    '<button class="btn sm" data-act="tgtAdd">＋ 新增副本</button><div class="hint">之後 BiS 追蹤和攻略法整理會依這份清單分類，例如輕量級零式的掉落紀錄。</div></div>'+
    '<div><button class="btn primary" data-act="saveTeam">儲存團隊資料</button></div></div></div>';
}
function tgtListHTML(){
  return tgtDraft.map((x,i)=>'<div class="tgtrow"><input data-tgtn="'+i+'" maxlength="30" value="'+esc(x.n)+'" aria-label="副本名稱"><select data-tgtt="'+i+'" aria-label="類型">'+
    Object.entries(TARGET_TYPES).map(([k,n])=>'<option value="'+k+'"'+(x.t===k?' selected':'')+'>'+n+'</option>').join("")+'</select><button class="x" data-tgtrm="'+i+'" aria-label="移除">×</button></div>').join("");
}
const CAPS=[["members","成員管理","核准申請、加入或移出成員、分配職責與權限"],["info","團隊資料","修改團名、口號、簡介與目標副本"],["modules","功能開放","切換各功能的開放狀態"]];
function leadersMgHTML(st){
  const L=st.leaders||{};const ids=Object.keys(L);
  const cand=Object.keys(users).filter(id=>!L[id]);
  return'<div class="panel"><h2>團長與權限</h2><p class="muted small">只有總團長可以指派團長，並決定每位團長可以做哪些事。團長不能建立或刪除固定團，也不能指派其他團長。</p>'+
    (ids.length?ids.map(id=>{const u=users[id],c=L[id];
      return'<div class="lrow"><div class="who"><img src="'+esc(avatarUrl(u))+'" alt=""><b>'+esc(nameOf(u))+'</b></div><div class="caps">'+
        CAPS.map(([k,n,d])=>'<label title="'+d+'"><input type="checkbox" data-lcap="'+id+'" data-cap="'+k+'"'+(c[k]?' checked':'')+'> '+n+'</label>').join("")+
        '</div><button class="btn sm danger" data-lrm="'+id+'">取消團長</button></div>';}).join(""):'<p class="muted">這個團還沒有指派團長，目前由總團長管理。</p>')+
    (cand.length?'<div class="addrow"><select class="sel" id="leaderAdd"><option value="">選擇飛地成員…</option>'+cand.map(id=>'<option value="'+id+'">'+esc(nameOf(users[id]))+'</option>').join("")+'</select><button class="btn" data-act="leaderAdd">指派為團長</button></div>':'')+
    '<p class="hint" style="margin:10px 0 0">'+CAPS.map(([,n,d])=>n+'：'+d).join("；")+'。</p></div>'+
    '<div class="panel danger-zone"><h2>刪除固定團</h2><p class="muted small">會一併移除所有成員資料，無法復原。成員的靈魂水晶不受影響。</p><button class="btn danger" data-act="delStatic">刪除「'+esc(st.name)+'」</button></div>';
}
function afterManage(){
  if(mgTab!=="team")return;
  const list=$("#tgtList");
  list.addEventListener("input",e=>{const i=e.target.dataset.tgtn;if(i!=null)tgtDraft[+i].n=e.target.value;});
  list.addEventListener("change",e=>{const i=e.target.dataset.tgtt;if(i!=null)tgtDraft[+i].t=e.target.value;});
}

/* ---------- 動作 ---------- */
async function workerPost(path,body){
  const idToken=await me.getIdToken();
  const r=await fetch(W+path,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...body,idToken})});
  return r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));
}
async function welcome(uid){
  const u=users[uid],st=cur();if(!u||!u.dc||!st)return;
  try{const j=await workerPost("/welcome",{tid:st.id,dc:u.dc,name:nameOf(u),job:jobLabel(u.job),charName:u.charName||"",static:st.name});
    if(!j.ok)toast("歡迎公告沒發出去："+(j.error||""));}catch(e){console.error(e);}
}
async function setSlot(uid,slot){
  const st=cur();const roles={...(st.roles||{})};
  for(const k of Object.keys(roles))if(roles[k]===uid)delete roles[k];
  if(slot)roles[slot]=uid;
  await updateDoc(doc(db,"statics",curTid),{roles});
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const act=t.closest("[data-act]");
  try{
    if(act){
      const a=act.dataset.act;
      if(a==="dclogin"){location.href=W+"/auth/discord/login?return="+encodeURIComponent(location.origin+location.pathname+location.search);return;}
      if(a==="glogin"){await signInWithPopup(auth,new GoogleAuthProvider());return;}
      if(a==="logout"){await signOut(auth);go("lobby",null);return;}
      if(a==="lobby"){e.preventDefault();go("lobby",null);return;}
      if(a==="profile"){profileDraft=null;view="profile";render();return;}
      if(a==="cancelProfile"){profileDraft=null;view=curTid?"team":"lobby";render();return;}
      if(a==="saveProfile")return saveProfile(act);
      if(a==="create"){go("create",null);return;}
      if(a==="createStatic")return createStatic(act);
      if(a==="manage"){go("manage");return;}
      if(a==="team"){go("team");return;}
      if(a==="join"){
        await setDoc(doc(db,"statics",curTid,"members",me.uid),{status:"pending",requestedAt:Date.now(),note:($("#jNote").value||"").trim().slice(0,100)});
        toast("已送出申請");return;
      }
      if(a==="withdraw"){await deleteDoc(doc(db,"statics",curTid,"members",me.uid));toast("已取消申請");return;}
      if(a==="tgtAdd"){tgtDraft.push({n:"",t:"savage"});$("#tgtList").innerHTML=tgtListHTML();return;}
      if(a==="saveTeam"){
        const name=$("#tName").value.trim();if(!name){toast("請輸入名稱");return;}
        const targets=tgtDraft.map(x=>({n:x.n.trim(),t:x.t})).filter(x=>x.n).slice(0,20);
        act.disabled=true;
        await updateDoc(doc(db,"statics",curTid),{name,slogan:$("#tSlogan").value.trim(),intro:$("#tIntro").value.trim(),targets});
        tgtDraft=null;toast("已儲存");act.disabled=false;return;
      }
      if(a==="leaderAdd"){
        const id=$("#leaderAdd").value;if(!id){toast("請先選擇成員");return;}
        const L={...(cur().leaders||{})};L[id]={members:true,info:true,modules:false};
        await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已指派 "+nameOf(users[id])+" 為團長");return;
      }
      if(a==="delStatic"){
        if(!armedTwice("del"+curTid,act,"再按一次，確定刪除"))return;
        const tid=curTid;
        for(const id of Object.keys(membersOf(tid)))await deleteDoc(doc(db,"statics",tid,"members",id));
        await deleteDoc(doc(db,"statics",tid));toast("已刪除固定團");go("lobby",null);return;
      }
    }
    const tc=t.closest("[data-team]");if(tc){go("team",tc.dataset.team);return;}
    const mg=t.closest("[data-mg]");if(mg){mgTab=mg.dataset.mg;tgtDraft=null;render();return;}
    const md=t.closest("button[data-mod]");if(md){toast("「"+MODULES.find(x=>x.k===md.dataset.mod).n+"」還在建置中");return;}
    const rm=t.closest("[data-tgtrm]");if(rm){tgtDraft.splice(+rm.dataset.tgtrm,1);$("#tgtList").innerHTML=tgtListHTML();return;}
    const sub=t.closest("[data-sub]");if(sub){const k=sub.dataset.sub,s=profileDraft.subJobs;const i=s.indexOf(k);i<0?s.push(k):s.splice(i,1);sub.setAttribute("aria-pressed",i<0);return;}
    const ap=t.closest("[data-approve]");if(ap){
      const id=ap.dataset.approve;ap.disabled=true;const send=$("#welcomeOn")?$("#welcomeOn").checked:true;
      await updateDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已核准 "+nameOf(users[id]));if(send)welcome(id);return;
    }
    const rj=t.closest("[data-reject]");if(rj){if(!armedTwice("rj"+rj.dataset.reject,rj,"確定？"))return;await deleteDoc(doc(db,"statics",curTid,"members",rj.dataset.reject));toast("已拒絕");return;}
    const ad=t.closest("[data-add]");if(ad){
      const id=ad.dataset.add;ad.disabled=true;
      await setDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已加入 "+nameOf(users[id]));if(id!==me.uid)welcome(id);return;
    }
    const rmv=t.closest("[data-remove]");if(rmv){
      const id=rmv.dataset.remove;if(!armedTwice("rm"+id,rmv,"確定移出？"))return;
      await setSlot(id,"");await deleteDoc(doc(db,"statics",curTid,"members",id));toast("已移出");return;
    }
    const lrm=t.closest("[data-lrm]");if(lrm){
      const id=lrm.dataset.lrm;if(!armedTwice("lrm"+id,lrm,"確定？"))return;
      const L={...(cur().leaders||{})};delete L[id];await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已取消團長");return;
    }
  }catch(e2){console.error(e2);toast(e2&&e2.code==="permission-denied"?"沒有權限執行這個動作":"操作失敗，請再試一次");}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.slot!==undefined){await setSlot(t.dataset.slot,t.value);toast(t.value?"已設為 "+t.value:"已改為替補");return;}
    if(t.dataset.perm){await updateDoc(doc(db,"statics",curTid,"members",t.dataset.perm),{["perms."+t.dataset.pmod]:t.value});toast("已更新權限");return;}
    if(t.dataset.modstatus){await updateDoc(doc(db,"statics",curTid),{["modules."+t.dataset.modstatus]:t.value});toast("已更新為「"+MOD_STATUS[t.value]+"」");return;}
    if(t.dataset.lcap){
      const L={...(cur().leaders||{})};const id=t.dataset.lcap;L[id]={...(L[id]||{}),[t.dataset.cap]:t.checked};
      await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已更新團長權限");return;
    }
  }catch(e2){console.error(e2);toast(e2&&e2.code==="permission-denied"?"沒有權限執行這個動作":"更新失敗");}
});
</script>
