<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光之戰士飛地</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8ECF3; --surface:#F7F9FC; --ink:#1B2232; --muted:#5A6377; --line:#C9D1DE;
  --accent:#2F63C9; --accent-ink:#FFFFFF; --gold:#B8860B; --danger:#C23A4F;
  --tank:#2F63C9; --heal:#2E8B57; --dps:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
    --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
    --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
  --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
  --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1040px;margin:0 auto;padding:20px 16px 48px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{text-decoration:none;font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;letter-spacing:.2em;color:var(--muted);margin:0}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.me img{width:28px;height:28px;border-radius:50%}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.hero{border-left:4px solid var(--gold);padding:4px 0 4px 18px;margin:0 0 22px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,6vw,48px);line-height:1.15;margin:0}
.hero .slogan{font-size:17px;color:var(--muted);margin:6px 0 0}
.hero .intro{margin:10px 0 0;max-width:64ch;white-space:pre-wrap}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.target{padding:2px 10px;border-radius:4px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.target.main{border-color:var(--gold);color:var(--gold);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.panel h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 0 12px}
.panel h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.discord{background:#5865F2;border-color:#5865F2;color:#fff;font-size:16px;padding:12px 22px;font-weight:700}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form{display:grid;gap:12px;max-width:620px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:500}
.form input,.form textarea,.form select,.sel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jobcat{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.jobcat .catn{font-size:13px;color:var(--muted);padding-top:4px}
@media (max-width:560px){.jobcat{grid-template-columns:1fr;gap:4px}}
.chip.jc-tank[aria-pressed="true"]{background:var(--tank);border-color:var(--tank);color:#fff}
.chip.jc-heal[aria-pressed="true"]{background:var(--heal);border-color:var(--heal);color:#fff}
.chip.jc-dps[aria-pressed="true"]{background:var(--dps);border-color:var(--dps);color:#fff}

/* roster */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;background:var(--surface);padding:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.slot.r-tank{--rc:var(--tank)} .slot.r-heal{--rc:var(--heal)} .slot.r-dps{--rc:var(--dps)}
.slot .lab{position:absolute;top:6px;left:8px;font-weight:900;font-family:"Noto Serif TC",serif;color:var(--rc);font-size:15px}
.slot img{width:56px;height:56px;border-radius:50%;margin:8px 0 4px;background:var(--bg)}
.slot .nm{font-weight:700}
.slot .ch{font-size:12px;color:var(--muted);word-break:break-all}
.slot .jb{margin-top:4px;font-size:12px;font-weight:700;color:var(--rc)}
.slot.empty{justify-content:center;color:var(--muted);border-style:dashed;border-top-style:solid}
.bio{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.others{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.person img{width:28px;height:28px;border-radius:50%}
.person .jb{font-size:12px;font-weight:700}
.jb.tank{color:var(--tank)} .jb.heal{color:var(--heal)} .jb.dps{color:var(--dps)}

/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mod{display:grid;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.mod:hover{border-color:var(--accent)}
.mod .t{font-weight:700;font-size:16px}
.mod .d{font-size:13px;color:var(--muted)}
.badge{justify-self:start;font-size:12px;padding:0 8px;border-radius:4px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:700}
.badge.open{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--heal)}

/* manage */
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 90px repeat(4,minmax(96px,1fr)) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .who{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .who img{width:30px;height:30px;border-radius:50%}
.mrow .who div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead{font-size:12px;color:var(--muted);font-weight:700;border-top:0;padding-bottom:0}
.mtable{overflow-x:auto}
.mtable .inner{min-width:760px}
.mrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:13px;width:100%}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
.req img{width:36px;height:36px;border-radius:50%}
.req .info{flex:1;min-width:180px}
.modrow{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.modrow:first-child{border-top:0}
.tgtrow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:6px}
.tgtrow input,.tgtrow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px}
.x{border:0;background:none;color:var(--muted);font-size:18px;border-radius:50%}
.x:hover{color:var(--danger)}

.center{text-align:center;padding:48px 16px}
.center h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,6vw,44px);margin:0 0 8px}
.center p{max-width:46ch;margin:0 auto 22px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));margin:0 0 16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.phead h2{margin:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.teamcard{display:grid;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;background:var(--surface);color:var(--ink)}
.teamcard:hover{border-color:var(--accent);border-left-color:var(--gold)}
.teamcard .tn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px}
.teamcard .avs{display:flex;flex-wrap:wrap;gap:2px}
.teamcard .avs img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px;background:var(--bg)}
.teamcard .rel{justify-self:start;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.crystals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crystal{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;background:var(--bg)}
.crystal.r-tank{--rc:var(--tank)} .crystal.r-heal{--rc:var(--heal)} .crystal.r-dps{--rc:var(--dps)}
.crystal img{width:44px;height:44px;border-radius:50%;flex:none;background:var(--surface)}
.crystal .cbody{min-width:0}
.crystal .nm{font-weight:700}
.crystal .ch{font-size:12px;color:var(--muted);word-break:break-all}
.crystal .jb{font-size:12px;font-weight:700;color:var(--rc)}
.crystal .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.crystal .tags .target{font-size:11px;padding:0 6px}
.you{margin-left:6px;font-size:11px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface);font-weight:700;vertical-align:middle}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .who{display:flex;align-items:center;gap:8px;min-width:140px}
.lrow .who img{width:30px;height:30px;border-radius:50%}
.lrow .caps{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1;font-size:14px}
.lrow .caps label{display:flex;align-items:center;gap:4px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .sel{flex:1;min-width:180px}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.slot .alts{font-size:11px;color:var(--muted)}
.warn{font-size:12px;color:var(--danger);margin-top:2px}
.mrow.jrow{grid-template-columns:minmax(170px,1.3fr) 90px minmax(150px,1.2fr) minmax(120px,1fr) minmax(120px,1fr) auto}
.mrow.prow{grid-template-columns:minmax(150px,1.3fr) repeat(4,minmax(96px,1fr))}
.mtable .inner{min-width:820px}
.lfilter{margin:4px 0 12px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.lcard:hover{border-color:var(--accent)}
.lcard.self{border-left:4px solid var(--gold)}
.lcard.pinned{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.lmain{display:grid;gap:4px;padding:12px 14px;color:var(--ink);text-decoration:none;flex:1}
.lmain .lt{font-weight:700;font-size:15px}
.lmain .ldom{font-weight:400;font-size:12px;color:var(--muted)}
.lmain .ld{font-size:13px;color:var(--muted)}
.ltags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.tag{font-size:11px;padding:0 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.tag.selftag{border-color:var(--gold);color:var(--gold);font-weight:700}
.tag.wait{border-color:var(--gold);color:var(--gold)}
.tag.bad{border-color:var(--danger);color:var(--danger)}
.ltags .by{font-size:11px;color:var(--muted);margin-left:auto}
.lops{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--line);background:var(--surface)}
.review{padding:12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:14px;display:grid;gap:8px}
.loadhelp{max-width:560px;margin:24px auto;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.loadhelp h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 0 8px}
.loadhelp ul{margin:0 0 16px;padding-left:20px}
.loadhelp li{margin:6px 0}
.bishead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.bishead h1{font-family:"Noto Serif TC",serif;margin:0;font-size:26px}
.bisuser{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bisuser img{width:40px;height:40px;border-radius:50%}
.bisuser .nm{font-weight:700;font-size:17px}
.bisstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.bisstats .box{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.bisstats .lab{font-size:12px;color:var(--muted)}
.bisstats .num{font-size:22px;font-weight:700}
.bisstats .coll{cursor:pointer;font-size:14px}
.bislink{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bislink input{flex:1;min-width:220px}
.bistable,.bisgrid{border-collapse:collapse;width:100%;font-size:14px}
.bistable th,.bisgrid th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.bistable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.bistable tr.done td:first-child{box-shadow:inset 3px 0 0 var(--heal)}
.bistable tr.part td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.bistable .nm-in{width:100%;min-width:160px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px}
.src{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--bg);white-space:nowrap}
.src.s-raid{background:color-mix(in srgb,var(--dps) 14%,var(--surface));color:var(--dps);border-color:color-mix(in srgb,var(--dps) 40%,var(--line))}
.src.s-tome{background:color-mix(in srgb,var(--tank) 14%,var(--surface));color:var(--tank);border-color:color-mix(in srgb,var(--tank) 40%,var(--line))}
.src.s-craft{background:color-mix(in srgb,var(--heal) 14%,var(--surface));color:var(--heal);border-color:color-mix(in srgb,var(--heal) 40%,var(--line))}
.src.s-none{color:var(--muted);border-style:dashed}
.augck{display:inline-flex;align-items:center;gap:3px;font-size:12px;margin-left:6px;white-space:nowrap}
.stbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:13px;white-space:nowrap}
.stbtn:disabled,.src:disabled{cursor:default;opacity:.85}
.bistools{margin-top:14px;display:grid;gap:8px}
.bistools summary{cursor:pointer;font-weight:500}
.bistools textarea{width:100%;margin-top:6px;font-family:inherit}
.bisgrid td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.bisgrid td.who,.bisgrid th.who{text-align:left;position:sticky;left:0;background:var(--surface);min-width:120px}
.bisgrid td.c{font-size:12px;font-weight:700;min-width:34px}
.bisgrid td.done{background:color-mix(in srgb,var(--heal) 22%,transparent);color:var(--heal)}
.bisgrid td.part{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.bisgrid td.need{background:color-mix(in srgb,var(--dps) 16%,transparent);color:var(--dps)}
.bisgrid td.empty{color:var(--muted)}
.bisgrid td.prog{font-weight:700;white-space:nowrap}
.droptbl td{text-align:center}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dropcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.dropcard .dt{font-weight:700}
.dropcard ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.lootform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.lootform label{display:grid;gap:4px;font-size:13px;font-weight:500}
.lootlist{list-style:none;margin:0;padding:0}
.lootlist li{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.lootlist li:first-child{border-top:0}
.flabel{font-size:14px;font-weight:500;margin-bottom:4px}
.phtag{display:inline-block;margin-left:6px;font-size:11px;padding:0 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);font-weight:400;vertical-align:middle}
.phform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.phform label{display:grid;gap:4px;font-size:13px;font-weight:500}
.phform input,.phform select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.phbtns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <a class="brand" id="brand" href="./" data-act="lobby">光之戰士飛地</a>
    <div class="me" id="me"></div>
  </header>
  <main id="view"><div class="center muted" data-loading>載入中…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* 載入逾時提示：放在一般 script，即使 config.js 缺少、主程式無法執行也會運作 */
(function(){

{

  },err));

function finalHas(rec,k){const f=bslot(rec,"final",k);return!!f.src&&(f.st==="got"||f.st==="aug");}
function progDone(rec,k){const p=bslot(rec,"prog",k);if(finalHas(rec,k))return true;return p.same?false:slotDone(p);}
function doneOf(rec,set,k){return set==="prog"?progDone(rec,k):slotDone(bslot(rec,"final",k));}

function needers(t,key){ // 回傳 [{id,count}] 需要這個掉落的人

  const isGearName=s=>/[\u4e00-\u9fff]/.test(s)&&!/^(食品|食物|魔晶石|種族|种族)/.test(s)&&!/\d{2,}/.test(s.replace(/C9/g,""))&&s.length>=3&&s.length<=40;
  const clean=s=>s.replace(/[⋮︙…]/g,"").split(/\t| {2,}|\s+il\d+|\s+i\d{3}/i)[0].trim();
  const lines=String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const labeled=[],plain=[];let pending=null;
  for(const raw of lines){
    const lab=SLOT_LABELS.find(([,re])=>re.test(raw));
    if(lab){const rest=clean(raw.replace(lab[1],"").trim());if(rest&&isGearName(rest))labeled.push([lab[0],rest]);else pending=lab[0];continue;}
    const nm=clean(raw);
    if(pending&&isGearName(nm)){labeled.push([pending,nm]);pending=null;continue;}
    pending=null;
    if(isGearName(nm))plain.push(nm);
  }
  let pairs=[];
  if(labeled.length>=6){let ring=0;pairs=labeled.map(([k,n])=>[k==="ring"?(++ring===1?"ring1":"ring2"):k,n]);}
  else if(plain.length===11)pairs=BIS_SLOTS.map((s,i)=>[s.k,plain[i]]);
  else return{error:"辨識到 "+(labeled.length||plain.length)+" 件裝備，需要 11 件（或附部位名稱的表格）。"};
  const has=(n,list)=>list.some(w=>n.includes(w));
  return{items:pairs.filter(([k])=>BIS_SLOTS.some(s=>s.k===k)).map(([k,n])=>{
    let src="craft",aug=false;
    if(has(n,kw("aug"))){src="tome";aug=true;}else if(has(n,kw("tome")))src="tome";else if(has(n,kw("raid")))src="raid";
    return{k,name:n.slice(0,40),src,aug};
  })};
}

    const k=el.dataset.bisst;if(!bisCanEdit(bisWho))return true;
    const sl=bslot(recOf(bisWho),bisSet,k);const cyc=sl.src==="tome"&&sl.aug?["none","got","aug"]:["none","got"];
    const nx=cyc[(cyc.indexOf(sl.st||"none")+1)%cyc.length];
    await bisPatch(bisWho,{[bisSet+"."+k]:{...sl,st:nx}});return true;
  }
  const a=(go2("[data-act]")||{}).dataset;if(!a)return false;const act=a.act;
  if(act==="bisCreateTier"){await addDoc(collection(db,"statics",curTid,"bisTiers"),defaultTier());toast("已建立「次重量級」");return true;}
  if(act==="bisNewTier"){const d=defaultTier();d.name="新的一期";d.floors=["1 層","2 層","3 層","4 層"];d.colls=[];d.drops={f0:[],f1:[],f2:[],f3:[]};
    const ref=await addDoc(collection(db,"statics",curTid,"bisTiers"),d);bisTierId=ref.id;bisDraft=null;toast("已新增，請在設定裡填寫名稱與掉落表");return true;}
  if(act==="bisParse"){
    const r=bisParse($("#bisPaste").value,T);if(r.error){toast(r.error);return true;}
    const rec=recOf(bisWho),patch={};
    r.items.forEach(it=>{const sl=bslot(rec,bisSet,it.k);patch[bisSet+"."+it.k]={...sl,name:it.name,src:it.src,aug:it.aug,st:sl.st||"none",same:false};});
    await bisPatch(bisWho,patch);toast("已套用 "+r.items.length+" 件，請檢查來源是否正確");return true;
  }
  if(act==="bisTemplate"){
    const btn=go2("[data-act]");if(!armedTwice("tpl"+bisSet,btn,"再按一次確認套用"))return true;
    const rec=recOf(bisWho),patch={};
    BIS_SLOTS.forEach(s=>{const sl=bslot(rec,bisSet,s.k);const tp=bisSet==="final"?FINAL_TEMPLATE[s.k]:["tome",0];
      patch[bisSet+"."+s.k]={...sl,src:tp[0],aug:!!tp[1],st:sl.st==="aug"&&!tp[1]?"got":(sl.st||"none"),same:false};});
    await bisPatch(bisWho,patch);toast("已套用，請依實際配裝微調");return true;
  }
  if(act==="bisCopy"){
    const from=$("#bisCopyFrom").value;if(!from){toast("請先選擇成員");return true;}
    const src=recOf(from)[bisSet]||{},rec=recOf(bisWho),patch={};
    BIS_SLOTS.forEach(s=>{const o=src[s.k];if(!o)return;const sl=bslot(rec,bisSet,s.k);
      patch[bisSet+"."+s.k]={...sl,src:o.src||"",aug:!!o.aug,name:o.name||"",same:!!o.same,st:sl.st||"none"};});
    await bisPatch(bisWho,patch);toast("已複製 "+nameOf(users[from])+" 的設定");return true;
  }
  if(act==="lootAdd"){
    const d=bisDraft;if(!d.item||!d.to){toast("請選擇物品和成員");return true;}
    await addDoc(collection(db,"statics",curTid,"loot"),{tier:bisTierId,week:d.week,floor:+d.floor,item:d.item,to:d.to,by:me.uid,createdAt:Date.now()});
    // 自動更新進度
    const rec=recOf(d.to);let msg="已記錄";
    if(d.item.startsWith("c:")){await bisPatch(d.to,{["coll."+d.item.slice(2)]:true});msg+="，已勾選收藏品";}
    else if(d.item.startsWith("mat")){
      const sl=BIS_SLOTS.filter(s=>MAT_OF[s.g]===d.item&&(()=>{const f=bslot(rec,"final",s.k);return f.src==="tome"&&f.aug&&f.st!=="aug";})());
      msg+=sl.length?"。可以強化："+sl.map(s=>s.n).join("、")+"（強化後請到我的 BiS 勾選）":"";
    }else{
      const s=BIS_SLOTS.find(x=>x.d===d.item&&(()=>{const f=bslot(rec,"final",x.k);return f.src==="raid"&&f.st!=="got"&&f.st!=="aug";})());
      if(s){await bisPatch(d.to,{["final."+s.k]:{...bslot(rec,"final",s.k),st:"got"}});msg+="，已勾選畢業的"+s.n;}
      else msg+="（提醒：他的畢業目標這格不是零式或已經有了）";
    }
    bisDraft={...d,to:""};toast(msg);render();return true;
  }
  if(act==="bisCollAdd"){bisDraft.colls.push({id:"c"+Date.now().toString(36),n:""});render();return true;}
  if(act==="bisSaveTier"){
    const d=bisDraft;const btn=go2("[data-act]");btn.disabled=true;
    const colls=d.colls.filter(c=>c.n.trim()).map(c=>({id:c.id,n:c.n.trim()}));const ids=colls.map(c=>"c:"+c.id);
    const drops={};d.floors.forEach((f,i)=>drops["f"+i]=((d.drops["f"+i])||[]).filter(k=>!k.startsWith("c:")||ids.includes(k)));
    await updateDoc(doc(db,"statics",curTid,"bisTiers",T.id),{name:d.name.trim()||"零式",floors:d.floors.map(f=>f.trim()||"?"),drops,mats:d.mats,colls,kw:d.kw,confirmed:!!d.confirmed});
    bisDraft=null;toast("已儲存設定");render();return true;
  }
  if((el=go2("[data-bcollrm]"))){bisDraft.colls.splice(+el.dataset.bcollrm,1);render();return true;}
  return false;
}
async function bisChange(t){
  if(t.dataset.bistier!==undefined){bisTierId=t.value;bisDraft=null;render();return true;}
  if(t.dataset.biswho!==undefined){bisWho=t.value;render();return true;}
  if(t.dataset.bislink!==undefined){const v=t.value.trim();if(v&&!/^https:\/\//.test(v)){toast("連結要以 https:// 開頭");return true;}await bisPatch(bisWho,{["links."+bisSet]:v});toast("已儲存配裝連結");return true;}
  if(t.dataset.bisname!==undefined){const k=t.dataset.bisname;await bisPatch(bisWho,{[bisSet+"."+k]:{...bslot(recOf(bisWho),bisSet,k),name:t.value.trim().slice(0,40)}});return true;}
  if(t.dataset.bisaug!==undefined){const k=t.dataset.bisaug,sl=bslot(recOf(bisWho),bisSet,k);await bisPatch(bisWho,{[bisSet+"."+k]:{...sl,aug:t.checked,st:!t.checked&&sl.st==="aug"?"got":(sl.st||"none")}});return true;}
  if(t.dataset.bissame!==undefined){const k=t.dataset.bissame;await bisPatch(bisWho,{["prog."+k]:{...bslot(recOf(bisWho),"prog",k),same:t.checked}});return true;}
  if(t.dataset.biscoll!==undefined){await bisPatch(bisWho,{["coll."+t.dataset.biscoll]:t.checked});toast(t.checked?"已取得":"已取消");return true;}
  if(t.dataset.loot){const k=t.dataset.loot;bisDraft[k]=t.value;if(k==="floor")bisDraft.item="";render();return true;}
  if(t.dataset.bset){const k=t.dataset.bset;bisDraft[k]=t.type==="checkbox"?t.checked:t.value;return true;}
  if(t.dataset.bfloor!==undefined){bisDraft.floors[+t.dataset.bfloor]=t.value;return true;}
  if(t.dataset.bdrop!==undefined){const i=t.dataset.bdrop,k=t.dataset.key,arr=bisDraft.drops["f"+i]||(bisDraft.drops["f"+i]=[]);
    if(t.checked){if(!arr.includes(k))arr.push(k);}else arr.splice(arr.indexOf(k),1);return true;}
  if(t.dataset.bmat){bisDraft.mats[t.dataset.bmat]=t.value;return true;}
  if(t.dataset.bcoll!==undefined){bisDraft.colls[+t.dataset.bcoll].n=t.value;return true;}
  if(t.dataset.bkw){bisDraft.kw[t.dataset.bkw]=t.value;return true;}
  return false;
}

  h+='<div class="panel"><h2>從飛地成員直接加入</h2>'+(outsiders.length?'<p class="muted small">這些人已經建立過靈魂水晶，但還不是這個團的成員。</p><div class="others">'+
    outsiders.map(id=>{const u=users[id];return'<div class="person"><img src="'+esc(avatarUrl(u))+'" alt=""><span>'+esc(nameOf(u))+(id===me.uid?'（你）':'')+'</span><button class="btn sm" data-add="'+id+'">加入</button></div>';}).join("")+'</div>':
    '<p class="muted">飛地成員都已經在這個團裡了。</p>')+'</div>';
  return h;
}
function modulesMgHTML(st){
  const mods=st.modules||{};
  return'<div class="panel"><h2>功能開放狀態</h2><p class="muted small">建置期間維持「只有團長」，確認好用後再開放。各功能的資料也會由資料庫規則依這個設定把關。</p>'+
    MODULES.map(x=>'<div class="modrow"><div><b>'+x.n+'</b><div class="small muted">'+x.d+'</div></div><select class="sel" data-modstatus="'+x.k+'">'+
      Object.entries(MOD_STATUS).map(([k,n])=>'<option value="'+k+'"'+((mods[x.k]||"owner")===k?' selected':'')+'>'+n+'</option>').join("")+'</select></div>').join("")+
    '<p class="hint" style="margin:10px 0 0">「只有團長」包含總團長與有功能開放權限的團長；「指定成員」＝權限不是「不可見」的成員；「全團開放」＝所有成員都看得到。</p></div>';
}
function teamMgHTML(st){
  if(!tgtDraft)tgtDraft=(st.targets||[]).map(x=>({...x}));
  return'<div class="panel"><h2>團隊資料</h2><div class="form">'+
    '<label>固定團名稱<input id="tName" maxlength="30" value="'+esc(st.name)+'"></label>'+
    '<label>口號（選填）<input id="tSlogan" maxlength="40" value="'+esc(st.slogan||"")+'" placeholder="例如：一起把伊甸打穿！"></label>'+
    '<label>簡介（選填）<textarea id="tIntro" rows="3" maxlength="400" placeholder="開荒時間、目標、注意事項……">'+esc(st.intro||"")+'</textarea></label>'+
    '<div><div style="font-size:14px;font-weight:500;margin-bottom:6px">目標副本（第一個會標示為主要目標）</div><div id="tgtList">'+tgtListHTML()+'</div>'+
    '<button class="btn sm" data-act="tgtAdd">＋ 新增副本</button><div class="hint">之後 BiS 追蹤和攻略法整理會依這份清單分類，例如輕量級零式的掉落紀錄。</div></div>'+
    '<div><button class="btn primary" data-act="saveTeam">儲存團隊資料</button></div></div></div>';
}
function tgtListHTML(){
  return tgtDraft.map((x,i)=>'<div class="tgtrow"><input data-tgtn="'+i+'" maxlength="30" value="'+esc(x.n)+'" aria-label="副本名稱"><select data-tgtt="'+i+'" aria-label="類型">'+
    Object.entries(TARGET_TYPES).map(([k,n])=>'<option value="'+k+'"'+(x.t===k?' selected':'')+'>'+n+'</option>').join("")+'</select><button class="x" data-tgtrm="'+i+'" aria-label="移除">×</button></div>').join("");
}
const CAPS=[["members","成員管理","核准申請、加入或移出成員、分配職責與權限"],["info","團隊資料","修改團名、口號、簡介與目標副本"],["modules","功能開放","切換各功能的開放狀態"],["survey","出席調查","為這個團發起、截止與管理出席時間調查"]];
function leadersMgHTML(st){
  const L=st.leaders||{};const ids=Object.keys(L);
  const cand=Object.keys(users).filter(id=>!L[id]);
  return'<div class="panel"><h2>團長與權限</h2><p class="muted small">只有總團長可以指派團長，並決定每位團長可以做哪些事。團長不能建立或刪除固定團，也不能指派其他團長。</p>'+
    (ids.length?ids.map(id=>{const u=users[id],c=L[id];
      return'<div class="lrow"><div class="who"><img src="'+esc(avatarUrl(u))+'" alt=""><b>'+esc(nameOf(u))+'</b></div><div class="caps">'+
        CAPS.map(([k,n,d])=>'<label title="'+d+'"><input type="checkbox" data-lcap="'+id+'" data-cap="'+k+'"'+(c[k]?' checked':'')+'> '+n+'</label>').join("")+
        '</div><button class="btn sm danger" data-lrm="'+id+'">取消團長</button></div>';}).join(""):'<p class="muted">這個團還沒有指派團長，目前由總團長管理。</p>')+
    (cand.length?'<div class="addrow"><select class="sel" id="leaderAdd"><option value="">選擇飛地成員…</option>'+cand.map(id=>'<option value="'+id+'">'+esc(nameOf(users[id]))+'</option>').join("")+'</select><button class="btn" data-act="leaderAdd">指派為團長</button></div>':'')+
    '<p class="hint" style="margin:10px 0 0">'+CAPS.map(([,n,d])=>n+'：'+d).join("；")+'。</p></div>'+
    '<div class="panel danger-zone"><h2>刪除固定團</h2><p class="muted small">會一併移除所有成員資料，無法復原。成員的靈魂水晶不受影響。</p><button class="btn danger" data-act="delStatic">刪除「'+esc(st.name)+'」</button></div>';
}
function afterManage(){
  if(mgTab!=="team")return;
  const list=$("#tgtList");
  list.addEventListener("input",e=>{const i=e.target.dataset.tgtn;if(i!=null)tgtDraft[+i].n=e.target.value;});
  list.addEventListener("change",e=>{const i=e.target.dataset.tgtt;if(i!=null)tgtDraft[+i].t=e.target.value;});
}

/* ---------- 動作 ---------- */
async function workerPost(path,body){
  const idToken=await me.getIdToken();
  const r=await fetch(W+path,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...body,idToken})});
  return r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));
}
async function welcome(uid){
  const u=users[uid],st=cur();if(!u||!u.dc||!st)return;
  try{const j=await workerPost("/welcome",{tid:st.id,dc:u.dc,name:nameOf(u),job:jobLabel(teamJob(st.id,uid)),charName:u.charName||"",static:st.name});
    if(!j.ok)toast("歡迎公告沒發出去："+(j.error||""));}catch(e){console.error(e);}
}
async function setSlot(uid,slot){
  const st=cur();const roles={...(st.roles||{})};
  for(const k of Object.keys(roles))if(roles[k]===uid)delete roles[k];
  if(slot)roles[slot]=uid;
  await updateDoc(doc(db,"statics",curTid),{roles});
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const act=t.closest("[data-act]");
  try{
    if(view==="mod"&&await bisClick(t,e))return;
    if(act){
      const a=act.dataset.act;
      if(a==="dclogin"){location.href=W+"/auth/discord/login?return="+encodeURIComponent(location.origin+location.pathname+location.search);return;}
      if(a==="glogin"){await signInWithPopup(auth,new GoogleAuthProvider());return;}
      if(a==="logout"){await signOut(auth);go("lobby",null);return;}
      if(a==="lobby"){e.preventDefault();go("lobby",null);return;}
      if(a==="profile"){profileDraft=null;view="profile";render();return;}
      if(a==="cancelProfile"){profileDraft=null;view=curTid?"team":"lobby";render();return;}
      if(a==="saveProfile")return saveProfile(act);
      if(a==="create"){go("create",null);return;}
      if(a==="linkNew"){linkDraft={url:"",title:"",desc:"",cat:LINK_CATS[0],lang:"繁中"};view="linkform";window.scrollTo(0,0);render();return;}
      if(a==="linkCancel"){linkDraft=null;go("lobby",null);return;}
      if(a==="linkSave")return saveLink(act);
      if(a==="seedLinks")return seedLinks(act);
      if(a==="createStatic")return createStatic(act);
      if(a==="manage"){go("manage");return;}
      if(a==="team"){go("team");return;}
      if(a==="join"){
        await setDoc(doc(db,"statics",curTid,"members",me.uid),{status:"pending",requestedAt:Date.now(),note:($("#jNote").value||"").trim().slice(0,100)});
        toast("已送出申請");return;
      }
      if(a==="withdraw"){await deleteDoc(doc(db,"statics",curTid,"members",me.uid));toast("已取消申請");return;}
      if(a==="phAdd"){
        const d=phDraft;const did=String(d.did||"").trim();
        if(!/^\d{15,21}$/.test(did)){toast("Discord ID 應該是 15～21 位數字");return;}
        if(!d.nick.trim()){toast("請填暱稱");return;}
        if(!d.job){toast("請選主職業");return;}
        const uid="dc_"+did;act.disabled=true;
        if(membersOf(curTid)[uid]){toast("他已經在這個團裡了");act.disabled=false;return;}
        if(!users[uid]){
          await setDoc(doc(db,"users",uid),{dc:did,dcName:"",avatar:"",nick:d.nick.trim(),charName:(d.charName||"").trim(),server:d.server||"",job:d.job,subJobs:[],bio:"",
            placeholder:true,placeholderTid:curTid,createdBy:me.uid,createdAt:Date.now(),updatedAt:Date.now()});
        }
        await setDoc(doc(db,"statics",curTid,"members",uid),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
        const send=d.welcome;phDraft={did:"",nick:"",job:"",charName:"",server:"",welcome:false};
        toast((users[uid]&&!users[uid].placeholder?"他已經有靈魂水晶，已直接加入：":"已代建並加入：")+d.nick.trim());
        if(send){users[uid]=users[uid]||{dc:did,nick:d.nick.trim(),job:d.job};welcome(uid);}
        return;
      }
      if(a==="tgtAdd"){tgtDraft.push({n:"",t:"savage"});$("#tgtList").innerHTML=tgtListHTML();return;}
      if(a==="saveTeam"){
        const name=$("#tName").value.trim();if(!name){toast("請輸入名稱");return;}
        const targets=tgtDraft.map(x=>({n:x.n.trim(),t:x.t})).filter(x=>x.n).slice(0,20);
        act.disabled=true;
        await updateDoc(doc(db,"statics",curTid),{name,slogan:$("#tSlogan").value.trim(),intro:$("#tIntro").value.trim(),targets});
        tgtDraft=null;toast("已儲存");act.disabled=false;return;
      }
      if(a==="leaderAdd"){
        const id=$("#leaderAdd").value;if(!id){toast("請先選擇成員");return;}
        const L={...(cur().leaders||{})};L[id]={members:true,info:true,modules:false,survey:false};
        await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已指派 "+nameOf(users[id])+" 為團長");return;
      }
      if(a==="delStatic"){
        if(!armedTwice("del"+curTid,act,"再按一次，確定刪除"))return;
        const tid=curTid;
        for(const id of Object.keys(membersOf(tid)))await deleteDoc(doc(db,"statics",tid,"members",id));
        await deleteDoc(doc(db,"statics",tid));toast("已刪除固定團");go("lobby",null);return;
      }
    }
    const tc=t.closest("[data-team]");if(tc){go("team",tc.dataset.team);return;}
    const pd=t.closest("[data-phdir]");if(pd){const p=DIRECTORY.find(x=>x.did===pd.dataset.phdir);if(p){phDraft={...phDraft,did:p.did,nick:p.n};render();}return;}
    const lf=t.closest("[data-lf]");if(lf){linkFilter=lf.dataset.lf;render();return;}
    const le=t.closest("[data-ledit]");if(le){const l=links[le.dataset.ledit];if(!l)return;
      linkDraft={id:l.id,url:l.url,title:l.title,desc:l.desc||"",cat:l.cat,lang:l.lang,approveOnSave:isOwner&&l.status==="pending"};view="linkform";window.scrollTo(0,0);render();return;}
    const lok=t.closest("[data-lok]");if(lok){await updateDoc(doc(db,"links",lok.dataset.lok),{status:"approved",updatedAt:Date.now()});toast("已通過");return;}
    const lrej=t.closest("[data-lrej]");if(lrej){if(!armedTwice("lrej"+lrej.dataset.lrej,lrej,"確定退回？"))return;await updateDoc(doc(db,"links",lrej.dataset.lrej),{status:"rejected",updatedAt:Date.now()});toast("已退回");return;}
    const ldel=t.closest("[data-ldel]");if(ldel){if(!armedTwice("ldel"+ldel.dataset.ldel,ldel,"確定？"))return;await deleteDoc(doc(db,"links",ldel.dataset.ldel));toast(isOwner?"已下架":"已撤回");return;}
    const lpin=t.closest("[data-lpin]");if(lpin){const l=links[lpin.dataset.lpin];await updateDoc(doc(db,"links",l.id),{pinned:!l.pinned});toast(l.pinned?"已取消置頂":"已置頂");return;}
    const mg=t.closest("[data-mg]");if(mg){mgTab=mg.dataset.mg;tgtDraft=null;render();return;}
    const md=t.closest("button[data-mod]");if(md){if(md.dataset.mod==="bis"){bisTab="mine";go("mod");return;}toast("「"+MODULES.find(x=>x.k===md.dataset.mod).n+"」還在建置中");return;}
    const rm=t.closest("[data-tgtrm]");if(rm){tgtDraft.splice(+rm.dataset.tgtrm,1);$("#tgtList").innerHTML=tgtListHTML();return;}
    const sub=t.closest("[data-sub]");if(sub){const k=sub.dataset.sub,s=profileDraft.subJobs;const i=s.indexOf(k);i<0?s.push(k):s.splice(i,1);sub.setAttribute("aria-pressed",i<0);return;}
    const ap=t.closest("[data-approve]");if(ap){
      const id=ap.dataset.approve;ap.disabled=true;const send=$("#welcomeOn")?$("#welcomeOn").checked:true;
      await updateDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已核准 "+nameOf(users[id]));if(send)welcome(id);return;
    }
    const rj=t.closest("[data-reject]");if(rj){if(!armedTwice("rj"+rj.dataset.reject,rj,"確定？"))return;await deleteDoc(doc(db,"statics",curTid,"members",rj.dataset.reject));toast("已拒絕");return;}
    const ad=t.closest("[data-add]");if(ad){
      const id=ad.dataset.add;ad.disabled=true;
      await setDoc(doc(db,"statics",curTid,"members",id),{status:"active",joinedAt:Date.now(),perms:DEFAULT_PERMS});
      toast("已加入 "+nameOf(users[id]));if(id!==me.uid)welcome(id);return;
    }
    const rmv=t.closest("[data-remove]");if(rmv){
      const id=rmv.dataset.remove;if(!armedTwice("rm"+id,rmv,"確定移出？"))return;
      await setSlot(id,"");await deleteDoc(doc(db,"statics",curTid,"members",id));toast("已移出");return;
    }
    const lrm=t.closest("[data-lrm]");if(lrm){
      const id=lrm.dataset.lrm;if(!armedTwice("lrm"+id,lrm,"確定？"))return;
      const L={...(cur().leaders||{})};delete L[id];await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已取消團長");return;
    }
  }catch(e2){console.error(e2);toast(e2&&e2.code==="permission-denied"?"沒有權限執行這個動作":"操作失敗，請再試一次");}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(view==="mod"&&await bisChange(t))return;
    if(t.dataset.ph){const k=t.dataset.ph;phDraft[k]=t.type==="checkbox"?t.checked:t.value;return;}
    if(t.dataset.cover!==undefined){await updateDoc(doc(db,"statics",curTid,"members",t.dataset.cover),{cover:t.value});toast(t.value?"已設為可代 "+t.value:"已取消可代位置");return;}
    if(t.dataset.slot!==undefined){const id=t.dataset.slot;await setSlot(id,t.value);const w=mismatch(t.value,teamJob(curTid,id));toast(w?"提醒："+w:(t.value?"已設為 "+t.value:"已改為替補"));return;}
    if(t.dataset.tjob!==undefined){const id=t.dataset.tjob,v=t.value;const m=membersOf(curTid)[id]||{};
      const alts=(m.alts||[]).filter(k=>k&&k!==v);
      await updateDoc(doc(db,"statics",curTid,"members",id),{job:v,alts});
      const sl=Object.keys(cur().roles||{}).find(k=>cur().roles[k]===id)||"";const w=mismatch(sl,v||((users[id]||{}).job));
      toast(w?"提醒："+w:"已更新固定團職業");return;}
    if(t.dataset.talt!==undefined){const id=t.dataset.talt,i=+t.dataset.i;const m=membersOf(curTid)[id]||{};
      const a=[...(m.alts||[])];a[i]=t.value;const job=teamJob(curTid,id);
      const alts=[...new Set(a.filter(k=>k&&k!==job))].slice(0,2);
      await updateDoc(doc(db,"statics",curTid,"members",id),{alts});toast("已更新備用職業");return;}
    if(t.dataset.perm){await updateDoc(doc(db,"statics",curTid,"members",t.dataset.perm),{["perms."+t.dataset.pmod]:t.value});toast("已更新權限");return;}
    if(t.dataset.modstatus){await updateDoc(doc(db,"statics",curTid),{["modules."+t.dataset.modstatus]:t.value});toast("已更新為「"+MOD_STATUS[t.value]+"」");return;}
    if(t.dataset.lcap){
      const L={...(cur().leaders||{})};const id=t.dataset.lcap;L[id]={...(L[id]||{}),[t.dataset.cap]:t.checked};
      await updateDoc(doc(db,"statics",curTid),{leaders:L});toast("已更新團長權限");return;
    }
  }catch(e2){console.error(e2);toast(e2&&e2.code==="permission-denied"?"沒有權限執行這個動作":"更新失敗");}
});
</script>
