<!doctype html>
<html lang="zh-Hant">
<head>

<title>減傷軸｜光之戰士飛地</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">

<style>
:root{
  color-scheme:light;
  --bg:#E8ECF3; --surface:#F7F9FC; --ink:#1B2232; --muted:#5A6377; --line:#C9D1DE;
  --accent:#2F63C9; --accent-ink:#FFFFFF; --gold:#B8860B; --danger:#C23A4F;
  --tank:#2F63C9; --heal:#2E8B57; --dps:#C0392B; --raid:#7A45C2;
  --surface2:#EDF1F7; --headbg:#DFE7F4; --warnbg:#FFE7CF; --warn:#A9520A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
    --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
    --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A; --raid:#C3A0FF;
    --surface2:#202940; --headbg:#1F2B45; --warnbg:#4A3118; --warn:#F2A65A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
  --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;
  --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A; --raid:#C3A0FF;
  --surface2:#202940; --headbg:#1F2B45; --warnbg:#4A3118; --warn:#F2A65A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100%}
.bar{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar1{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.back{font-size:13px;color:var(--muted);text-decoration:none}

h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;margin:2px 0 0}
.sub{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.scrollx{display:flex;gap:6px;overflow-x:auto;align-items:center}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:32px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.lbl{font-size:12px;color:var(--muted);white-space:nowrap}

.g .ct,.g .cm{position:sticky;background:var(--surface);z-index:1}

.cell.act-heal{background:color-mix(in srgb,var(--heal) 22%,transparent)}

.dr{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgba(0,0,0,.18)}
@media (max-width:720px){.dr{top:auto;height:82vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}}
.drh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drh h2{font-size:16px;margin:0;flex:1}
.drb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.08em;border-top:1px solid var(--line);padding-top:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;width:100%}
.f:disabled{opacity:.7}
textarea.f{min-height:96px;resize:vertical}
.ro{padding:4px 0;white-space:pre-wrap}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.lk{display:flex;gap:6px;align-items:center}
.lk a{flex:1;word-break:break-all}
.ib{width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:15px;height:15px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.im{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.im img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.im .ib{position:absolute;top:4px;right:4px;width:28px;height:28px}
.sheet.img{max-width:1000px;padding:8px}
.sheet.img img{width:100%;height:auto;display:block;border-radius:10px}
.uses{display:flex;flex-direction:column;gap:8px}
.uj{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.uj .jn{font-size:12px;font-weight:900;width:52px}
.uj .jn.tank{color:var(--tank)}.uj .jn.heal{color:var(--heal)}.uj .jn.dps{color:var(--dps)}
.uk{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px;display:inline-flex}
.uk.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.uk:not(.on) .ico,.uk:not(.on) .tx{opacity:.4}
.uk:disabled{cursor:default}
.drf{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:600px;max-height:88vh;overflow:auto;padding:16px}
.sheet h2{font-size:17px;margin:0 0 10px}
.sk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sk .n{flex:1;min-width:0}.sk .c{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.addsk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.addsk .w{grid-column:1/-1}
.ta{width:100%;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.slotrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.slotrow b{width:40px}
.arm{background:var(--danger)!important;color:#FFFFFF!important;border-color:var(--danger)!important;width:auto!important;padding:0 10px!important;font-size:12px;font-weight:700;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60}
</style>

<div id="app"><div class="empty">載入中…</div></div>
<script type="module">
import { FIREBASE_CONFIG, OWNER_EMAIL, OWNER_DISCORD_ID } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp(FIREBASE_CONFIG),auth=getAuth(fb),db=getFirestore(fb);

/* ===== 常數 ===== */
const JOBS=[
  {k:"PLD",n:"騎士",r:"tank"},{k:"WAR",n:"戰士",r:"tank"},{k:"DRK",n:"暗黑騎士",r:"tank"},{k:"GNB",n:"絕槍戰士",r:"tank"},
  {k:"WHM",n:"白魔道士",r:"heal"},{k:"SCH",n:"學者",r:"heal"},{k:"AST",n:"占星術師",r:"heal"},{k:"SGE",n:"賢者",r:"heal"},
  {k:"MNK",n:"武僧",r:"dps"},{k:"DRG",n:"龍騎士",r:"dps"},{k:"NIN",n:"忍者",r:"dps"},{k:"SAM",n:"武士",r:"dps"},{k:"RPR",n:"奪魂者",r:"dps"},{k:"VPR",n:"毒蛇劍士",r:"dps"},
  {k:"BRD",n:"吟遊詩人",r:"dps"},{k:"MCH",n:"機工士",r:"dps"},{k:"DNC",n:"舞者",r:"dps"},
  {k:"BLM",n:"黑魔道士",r:"dps"},{k:"SMN",n:"召喚士",r:"dps"},{k:"RDM",n:"赤魔道士",r:"dps"},{k:"PCT",n:"繪靈法師",r:"dps"}
];
const JOB=Object.fromEntries(JOBS.map(j=>[j.k,j]));
const SLOTS=["MT","ST","H1","H2","D1","D2","D3","D4"];
const SLOT_ROLE={MT:"tank",ST:"tank",H1:"heal",H2:"heal",D1:"dps",D2:"dps",D3:"dps",D4:"dps"};
const TAGS=["","死刑","全體AOE","分攤","分散","擊退","小怪","狂暴"];
const BURST=["","120","60"];
const POT={dur:30,cd:270},BURST_DUR=20;
const IC={up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',dn:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>',x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>'};

/* ===== 狀態 ===== */
const qs=new URLSearchParams(location.search);
const tid=qs.get("team")||"";
let did=qs.get("duty")||"";
let me=null,isOwner=false,st=null,members={},users={},duties=[],lib={jobs:{}},duty=null,plan={comp:{},rows:{}},slotDocs={};
let cur=0,sel=null,filt="all",modal=null,toastT=null,gridT=null;
let dutyDirty=false,dutyT=null,libDirty=false,libT=null,planDirty=false,planT=null;
let imgCache={},uploading=0;
let unDuty=null,unPlan=null,unSlots=null,ready={duties:false,lib:false};

/* ===== 小工具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function secs(t){if(!t)return null;const m=String(t).trim().match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return m[2]!=null?(+m[1])*60+(+m[2]):+m[1];}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
function toast(m){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},2400);}
function armed(b,label){if(b.dataset.armed)return true;b.dataset.armed="1";const o=b.innerHTML;b.innerHTML=label;b.classList.add("arm");setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.innerHTML=o;b.classList.remove("arm");}},3000);return false;}
const nameOf=u=>u?(u.nick||u.dcName||"未命名"):"";

/* ===== 權限（要和 firestore.rules 一致） ===== */
const isLeader=()=>!!(me&&st&&(st.leaders||{})[me.uid]);
const myMem=()=>(me&&members[me.uid])||null;
const active=()=>{const m=myMem();return !!(m&&m.status==="active");};
const myPerm=()=>((myMem()||{}).perms||{}).mit||"none";
function canView(){
  if(!tid)return !!me;
  if(isOwner||isLeader())return true;
  if(!active())return false;
  const s=((st&&st.modules)||{}).mit||"owner";
  return s==="all"||(s==="selected"&&myPerm()!=="none");
}
const canAll=()=>!!tid&&(isOwner||isLeader()||(active()&&canView()&&myPerm()==="all"));
const canSlot=s=>canAll()||(!!tid&&active()&&canView()&&["own","all"].includes(myPerm())&&((st&&st.roles)||{})[s]===me.uid);
const canMech=()=>isOwner;
const mySlot=()=>{if(!me||!st)return "";const r=st.roles||{};return Object.keys(r).find(k=>r[k]===me.uid)||"";};

/* ===== 資料取用 ===== */
const LV=()=>(duty&&duty.level)||100;
function sv(sk){let cd=+sk.cd||0,dur=+sk.dur||0;const lv=sk.lv||{};Object.keys(lv).map(Number).sort((a,b)=>a-b).forEach(l=>{if(l<=LV()){if(lv[l].cd!=null&&lv[l].cd!=="")cd=+lv[l].cd;if(lv[l].dur!=null&&lv[l].dur!=="")dur=+lv[l].dur;}});return{cd,dur};}
const jobSkills=j=>(((lib.jobs||{})[j]||{}).skills||[]).filter(s=>!s.minLv||+s.minLv<=LV());
const allJobSkills=j=>(((lib.jobs||{})[j]||{}).skills||[]);
const skillOf=(j,id)=>allJobSkills(j).find(s=>s.id===id);
const dSlots=()=>(duty&&duty.slots&&duty.slots.length?duty.slots:["MT","H1","D1","D2"]);
function memberJob(u){if(!u)return "";const m=members[u]||{};return m.job||((users[u]||{}).job)||"";}
function compOf(s){const c=(plan.comp||{})[s];if(c)return c;const u=((st&&st.roles)||{})[s];return memberJob(u)||"";}
function vSlots(){return dSlots().filter(s=>filt==="all"||filt===s||(filt==="mine"&&s===mySlot()));}
const stage=()=>duty&&duty.stages&&duty.stages[cur];
const rows=()=>(stage()&&stage().rows)||[];
const prow=id=>((plan.rows||{})[id])||{};
const assign=(s,id)=>((((slotDocs[s]||{}).a)||{})[id])||[];
function skIco(j,sk,cls){const role=(JOB[j]||{}).r||"dps";if(sk.img)return '<img class="ico'+(cls?" "+cls:"")+'" src="'+esc(sk.img)+'" alt="'+esc(sk.name)+'" title="'+esc(sk.name)+'">';return '<span class="tx '+role+(cls?" "+cls:"")+'" role="img" aria-label="'+esc(sk.name)+'" title="'+esc(sk.name)+'">'+esc(sk.name.slice(0,2))+'</span>';}

/* ===== 時間推估與 CD ===== */
function est(rs){const t=rs.map(r=>secs(r.t)),out=[];for(let i=0;i<rs.length;i++){if(t[i]!=null){out.push({v:t[i],e:false});continue;}let a=i-1;while(a>=0&&t[a]==null)a--;let b=i+1;while(b<rs.length&&t[b]==null)b++;out.push(a>=0&&b<rs.length?{v:t[a]+(t[b]-t[a])*(i-a)/(b-a),e:true}:{v:null,e:true});}return out;}
function cdState(rs,E){const out={};dSlots().forEach(s=>{const j=compOf(s);jobSkills(j).forEach(sk=>{const{cd,dur}=sv(sk);let last=null;rs.forEach((r,i)=>{const t=E[i].v,used=assign(s,r.id).includes(sk.id),k=r.id+"|"+s+"|"+sk.id,d=(last!=null&&t!=null)?t-last:null;
  if(used){if(d!=null&&cd&&d<cd)out[k]={bad:cd-d};else{out[k]={use:1};if(t!=null)last=t;}}
  else if(d!=null){if(dur&&d<=dur)out[k]={act:1,left:dur-d};else if(cd&&d<cd)out[k]={cd:1,left:cd-d};}});});});return out;}
function teamState(rs,E){const out={};let lb=null,lbv="",lp=null;rs.forEach((r,i)=>{const t=E[i].v,p=prow(r.id);
  if(p.burst){out[r.id+"|B"]={use:1};if(t!=null){lb=t;lbv=p.burst;}}else if(lb!=null&&t!=null&&t-lb<=BURST_DUR)out[r.id+"|B"]={act:1,left:BURST_DUR-(t-lb),v:lbv};
  const d=(lp!=null&&t!=null)?t-lp:null;if(p.pot){if(d!=null&&d<POT.cd)out[r.id+"|P"]={bad:POT.cd-d};else{out[r.id+"|P"]={use:1};if(t!=null)lp=t;}}else if(d!=null){if(d<=POT.dur)out[r.id+"|P"]={act:1,left:POT.dur-d};else if(d<POT.cd)out[r.id+"|P"]={cd:1,left:POT.cd-d};}});return out;}

function loadImg(id){if(imgCache[id]!==undefined)return;imgCache[id]=null;getDoc(imgRef(id)).then(s=>{imgCache[id]=s.exists()?s.data().data:"";if(sel)renderDrawer();}).catch(()=>{imgCache[id]="";if(sel)renderDrawer();});}
function compress(f){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{URL.revokeObjectURL(img.src);let scale=Math.min(1,1600/Math.max(img.width,img.height)),q=.82,out="";
  for(let i=0;i<8;i++){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const x=c.getContext("2d");x.fillStyle="#FFFFFF";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL("image/webp",q);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/jpeg",q);if(out.length<=880000)break;if(q>.55)q-=.12;else scale*=.8;}
  out.length<=880000?res(out):rej(new Error("too big"));};img.onerror=()=>rej(new Error("decode"));img.src=URL.createObjectURL(f);});}
async function upload(files){if(!canAll()||!files||!files.length)return;const rowId=sel;uploading++;renderDrawer();
  for(const f of files){try{const data=await compress(f),id=uid()+uid();await setDoc(imgRef(id),{did,row:rowId,data,by:me.uid,createdAt:Date.now()});imgCache[id]=data;setP(rowId,{imgs:[...(prow(rowId).imgs||[]),id]});}
    catch(e){console.error(e);toast(e.message==="too big"?"這張圖太大，壓縮後還是超過上限":e.message==="decode"?"讀不到這張圖片":"上傳失敗："+(e.code==="permission-denied"?"沒有權限":e.code||e.message));}}
  uploading--;renderDrawer();renderGrid();toast("已上傳");}
async function delImg(id){const rowId=sel;setP(rowId,{imgs:(prow(rowId).imgs||[]).filter(x=>x!==id)});renderDrawer();renderGrid();try{await deleteDoc(imgRef(id));}catch(e){console.error(e);}delete imgCache[id];}

/* ===== 點擊 ===== */
function newRow(kind){const r={id:uid(),t:"",mech:"",tag:"",ctag:"",dmg:""};if(kind)r.kind=kind;return r;}
function onClick(e){const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,rs=rows();let i;
  if(a==="stage"){cur=+b.dataset.i;sel=null;renderDrawer();render();}
  else if(a==="filt"){filt=b.dataset.s;render();}
  else if(a==="cell")toggleSkill(b.dataset.s,b.dataset.r,b.dataset.k);
  else if(a==="dtog")toggleSkill(b.dataset.s,sel,b.dataset.k);
  else if(a==="bcell"){const p=prow(b.dataset.r);setP(b.dataset.r,{burst:!p.burst?"120":p.burst==="120"?"60":""});renderGrid();if(sel===b.dataset.r)renderDrawer();}
  else if(a==="pcell"){const p=prow(b.dataset.r);setP(b.dataset.r,{pot:p.pot?"":"1"});renderGrid();if(sel===b.dataset.r)renderDrawer();}
  else if(a==="open"){sel=b.dataset.r;renderDrawer();renderGrid();}
  else if(a==="dclose"){sel=null;renderDrawer();renderGrid();}
  else if((a==="addrow"||a==="addhead")&&canMech()){const nr=newRow(a==="addhead"?"head":"");rs.push(nr);sel=nr.id;saveDutySoon();renderGrid();renderDrawer();const g=$("#gw");g.scrollTop=g.scrollHeight;const m=$('#dr [data-f="mech"]');if(m)m.focus();}
  else if(a==="insbelow"&&canMech()){i=rs.findIndex(x=>x.id===sel);const nr=newRow("");rs.splice(i+1,0,nr);sel=nr.id;saveDutySoon();renderGrid();renderDrawer();const m=$('#dr [data-f="mech"]');if(m)m.focus();}
  else if(a==="kind"&&canMech()){const r=rs.find(x=>x.id===sel);if(b.dataset.k)r.kind="head";else delete r.kind;saveDutySoon();renderDrawer();renderGrid();}
  else if((a==="up"||a==="dn")&&canMech()){i=rs.findIndex(x=>x.id===sel);const t=a==="up"?i-1:i+1;if(t<0||t>=rs.length)return;rs.splice(t,0,rs.splice(i,1)[0]);saveDutySoon();renderGrid();}
  else if(a==="rdel"&&canMech()){if(!armed(b,"再按一次刪除"))return;rs.splice(rs.findIndex(x=>x.id===sel),1);sel=null;saveDutySoon();renderDrawer();renderGrid();}
  else if(a==="ladd"){const U=$("#lkU").value.trim(),L=$("#lkL").value.trim();if(!/^https?:\/\//i.test(U)){toast("連結要以 http:// 或 https:// 開頭");return;}setP(sel,{links:[...(prow(sel).links||[]),{label:L,url:U}]});renderDrawer();renderGrid();}
  else if(a==="zoom"){modal={k:"img",src:imgCache[b.dataset.id]};renderModal();}
  else if(a==="idel"&&canAll()){if(!armed(b,"確認"))return;delImg(b.dataset.id);}
  else if(a==="ldel"){const l=(prow(sel).links||[]).slice();l.splice(+b.dataset.i,1);setP(sel,{links:l});renderDrawer();renderGrid();}
  else if(a==="skills"){modal={k:"skills",j:modal&&modal.j||compOf(dSlots()[0])||"PLD"};renderModal();}
  else if(a==="skjob"){modal.j=b.dataset.j;renderModal();}
  else if(a==="skadd")skAdd();
  else if(a==="skup"&&isOwner){i=+b.dataset.i;if(i<1)return;const l=lib.jobs[modal.j].skills;l.splice(i-1,0,l.splice(i,1)[0]);saveLibSoon();renderModal();render();}
  else if(a==="skdel"&&isOwner){if(!armed(b,"確認"))return;lib.jobs[modal.j].skills.splice(+b.dataset.i,1);saveLibSoon();renderModal();render();}
  else if(a==="skedit"){modal.edit=b.dataset.id;renderModal();}
  else if(a==="text"){modal={k:"text"};renderModal();}
  else if(a==="io"){modal={k:"io"};renderModal();}
  else if(a==="copy")copyTA();
  else if(a==="import")doImport(b);
  else if(a==="comp"){modal={k:"comp"};renderModal();}
  else if(a==="compsave")compSave();
  else if(a==="dutyset"){modal={k:"duty"};renderModal();}
  else if(a==="dutynew"){modal={k:"duty",isNew:true};renderModal();}
  else if(a==="dutysave")dutySave();
  else if(a==="stadd"){modal.stages.push({id:"s"+uid(),name:"新階段",rows:[]});renderModal();}
  else if(a==="stdel"){if(!armed(b,"確認"))return;modal.stages.splice(+b.dataset.i,1);renderModal();}
  else if(a==="stup"){i=+b.dataset.i;if(i<1)return;modal.stages.splice(i-1,0,modal.stages.splice(i,1)[0]);renderModal();}
  else if(a==="mclose")closeModal();
}

function onModalChange(e){const t=e.target;
  if(t.id==="skimg"&&t.files[0])readIcon(t.files[0]).then(u=>{modal.img=u;renderModal();toast("圖示已選好");}).catch(()=>toast("圖片讀取失敗"));
  else if(t.id==="iofile"&&t.files[0])t.files[0].text().then(x=>{$("#ta").value=x;toast("已讀入檔案，按「匯入」");});
  else if(t.dataset.slot){const s=t.dataset.slot;modal.name=$("#dn").value;modal.level=$("#dl").value;if($("#did"))modal.id=$("#did").value;document.querySelectorAll("[data-stn]").forEach(el=>{modal.stages[+el.dataset.stn].name=el.value;});
    modal.slots=t.checked?SLOTS.filter(x=>x===s||modal.slots.includes(x)):modal.slots.filter(x=>x!==s);renderModal();}
}
function closeModal(){modal=null;const m=$("#modal");if(m)m.remove();}
function readIcon(f){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=40;const x=c.getContext("2d"),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,40,40);res(c.toDataURL("image/png"));URL.revokeObjectURL(img.src);};img.onerror=rej;img.src=URL.createObjectURL(f);});}
function skAdd(){if(!isOwner)return;const n=$("#skn").value.trim();if(!n){toast("請輸入技能名稱");return;}
  const num=id=>{const v=parseInt($(id).value,10);return isNaN(v)?"":v;};
  lib.jobs=lib.jobs||{};const J=lib.jobs[modal.j]=lib.jobs[modal.j]||{skills:[]};
  const ed=modal.edit?J.skills.find(s=>s.id===modal.edit):null,s=ed||{id:modal.j.toLowerCase()+uid()};
  s.name=n;s.cd=num("#skc")||0;s.dur=num("#skd")||0;s.desc=$("#skdesc").value.trim();
  const m=num("#skm");if(m)s.minLv=m;else delete s.minLv;
  const c1=num("#skc1"),d1=num("#skd1");if(c1!==""||d1!==""){s.lv={100:{}};if(c1!=="")s.lv[100].cd=c1;if(d1!=="")s.lv[100].dur=d1;}else delete s.lv;
  if(modal.img)s.img=modal.img;if(!ed)J.skills.push(s);
  modal.edit="";modal.img=null;saveLibSoon();renderModal();render();toast(ed?"已更新":"已新增");}
function compSave(){if(!canAll())return;const c={};document.querySelectorAll("[data-comp]").forEach(el=>{if(el.value)c[el.dataset.comp]=el.value;});plan.comp=c;savePlanSoon();closeModal();render();toast("陣容已更新");}
async function dutySave(){if(!isOwner)return;const name=$("#dn").value.trim(),level=parseInt($("#dl").value,10)||100;document.querySelectorAll("[data-stn]").forEach(el=>{modal.stages[+el.dataset.stn].name=el.value.trim()||"未命名";});
  if(!name){toast("請輸入副本名稱");return;}if(!modal.slots.length){toast("至少選一個位置");return;}
  if(modal.isNew||!duty){const id=($("#did").value||"").trim();if(!/^[A-Za-z0-9_-]{2,40}$/.test(id)){toast("代號只能用英數字");return;}if(duties.some(d=>d.id===id)){toast("代號已經有人用了");return;}
    await setDoc(doc(db,"mitDuties",id),{name,level,slots:modal.slots,stages:modal.stages.map(s=>({id:s.id,name:s.name,rows:[]})),updatedAt:Date.now()});closeModal();switchDuty(id);toast("已新增副本");return;}
  const old=Object.fromEntries((duty.stages||[]).map(s=>[s.id,s]));
  duty.name=name;duty.level=level;duty.slots=modal.slots;duty.stages=modal.stages.map(s=>({id:s.id,name:s.name,rows:old[s.id]?old[s.id].rows:[]}));
  if(cur>=duty.stages.length)cur=0;await saveDuty();closeModal();render();toast("已儲存");}
function textSheet(){const out=[];(duty.stages||[]).forEach(s=>{if(!s.rows.length)return;out.push("【"+s.name+"】");s.rows.forEach(r=>{const p=prow(r.id),parts=[];
  dSlots().forEach(sl=>{const j=compOf(sl),n=assign(sl,r.id).map(id=>(skillOf(j,id)||{}).name).filter(Boolean);if(n.length)parts.push(sl+" "+n.join("、"));});
  out.push((r.kind==="head"?"■ ":"  ")+(r.t?r.t+" ":"")+(r.mech||"？")+(r.tag||r.ctag?"（"+[r.tag,r.ctag].filter(Boolean).join("・")+"）":"")+(r.dmg?" "+r.dmg:"")+(p.burst?"【"+p.burst+" 爆發】":"")+(p.pot?"【藥】":"")+(parts.length?"｜"+parts.join("｜"):""));
  if(p.note)out.push("    解法："+p.note.replace(/\n/g," "));if((p.imgs||[]).length)out.push("    站位圖 "+p.imgs.length+" 張（請到網站看）");(p.links||[]).forEach(l=>out.push("    "+(l.label?l.label+" ":"")+l.url));});out.push("");});return out.join("\n")||"還沒有內容";}
function copyTA(){const ta=$("#ta");ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast("已複製"),()=>toast("請長按文字手動複製"));else toast(ok?"已複製":"請長按文字手動複製");}
function exportData(){const o={type:"mit-seed",v:1};if(duty){const d=clone(duty);o.duty=d;}if(tid&&duty){o.plan={comp:plan.comp||{},rows:plan.rows||{},slots:Object.fromEntries(dSlots().map(s=>[s,{a:(slotDocs[s]||{}).a||{}}]))};}return o;}
async function doImport(b){if(!isOwner)return;let o;try{o=JSON.parse($("#ta").value);}catch(e){toast("資料格式不對");return;}
  if(!o||o.type!=="mit-seed"){toast("這不是減傷軸的匯入檔");return;}
  if(!armed(b,"再按一次匯入"))return;
  try{
    if(o.skills){lib.jobs=lib.jobs||{};Object.keys(o.skills).forEach(j=>{lib.jobs[j]={skills:o.skills[j].skills||[]};});await saveLib();}
    if(o.duty&&o.duty.id){const d=clone(o.duty),id=d.id;delete d.id;d.updatedAt=Date.now();await setDoc(doc(db,"mitDuties",id),d);did=id;}
    if(o.plan&&tid&&did&&canAll()){const bt=writeBatch(db);bt.set(doc(db,"statics",tid,"mit",did),{comp:o.plan.comp||{},rows:o.plan.rows||{},updatedAt:Date.now(),by:me.uid});
      Object.keys(o.plan.slots||{}).forEach(s=>bt.set(doc(db,"statics",tid,"mit",did,"slots",s),{a:(o.plan.slots[s]||{}).a||{},updatedAt:Date.now(),by:me.uid}));await bt.commit();}
    closeModal();switchDuty(did);toast(o.plan&&!tid?"已匯入機制與技能（分工要從固團頁面進來才會匯入）":"已匯入");
  }catch(e){console.error(e);toast("匯入失敗："+(e.code||e.message));}}

/* ===== 即時同步 ===== */
function switchDuty(id){did=id;cur=0;sel=null;renderDrawer();
  const u=new URL(location.href);if(id)u.searchParams.set("duty",id);history.replaceState(null,"",u);
  if(unDuty)unDuty();if(unPlan)unPlan();if(unSlots)unSlots();duty=null;plan={comp:{},rows:{}};slotDocs={};
  if(!id){render();return;}
  unDuty=onSnapshot(doc(db,"mitDuties",id),s=>{if(dutyDirty)return;duty=s.exists()?{id:s.id,...s.data()}:null;if(duty&&cur>=(duty.stages||[]).length)cur=0;render();if(sel)renderDrawer();},e=>{console.error(e);toast("副本讀取失敗");});
  if(tid){
    unPlan=onSnapshot(doc(db,"statics",tid,"mit",id),s=>{if(planDirty)return;plan=s.exists()?s.data():{comp:{},rows:{}};plan.comp=plan.comp||{};plan.rows=plan.rows||{};render();if(sel)renderDrawer();},e=>console.error(e));
    unSlots=onSnapshot(collection(db,"statics",tid,"mit",id,"slots"),s=>{s.docChanges().forEach(c=>{if(c.type==="removed")delete slotDocs[c.doc.id];else if(!c.doc.metadata.hasPendingWrites)slotDocs[c.doc.id]=c.doc.data();});renderGrid();if(sel)renderDrawer();},e=>console.error(e));
  }
  render();
}
async function loadUser(u){if(!u||users[u])return;try{const s=await getDoc(doc(db,"users",u));if(s.exists()){users[u]=s.data();render();}}catch(e){}}
function start(){
  onSnapshot(collection(db,"mitDuties"),s=>{duties=s.docs.map(d=>({id:d.id,name:d.data().name||d.id})).sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));ready.duties=true;
    if(!did&&duties.length)switchDuty(duties[0].id);else render();},e=>{console.error(e);toast("副本清單讀取失敗");});
  onSnapshot(doc(db,"mitSkills","lib"),s=>{if(libDirty)return;lib=s.exists()?s.data():{jobs:{}};lib.jobs=lib.jobs||{};ready.lib=true;render();if(modal&&modal.k==="skills")renderModal();},e=>console.error(e));
  if(tid){
    onSnapshot(doc(db,"statics",tid),s=>{st=s.exists()?{id:s.id,...s.data()}:{name:"（找不到固團）"};Object.values(st.roles||{}).forEach(loadUser);render();},e=>console.error(e));
    onSnapshot(collection(db,"statics",tid,"members"),s=>{members={};s.forEach(d=>{members[d.id]=d.data();});render();},e=>console.error(e));
  }
  if(did)switchDuty(did);
}

document.getElementById("app").addEventListener("click",onClick);
document.addEventListener("change",e=>{if(e.target.id==="dutySel")switchDuty(e.target.value);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modal)closeModal();else if(sel){sel=null;renderDrawer();renderGrid();}}});
window.addEventListener("beforeunload",()=>{if(dutyDirty)saveDuty();if(libDirty)saveLib();if(planDirty&&tid)savePlan();});

let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){me=null;render();return;}
  me=u;try{const tr=await u.getIdTokenResult();isOwner=tr.claims.dc===OWNER_DISCORD_ID||(u.email===OWNER_EMAIL&&u.emailVerified);}catch(e){isOwner=false;}
  if(!started){started=true;start();}render();
});
</script>
</body>
