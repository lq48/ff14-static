<style>
:root{
  color-scheme:light;
  --bg:#E8ECF3; --surface:#F7F9FC; --ink:#1B2232; --muted:#5A6377; --line:#C9D1DE;
  --accent:#2F63C9; --accent-ink:#FFFFFF; --gold:#B8860B; --danger:#C23A4F;
  --tank:#2F63C9; --heal:#2E8B57; --dps:#C0392B; --raid:#7A45C2;
  --surface2:#EDF1F7; --headbg:#E1E4EA; --warnbg:#FFE7CF; --warn:#A9520A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){

    --tank:#7FA6FF; --heal:#5FCB8E; --dps:#FF8A7A; --raid:#C3A0FF;
    --surface2:#202940; --headbg:#262C38; --warnbg:#4A3118; --warn:#F2A65A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111622; --surface:#192031; --ink:#E5E9F2; --muted:#97A0B3; --line:#2C3549;
  --accent:#6E9BFF; --accent-ink:#0D1320; --gold:#E9BE4B; --danger:#FF7D8F;

}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}

.bar{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}

select.f.duty{min-height:36px;font-weight:700;max-width:260px}
.scrollx{display:flex;gap:6px;overflow-x:auto;align-items:center}

.lbl{font-size:12px;color:var(--muted);white-space:nowrap}

.jh{text-align:center;font-weight:900}

.pill.t-死刑,.pill.t-狂暴{border-color:var(--dps);color:var(--dps)}

.cell{position:relative}

.early select.f,.early input.tgi{width:auto;min-height:30px;padding:2px 6px}

.cell .eb{position:absolute;right:0;bottom:0;font-size:9.5px;font-weight:900;line-height:12px;padding:0 2px;border-radius:3px;background:var(--ink);color:var(--bg);pointer-events:none}
.cell.short .ico,.cell.short .tx{outline:2px dashed var(--warn);outline-offset:1px}
.hit{display:grid;grid-template-columns:96px 1fr 52px 56px 34px;gap:6px;align-items:center;margin-bottom:6px}
.early{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin:2px 0 4px 58px}

.dt{width:16px;height:16px;flex:none;vertical-align:middle}
.est{color:var(--muted);font-style:italic}
tr.head .ct,tr.head .cm{background:var(--headbg)}
tr.head .mb .n{font-size:15px;font-weight:900}
tr.on .ct,tr.on .cm{box-shadow:inset 3px 0 0 var(--accent)}
.cell{width:36px;min-width:36px;max-width:36px;height:40px;text-align:center;background:transparent}
.cell.ed{cursor:pointer}
.cell.ed:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cell.cd{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 22%,transparent) 0 4px,transparent 4px 8px)}
.cell.act-tank{background:color-mix(in srgb,var(--tank) 22%,transparent)}
.cell.act-heal{background:color-mix(in srgb,var(--heal) 22%,transparent)}

.cell.act-b120{background:rgba(255,110,30,.28)}
.cell.act-pot{background:rgba(150,90,210,.26)}

.cell.bad .ico,.cell.bad .tx{outline:3px solid var(--warn);outline-offset:1px}
.ico{width:32px;height:32px;border-radius:6px;display:inline-block;vertical-align:middle;object-fit:cover}
.tx{display:inline-flex;width:32px;height:32px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#FFFFFF;vertical-align:middle}
.tx.tank{background:var(--tank)}.tx.heal{background:var(--heal)}.tx.dps{background:var(--dps)}
.bx{display:inline-flex;width:32px;height:32px;border-radius:7px;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#E8C468;color:#1B1608;flex:none}

.lb{position:relative;display:inline-block;width:32px;height:32px;vertical-align:middle}
.lb img{width:32px;height:32px;border-radius:6px;display:block}
.lb b{position:absolute;right:-3px;bottom:-4px;background:var(--ink);color:var(--bg);font-size:10px;line-height:14px;padding:0 3px;border-radius:4px}
.lbh img{width:32px;height:32px;border-radius:6px;display:block}
.g tr.tk .ct,.g tr.tk .cm{background:color-mix(in srgb,var(--tank) 30%,var(--surface))}
.g tr.hl .ct,.g tr.hl .cm{background:color-mix(in srgb,var(--heal) 30%,var(--surface))}
.g tr.tk .ct{box-shadow:inset 5px 0 0 var(--tank)}
.g tr.hl .ct{box-shadow:inset 5px 0 0 var(--heal)}

table.g.names .r2 th{top:62px}
.jh .who{display:block;font-weight:500;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:1px auto 0}
.addrow{display:flex;gap:8px;padding:10px 14px;position:sticky;left:0}
.addrow button{border:1px dashed var(--line);background:transparent;border-radius:10px;min-height:40px;padding:0 14px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);padding:0 14px 16px;position:sticky;left:0;max-width:760px}
.dr{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgba(0,0,0,.18)}

.fld>span{font-size:12px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;width:100%}

.ro{padding:4px 0;white-space:pre-wrap}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-height:36px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.lk{display:flex;gap:6px;align-items:center}
.lk a{flex:1;word-break:break-all}
.ib{width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:15px;height:15px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}

.sheet.img{max-width:1000px;padding:8px}

.uses{display:flex;flex-direction:column;gap:8px}

.uk:not(.on) .ico,.uk:not(.on) .tx{opacity:.4}
.uk:disabled{cursor:default}
.drf{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:600px;max-height:88vh;overflow:auto;padding:16px}
.sheet h2{font-size:17px;margin:0 0 10px}
.sk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sk .n{flex:1;min-width:0}.sk .c{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.addsk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}

.tier{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;background:var(--surface2)}
.fxb{border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:6px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.fx1{display:grid;grid-template-columns:84px 1fr 64px 34px;gap:6px}
.fx2{display:flex;gap:6px;flex-wrap:wrap}
.fx2 select{width:auto}
.fx2 input{flex:1;min-width:160px}

.ta{width:100%;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ===== 狀態 ===== */
const qs=new URLSearchParams(location.search);
const tid=qs.get("team")||"";
let did=qs.get("duty")||"";
let me=null,isOwner=false,st=null,members={},users={},duties=[],lib={jobs:{}},duty=null,plan={comp:{},rows:{}},slotDocs={};
let cur=0,sel=null,filt="all",modal=null,toastT=null,gridT=null;
/* 檢視：grid＝完整時間軸（可編輯）、list＝我的減傷（唯讀列表）；記在這台裝置，手機第一次預設列表 */
let vmode=(()=>{try{const v=localStorage.getItem("mitView");if(v==="grid"||v==="list")return v;}catch(e){}return matchMedia("(max-width:700px)").matches?"list":"grid";})();
let listInit=false;
let dutyDirty=false,dutyT=null,libDirty=false,libT=null,planDirty=false,planT=null;
let imgCache={},uploading=0;
let unDuty=null,unPlan=null,unSlots=null,ready={duties:false,lib:false};

/* ===== 小工具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function secs(t){if(!t)return null;const m=String(t).trim().match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return m[2]!=null?(+m[1])*60+(+m[2]):+m[1];}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
function toast(m){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},2400);}
function armed(b,label){if(b.dataset.armed)return true;b.dataset.armed="1";const o=b.innerHTML;b.innerHTML=label;b.classList.add("arm");setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.innerHTML=o;b.classList.remove("arm");}},3000);return false;}
const nameOf=u=>u?(u.nick||u.dcName||"未命名"):"";

/* ===== 權限（要和 firestore.rules 一致） ===== */
const isLeader=()=>!!(me&&st&&(st.leaders||{})[me.uid]);
const myMem=()=>(me&&members[me.uid])||null;
const active=()=>{const m=myMem();return !!(m&&m.status==="active");};
const myPerm=()=>((myMem()||{}).perms||{}).mit||"none";
function canView(){
  if(!tid)return !!me;
  if(isOwner||isLeader())return true;
  if(!active())return false;
  const s=((st&&st.modules)||{}).mit||"owner";
  return s==="all"||(s==="selected"&&myPerm()!=="none");
}
const canAll=()=>!!tid&&(isOwner||isLeader()||(active()&&canView()&&myPerm()==="all"));
const canSlot=s=>canAll()||(!!tid&&active()&&canView()&&["own","all"].includes(myPerm())&&((st&&st.roles)||{})[s]===me.uid);
const canMech=()=>isOwner;
const mySlot=()=>{if(!me||!st)return "";const r=st.roles||{};return Object.keys(r).find(k=>r[k]===me.uid)||"";};

/* ===== 資料取用 ===== */
const LV=()=>(duty&&duty.level)||100;
const FXK={mit:"減傷",shield:"護盾",heal:"回復",other:"其他"},FXW={self:"自身",target:"目標",party:"全隊",enemy:"敵人"},FXT={all:"全部傷害",phys:"物理",magic:"魔法"};
function tiersOf(sk){if(Array.isArray(sk.tiers)&&sk.tiers.length)return sk.tiers.slice().sort((a,b)=>(+a.lv||0)-(+b.lv||0));
  const t=[{lv:+sk.minLv||1,cd:+sk.cd||0,dur:+sk.dur||0,fx:[]}],l=(sk.lv||{})[100];
  if(l)t.push({lv:100,cd:l.cd!=null&&l.cd!==""?+l.cd:+sk.cd||0,dur:l.dur!=null&&l.dur!==""?+l.dur:+sk.dur||0,fx:[]});return t;}
function tierAt(sk,lv){let r=null;tiersOf(sk).forEach(t=>{if((+t.lv||0)<=lv)r=t;});return r;}
function sv(sk){const t=tierAt(sk,LV())||tiersOf(sk)[0];return{cd:+t.cd||0,dur:+t.dur||0};}
function fxLine(f){const v=String(f.v||"").trim(),num=/^[\d.]+$/.test(v);
  const val=f.k==="mit"?(v?(num?v+"%":v):""):f.k==="heal"?(v?"恢復力 "+v:""):v;
  return [(f.w&&f.w!=="self"&&FXW[f.w])||"",FXK[f.k]||"",val,(f.t&&f.t!=="all"?"（"+FXT[f.t]+"）":"")].filter(Boolean).join(" ")+(f.d?" "+f.d+" 秒":"")+(f.c?"，"+f.c:"");}
function fxText(sk){const t=tierAt(sk,LV());return t&&(t.fx||[]).length?t.fx.map(fxLine).join("／"):"";}
const jobSkills=j=>allJobSkills(j).filter(s=>tierAt(s,LV()));
const allJobSkills=j=>(((lib.jobs||{})[j]||{}).skills||[]);
const skillOf=(j,id)=>allJobSkills(j).find(s=>s.id===id);

function memberJob(u){if(!u)return "";const m=members[u]||{};return m.job||((users[u]||{}).job)||"";}
function compOf(s){const c=(plan.comp||{})[s];if(c)return c;const u=((st&&st.roles)||{})[s];return memberJob(u)||"";}
function vSlots(){return dSlots().filter(s=>filt==="all"||filt===s||(filt==="mine"&&s===mySlot())||(filt.startsWith("job:")&&compOf(s)===filt.slice(4)));}

function normRow(r){if(r.tag==="小怪")r.tag="";if(!Array.isArray(r.hits)){let d=(r.dmg||"").trim(),ty=r.dtype||"";const m=d.match(/^(魔法|物理|真實)(?:｜(.*))?$/);
  if(m&&!ty){ty={魔法:"magic",物理:"phys",真實:"true"}[m[1]];d=(m[2]||"").trim();}
  if(d&&!/\d/.test(d)){if(!r.desc)r.desc=d;else r.desc+="\n"+d;d="";}
  r.hits=(d||ty)?[{dtype:ty,dmg:d}]:[];}delete r.dmg;delete r.dtype;return r;}
function hitSpan(r){let m=0;(r.hits||[]).forEach(x=>{const o=+x.off||0;if(o>m)m=o;});return m;}
const TGT_DEF={"白牛清汁":"ally","輸血":"ally","均衡診斷":"ally","靈橡清汁":"ally","牽制":"enemy","昏亂":"enemy"};
const tgtOf=sk=>sk.tgt==="none"?"":(sk.tgt||TGT_DEF[sk.name]||"");
function target(s,id,k){return (((((slotDocs[s]||{}).tg)||{})[id])||{})[k]||"";}
function early(s,id,k){const o=((((slotDocs[s]||{}).o)||{})[id])||{};return +o[k]||0;}
function dispRows(base){const E0=est(base),vs=[],byT={};base.forEach((r,i)=>{const s0=secs(r.t0);if(r.kind==="head"||s0==null)return;
  if(byT[s0]){byT[s0].all.push(r);return;}const v={id:"v_"+r.id,virt:true,of:r,all:[r],t:r.t0,s:s0,mi:i};byT[s0]=v;vs.push(v);});vs.sort((a,b)=>a.s-b.s);
  const out=[];base.forEach((r,i)=>{vs.forEach(v=>{if(v.done)return;if(v.mi===i||(v.mi>i&&E0[i].v!=null&&(r.kind==="head"?v.s<E0[i].v:v.s<=E0[i].v))){out.push(v);v.done=1;}});out.push(r);});return out;}
function est(rs){const t=rs.map(r=>secs(r.t)),out=[];for(let i=0;i<rs.length;i++){if(t[i]!=null){out.push({v:t[i],e:false});continue;}let a=i-1;while(a>=0&&t[a]==null)a--;let b=i+1;while(b<rs.length&&t[b]==null)b++;out.push(a>=0&&b<rs.length?{v:t[a]+(t[b]-t[a])*(i-a)/(b-a),e:true}:{v:null,e:true});}return out;}
function cdState(L,E){const out={};dSlots().forEach(s=>{const j=compOf(s);jobSkills(j).forEach(sk=>{const{cd,dur}=sv(sk),uses=[];
  L.forEach((r,i)=>{if(r.virt||!assign(s,r.id).includes(sk.id))return;const t=E[i].v,eo=early(s,r.id,sk.id);uses.push({id:r.id,r,t,eo,st:t!=null?t-eo:null});});
  let prev=null;uses.forEach(u=>{const k=u.id+"|"+s+"|"+sk.id;if(u.st!=null&&prev!=null&&cd&&u.st-prev<cd){out[k]={bad:cd-(u.st-prev),eo:u.eo};return;}u.ok=1;const o={use:1,eo:u.eo};
    if(u.st!=null&&dur){if(u.st+dur<u.t)o.short="judge";else if(u.st+dur<u.t+hitSpan(u.r))o.short="tail";}out[k]=o;if(u.st!=null)prev=u.st;});
  const ok=uses.filter(u=>u.ok&&u.st!=null);
  L.forEach((r,i)=>{const k=r.id+"|"+s+"|"+sk.id,t=E[i].v;if(out[k]||t==null)return;let last=null;ok.forEach(u=>{if(u.st<=t&&(last==null||u.st>last))last=u.st;});if(last==null)return;const d=t-last;
    if(dur&&d<=dur)out[k]={act:1,left:dur-d};else if(cd&&d<cd)out[k]={cd:1,left:cd-d};});});});return out;}
function teamState(rs,E){const out={};let lb=null,lbv="",lp=null;rs.forEach((r,i)=>{const t=E[i].v,p=prow(r.id);
  if(p.burst){out[r.id+"|B"]={use:1};if(t!=null){lb=t;lbv=p.burst;}}else if(lb!=null&&t!=null&&t-lb<=BURST_DUR)out[r.id+"|B"]={act:1,left:BURST_DUR-(t-lb),v:lbv};
  const d=(lp!=null&&t!=null)?t-lp:null;if(p.pot){if(d!=null&&d<POT.cd)out[r.id+"|P"]={bad:POT.cd-d};else{out[r.id+"|P"]={use:1};if(t!=null)lp=t;}}else if(d!=null){if(d<=POT.dur)out[r.id+"|P"]={act:1,left:POT.dur-d};else if(d<POT.cd)out[r.id+"|P"]={cd:1,left:POT.cd-d};}});return out;}

function compress(f){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{URL.revokeObjectURL(img.src);let scale=Math.min(1,1600/Math.max(img.width,img.height)),q=.82,out="";
  for(let i=0;i<8;i++){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const x=c.getContext("2d");x.fillStyle="#FFFFFF";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL("image/webp",q);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/jpeg",q);if(out.length<=880000)break;if(q>.55)q-=.12;else scale*=.8;}
  out.length<=880000?res(out):rej(new Error("too big"));};img.onerror=()=>rej(new Error("decode"));img.src=URL.createObjectURL(f);});}
async function upload(files){if(!canAll()||!files||!files.length)return;const rowId=sel;uploading++;renderDrawer();
  for(const f of files){try{const data=await compress(f),id=uid()+uid();await setDoc(imgRef(id),{did,row:rowId,data,by:me.uid,createdAt:Date.now()});imgCache[id]=data;setP(rowId,{imgs:[...(prow(rowId).imgs||[]),id]});}
    catch(e){console.error(e);toast(e.message==="too big"?"這張圖太大，壓縮後還是超過上限":e.message==="decode"?"讀不到這張圖片":"上傳失敗："+(e.code==="permission-denied"?"沒有權限":e.code||e.message));}}
  uploading--;renderDrawer();renderGrid();toast("已上傳");}
async function delImg(id){const rowId=sel;setP(rowId,{imgs:(prow(rowId).imgs||[]).filter(x=>x!==id)});renderDrawer();renderGrid();try{await deleteDoc(imgRef(id));}catch(e){console.error(e);}delete imgCache[id];}

function newRow(kind){const r={id:uid(),t:"",mech:"",tag:"",ctag:"",hits:[]};if(kind)r.kind=kind;return r;}
function onClick(e){const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,rs=rows();let i;
  if(a==="stage"){cur=+b.dataset.i;sel=null;renderDrawer();render();}
  else if(a==="names"){showNames=!showNames;try{localStorage.setItem("mitNames",showNames?"1":"0");}catch(err){}render();}
  else if(a==="tcompact"){modal.compact=b.checked;try{localStorage.setItem("mitTextCompact",b.checked?"1":"0");}catch(e){}renderModal();}
  else if(a==="tmode"){modal.slot=b.dataset.s;try{localStorage.setItem("mitTextMode",b.dataset.s===mySlot()?"mine":b.dataset.s);}catch(e){}renderModal();}
  else if(a==="filt"){filt=b.dataset.s;render();}
  else if(a==="vmode"){vmode=b.dataset.v;try{localStorage.setItem("mitView",vmode);}catch(err){}if(vmode==="list"&&filt==="all"&&mySlot()&&dSlots().includes(mySlot()))filt="mine";render();}
  else if(a==="cell")toggleSkill(b.dataset.s,b.dataset.r,b.dataset.k);
  else if(a==="dtog")toggleSkill(b.dataset.s,sel,b.dataset.k);
  else if(a==="bcell"){const p=prow(b.dataset.r);setP(b.dataset.r,{burst:!p.burst?"120":p.burst==="120"?"60":""});renderGrid();if(sel===b.dataset.r)renderDrawer();}
  else if(a==="lcell"){const p=prow(b.dataset.r),L=["",...dSlots()],i2=L.indexOf(p.lb||"");setP(b.dataset.r,{lb:L[(i2+1)%L.length]});renderGrid();if(sel===b.dataset.r)renderDrawer();}
  else if(a==="pcell"){const p=prow(b.dataset.r);setP(b.dataset.r,{pot:p.pot?"":"1"});renderGrid();if(sel===b.dataset.r)renderDrawer();}
  else if(a==="open"){sel=b.dataset.r;renderDrawer();renderGrid();}
  else if(a==="dclose"){sel=null;renderDrawer();renderGrid();}
  else if((a==="addrow"||a==="addhead")&&canMech()){const nr=newRow(a==="addhead"?"head":"");rs.push(nr);sel=nr.id;saveDutySoon();renderGrid();renderDrawer();const g=$("#gw");g.scrollTop=g.scrollHeight;const m=$('#dr [data-f="mech"]');if(m)m.focus();}
  else if(a==="insbelow"&&canMech()){i=rs.findIndex(x=>x.id===sel);const nr=newRow("");rs.splice(i+1,0,nr);sel=nr.id;saveDutySoon();renderGrid();renderDrawer();const m=$('#dr [data-f="mech"]');if(m)m.focus();}
  else if(a==="hadd"&&canMech()){const r=rs.find(x=>x.id===sel);(r.hits=r.hits||[]).push({dtype:""});saveDutySoon();renderDrawer();renderGrid();const ins=document.querySelectorAll('#dr [data-h="dmg"]');if(ins.length)ins[ins.length-1].focus();}
  else if(a==="hdel"&&canMech()){const r=rs.find(x=>x.id===sel);r.hits.splice(+b.dataset.i,1);saveDutySoon();renderDrawer();renderGrid();}
  else if(a==="t0same"&&canMech()){const r=rs.find(x=>x.id===sel);r.t0=b.dataset.v;saveDutySoon();renderDrawer();renderGrid();}
  else if(a==="eset")setEarly(b.dataset.s,sel,b.dataset.k,+b.dataset.v);
  else if(a==="kind"&&canMech()){const r=rs.find(x=>x.id===sel);if(b.dataset.k)r.kind="head";else delete r.kind;saveDutySoon();renderDrawer();renderGrid();}
  else if((a==="up"||a==="dn")&&canMech()){i=rs.findIndex(x=>x.id===sel);const t=a==="up"?i-1:i+1;if(t<0||t>=rs.length)return;rs.splice(t,0,rs.splice(i,1)[0]);saveDutySoon();renderGrid();}
  else if(a==="rdel"&&canMech()){if(!armed(b,"再按一次刪除"))return;rs.splice(rs.findIndex(x=>x.id===sel),1);sel=null;saveDutySoon();renderDrawer();renderGrid();}

  else if(a==="zoom"){modal={k:"img",src:imgCache[b.dataset.id]};renderModal();}

  else if(a==="ldel"){const l=(prow(sel).links||[]).slice();l.splice(+b.dataset.i,1);setP(sel,{links:l});renderDrawer();renderGrid();}
  else if(a==="skills"){modal={k:"skills",j:modal&&modal.j||compOf(dSlots()[0])||"PLD"};renderModal();}
  else if(a==="skjob"){modal.j=b.dataset.j;modal.edit="";modal.draft=null;modal.ti=0;modal.img=null;renderModal();}

  else if(a==="skup"&&isOwner){i=+b.dataset.i;if(i<1)return;const l=lib.jobs[modal.j].skills;l.splice(i-1,0,l.splice(i,1)[0]);saveLibSoon();renderModal();render();}
  else if(a==="skdel"&&isOwner){if(!armed(b,"確認"))return;lib.jobs[modal.j].skills.splice(+b.dataset.i,1);saveLibSoon();renderModal();render();}
  else if(a==="skedit"){modal.edit=b.dataset.id;modal.img=null;const sk=b.dataset.id?allJobSkills(modal.j).find(s=>s.id===b.dataset.id):null;
    modal.draft=sk?{name:sk.name,tgt:sk.tgt||"",desc:sk.desc||"",img:sk.img||"",tiers:clone(tiersOf(sk)).map(t=>({...t,fx:t.fx||[]}))}:newDraft();modal.ti=0;renderModal();}
  else if(a==="tsel"){modal.ti=+b.dataset.i;renderModal();}
  else if(a==="tadd"){const D=modal.draft,c=clone(D.tiers[D.tiers.length-1]);c.lv="";D.tiers.push(c);modal.ti=D.tiers.length-1;renderModal();const el=document.querySelector('#modal [data-dt="lv"]');if(el)el.focus();}
  else if(a==="tdel"){if(!armed(b,"再按一次刪除"))return;modal.draft.tiers.splice(modal.ti,1);modal.ti=0;renderModal();}
  else if(a==="fxadd"){const D=modal.draft;D.tiers[modal.ti].fx=D.tiers[modal.ti].fx||[];D.tiers[modal.ti].fx.push({k:"mit",v:"",w:tgtOf(D)==="ally"?"target":tgtOf(D)==="enemy"?"enemy":"self",t:"all"});renderModal();const ins=document.querySelectorAll('#modal [data-fx="v"]');if(ins.length)ins[ins.length-1].focus();}
  else if(a==="fxdel"){modal.draft.tiers[modal.ti].fx.splice(+b.dataset.i,1);renderModal();}
  else if(a==="text"){let s="all";try{s=localStorage.getItem("mitTextMode")||"all";}catch(e){}if(s==="mine")s=mySlot()||"all";if(s!=="all"&&!dSlots().includes(s))s="all";let cp=false;try{cp=localStorage.getItem("mitTextCompact")==="1";}catch(e){}modal={k:"text",slot:s,compact:cp};renderModal();}
  else if(a==="io"){modal={k:"io"};renderModal();}
  else if(a==="copy")copyTA();
  else if(a==="import")doImport(b);
  else if(a==="comp"){modal={k:"comp"};renderModal();}
  else if(a==="compsave")compSave();
  else if(a==="dutyset"){modal={k:"duty"};renderModal();}
  else if(a==="dutynew"){modal={k:"duty",isNew:true};renderModal();}
  else if(a==="dutysave")dutySave();
  else if(a==="stadd"){modal.stages.push({id:"s"+uid(),name:"新階段",rows:[]});renderModal();}
  else if(a==="stdel"){if(!armed(b,"確認"))return;modal.stages.splice(+b.dataset.i,1);renderModal();}
  else if(a==="stup"){i=+b.dataset.i;if(i<1)return;modal.stages.splice(i-1,0,modal.stages.splice(i,1)[0]);renderModal();}
  else if(a==="mclose")closeModal();
}

function onModalChange(e){const t=e.target;
  if(t.id==="skimg"&&t.files[0])readIcon(t.files[0]).then(u=>{modal.img=u;renderModal();toast("圖示已選好");}).catch(()=>toast("圖片讀取失敗"));
  else if(t.id==="iofile"&&t.files[0])t.files[0].text().then(x=>{$("#ta").value=x;modal.raw=x;modal.stageAsk=null;toast("已讀入檔案，按「匯入」");});
  else if(t.dataset.slot){const s=t.dataset.slot;modal.name=$("#dn").value;modal.level=$("#dl").value;if($("#did"))modal.id=$("#did").value;document.querySelectorAll("[data-stn]").forEach(el=>{modal.stages[+el.dataset.stn].name=el.value;});
    modal.slots=t.checked?SLOTS.filter(x=>x===s||modal.slots.includes(x)):modal.slots.filter(x=>x!==s);renderModal();}
}
function closeModal(){modal=null;const m=$("#modal");if(m)m.remove();}

  h+='<div class="scrollx" style="margin-top:12px">'+D.tiers.map((t,i)=>'<button class="tab'+(i===modal.ti?" on":"")+'" data-a="tsel" data-i="'+esc(i)+'">'+((+t.lv||1)>1?esc(t.lv)+" 級":"初始")+'</button>').join("")+'<button class="tab" data-a="tadd">＋ 新增等級</button></div>';
  h+='<div class="tier"><div class="addsk"><label class="fld"><span>從幾級開始</span><input class="f" data-dt="lv" inputmode="numeric" placeholder="1" value="'+esc(T.lv)+'"></label><label class="fld"><span>CD 秒</span><input class="f" data-dt="cd" inputmode="numeric" value="'+esc(T.cd)+'"></label><label class="fld"><span>持續 秒</span><input class="f" data-dt="dur" inputmode="numeric" value="'+esc(T.dur)+'"></label></div>';
  h+='<div class="fld" style="margin-top:10px"><span>效果</span>'+(T.fx||[]).map((f,i)=>'<div class="fxb"><div class="fx1"><select class="f" data-fx="k" data-i="'+esc(i)+'" aria-label="效果類型">'+Object.entries(FXK).map(([k,n])=>'<option value="'+esc(k)+'"'+(f.k===k?" selected":"")+'>'+n+'</option>').join("")+'</select><input class="f" data-fx="v" data-i="'+esc(i)+'" value="'+esc(f.v||"")+'" placeholder="'+(f.k==="mit"?"10（%）":f.k==="heal"?"250（恢復力）":"數值")+'" aria-label="數值"><input class="f" data-fx="d" data-i="'+esc(i)+'" value="'+esc(f.d||"")+'" placeholder="秒" inputmode="numeric" aria-label="效果秒數"><button class="ib" aria-label="刪除這個效果" data-a="fxdel" data-i="'+esc(i)+'">'+IC.x+'</button></div>'+
    '<div class="fx2"><select class="f" data-fx="w" data-i="'+esc(i)+'" aria-label="對象">'+Object.entries(FXW).map(([k,n])=>'<option value="'+esc(k)+'"'+((f.w||"self")===k?" selected":"")+'>對象：'+n+'</option>').join("")+'</select><select class="f" data-fx="t" data-i="'+esc(i)+'" aria-label="適用傷害"'+(f.k==="mit"?"":" hidden")+'>'+Object.entries(FXT).map(([k,n])=>'<option value="'+esc(k)+'"'+((f.t||"all")===k?" selected":"")+'>'+n+'</option>').join("")+'</select><input class="f" data-fx="c" data-i="'+esc(i)+'" value="'+esc(f.c||"")+'" placeholder="條件（可不填），例：自身有鐵壁或預警" aria-label="條件"></div></div>').join("")+
    '<button class="btn" data-a="fxadd">＋ 新增效果</button></div>';
  h+='<p class="hint" style="margin-top:8px">每個等級分頁填那個等級的完整數值。新增等級時會複製目前分頁，只要改有變動的地方。副本是幾等，就套用不超過那個等級的最後一頁；比第一頁等級還低的副本，不會出現這個技能。</p>'+
    (D.tiers.length>1?'<div class="end" style="justify-content:flex-start"><button class="btn danger" data-a="tdel">刪除這個等級分頁</button></div>':'')+'</div>';
  h+='<div class="end">'+(ed?'<button class="btn" data-a="skedit" data-id="">取消編輯</button>':'')+'<button class="btn primary" data-a="skadd">'+(ed?"儲存":"新增")+'</button></div>';return h;}
function onModalInput(e){const t=e.target,D=modal&&modal.draft;if(!D)return;
  if(t.dataset.d)D[t.dataset.d]=t.value;
  else if(t.dataset.dt)D.tiers[modal.ti][t.dataset.dt]=t.value;
  else if(t.dataset.fx){const f=D.tiers[modal.ti].fx[+t.dataset.i];f[t.dataset.fx]=t.value;
    if(t.dataset.fx==="k"){const v=document.querySelector('#modal [data-fx="v"][data-i="'+esc(t.dataset.i)+'"]');if(v)v.placeholder=t.value==="mit"?"10（%）":t.value==="heal"?"250（恢復力）":"數值";
      const ty=document.querySelector('#modal [data-fx="t"][data-i="'+esc(t.dataset.i)+'"]');if(ty){ty.hidden=t.value!=="mit";if(t.value!=="mit"){ty.value="all";f.t="all";}}}}
  if(t.dataset.dt==="lv"){const tb=document.querySelector('#modal [data-a="tsel"][data-i="'+esc(modal.ti)+'"]');if(tb)tb.textContent=(+t.value||1)>1?t.value+" 級":"初始";}}
function skAdd(){if(!isOwner)return;const D=modal.draft;if(!D||!D.name.trim()){toast("請輸入技能名稱");return;}
  const ti=D.tiers.map((t,i)=>{const lv=parseInt(t.lv,10);return{lv:isNaN(lv)?(i===0?1:NaN):lv,cd:parseInt(t.cd,10)||0,dur:parseInt(t.dur,10)||0,
    fx:(t.fx||[]).filter(f=>String(f.v||"").trim()||String(f.c||"").trim()).map(f=>{const o={k:f.k||"mit",v:String(f.v||"").trim(),w:f.w||"self",t:f.t||"all"};const d=parseInt(f.d,10);if(d)o.d=d;if(String(f.c||"").trim())o.c=String(f.c).trim();return o;})};});
  if(ti.some(t=>isNaN(t.lv))){toast("每個等級分頁都要填「從幾級開始」");return;}
  if(new Set(ti.map(t=>t.lv)).size!==ti.length){toast("等級分頁的等級重複了");return;}
  ti.sort((a,b)=>a.lv-b.lv);
  lib.jobs=lib.jobs||{};const J=lib.jobs[modal.j]=lib.jobs[modal.j]||{skills:[]};
  const ed=modal.edit?J.skills.find(s=>s.id===modal.edit):null,s=ed||{id:modal.j.toLowerCase()+uid()};
  s.name=D.name.trim();s.desc=(D.desc||"").trim();if(D.tgt)s.tgt=D.tgt;else delete s.tgt;s.tiers=ti;["cd","dur","minLv","lv"].forEach(k=>delete s[k]);
  if(modal.img)s.img=modal.img;if(!ed)J.skills.push(s);
  modal.edit="";modal.img=null;modal.draft=null;modal.ti=0;saveLibSoon();renderModal();render();toast(ed?"已更新":"已新增");}
function compSave(){if(!canAll())return;const c={};document.querySelectorAll("[data-comp]").forEach(el=>{if(el.value)c[el.dataset.comp]=el.value;});plan.comp=c;savePlanSoon();closeModal();render();toast("陣容已更新");}
async function dutySave(){if(!isOwner)return;const name=$("#dn").value.trim(),level=parseInt($("#dl").value,10)||100;document.querySelectorAll("[data-stn]").forEach(el=>{modal.stages[+el.dataset.stn].name=el.value.trim()||"未命名";});
  if(!name){toast("請輸入副本名稱");return;}if(!modal.slots.length){toast("至少選一個位置");return;}
  if(modal.isNew||!duty){const id=($("#did").value||"").trim();if(!/^[A-Za-z0-9_-]{2,40}$/.test(id)){toast("代號只能用英數字");return;}if(duties.some(d=>d.id===id)){toast("代號已經有人用了");return;}
    await setDoc(doc(db,"mitDuties",id),{name,level,slots:modal.slots,stages:modal.stages.map(s=>({id:s.id,name:s.name,rows:[]})),updatedAt:Date.now()});closeModal();switchDuty(id);toast("已新增副本");return;}
  const old=Object.fromEntries((duty.stages||[]).map(s=>[s.id,s]));
  duty.name=name;duty.level=level;duty.slots=modal.slots;duty.stages=modal.stages.map(s=>({id:s.id,name:s.name,rows:old[s.id]?old[s.id].rows:[]}));
  if(cur>=duty.stages.length)cur=0;await saveDuty();closeModal();render();toast("已儲存");}
function textSheet(only,compact){const out=[];(duty.stages||[]).forEach(s=>{if(!s.rows.length)return;
  const rs=only?s.rows.filter(r=>(assign(only,r.id).some(id=>skillOf(compOf(only),id))||prow(r.id).lb===only)):s.rows;if(!rs.length)return;
  out.push("【"+s.name+"】");let printedHead=null;
  rs.forEach(r=>{const p=prow(r.id),parts=[];
  if(only){const ix=s.rows.indexOf(r);let hd=null;for(let q=ix;q>=0;q--){if(s.rows[q].kind==="head"){hd=s.rows[q];break;}}if(hd&&hd!==r&&hd!==printedHead){out.push("■ "+(hd.mech||""));printedHead=hd;}if(r.kind==="head")printedHead=r;}
  (only?[only]:dSlots()).forEach(sl=>{const j=compOf(sl),n=assign(sl,r.id).map(id=>{const k=skillOf(j,id);if(!k)return "";const eo=early(sl,r.id,id);const tg=target(sl,r.id,id);return k.name+(tg?"→"+tg:"")+(eo?"（提前 "+eo+" 秒）":"");}).filter(Boolean);if(n.length)parts.push(sl+" "+n.join("、"));});
  if(compact){const sk=only?parts.map(x=>x.slice(only.length+1)):parts;if(only&&p.lb===only)sk.push("LB");
    out.push((r.kind==="head"?"■ ":"  ")+(r.t?r.t+" ":"")+(r.mech||"")+(sk.length?"｜"+sk.join("｜"):""));return;}
  out.push((r.kind==="head"?"■ ":"  ")+(r.t?r.t+" ":"")+(r.t0?"（"+r.t0+" 讀條）":"")+(r.mech||"")+(r.tag||r.ctag?"（"+[r.tag,r.ctag].filter(Boolean).join("・")+"）":"")+((r.hits||[]).length?" "+r.hits.map(x=>(DTYPE[x.dtype]?"["+DTYPE[x.dtype].n+"]":"")+(x.dmg||"")+(+x.n>1?"×"+(+x.n):"")).join("→"):"")+(p.burst?"【"+p.burst+" 爆發】":"")+(p.pot?"【藥】":"")+(p.lb?"【LB："+p.lb+"】":"")+(parts.length?"｜"+(only?parts.map(x=>x.slice(only.length+1)):parts).join("｜"):""));
  if(r.desc)out.push("    說明："+r.desc.replace(/\n/g," "));if(p.note)out.push("    解法："+p.note.replace(/\n/g," "));if((p.imgs||[]).length)out.push("    站位圖 "+p.imgs.length+" 張（請到網站看）");(p.links||[]).forEach(l=>out.push("    "+(l.label?l.label+" ":"")+l.url));});out.push("");});return out.join("\n")||(only?only+" 目前沒有要放的技能":"還沒有內容");}
function copyTA(){const ta=$("#ta");ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast("已複製"),()=>toast("請長按文字手動複製"));else toast(ok?"已複製":"請長按文字手動複製");}
function exportData(){const o={type:"mit-seed",v:1};if(duty){const d=clone(duty);o.duty=d;}if(tid&&duty){o.plan={comp:plan.comp||{},rows:plan.rows||{},slots:Object.fromEntries(dSlots().map(s=>[s,{a:(slotDocs[s]||{}).a||{}}]))};}return o;}
async function importStage(o,b){
  if(!duty||o.duty!==duty.id){toast("請先切換到「"+(o.dutyName||o.duty)+"」再匯入");return;}
  const st=(duty.stages||[]).find(s=>s.id===o.stage)||(duty.stages||[]).find(s=>s.name===o.stageName);
  if(!st){toast("找不到「"+(o.stageName||o.stage)+"」這個階段");return;}
  const mode=b.dataset.m||"";
  if(st.rows.length&&!mode){modal.raw=$("#ta").value;modal.stageAsk={n:st.rows.length,name:st.name};renderModal();return;}
  if(!armed(b,mode==="replace"?"再按一次取代":"再按一次匯入"))return;
  const used=new Set(mode==="append"?st.rows.map(r=>r.id):[]),add=(o.rows||[]).map(r=>{const x=normRow(clone(r));if(!x.id||used.has(x.id))x.id=uid();used.add(x.id);return x;});
  st.rows=mode==="append"?st.rows.concat(add):add;
  const si=duty.stages.indexOf(st);try{await saveDuty();closeModal();cur=Math.max(0,si);sel=null;renderDrawer();render();toast("已匯入「"+st.name+"」"+add.length+" 個機制");}catch(e){console.error(e);toast("匯入失敗："+(e.code||e.message));}}
async function doImport(b){if(!isOwner)return;let o;try{o=JSON.parse($("#ta").value);}catch(e){toast("資料格式不對");return;}
  if(o&&o.type==="mit-stage"){importStage(o,b);return;}
  if(!o||o.type!=="mit-seed"){toast("這不是減傷軸的匯入檔");return;}
  if(!armed(b,"再按一次匯入"))return;
  try{
    if(o.skills){lib.jobs=lib.jobs||{};Object.keys(o.skills).forEach(j=>{lib.jobs[j]={skills:o.skills[j].skills||[]};});await saveLib();}
    if(o.duty&&o.duty.id){const d=clone(o.duty),id=d.id;delete d.id;d.updatedAt=Date.now();await setDoc(doc(db,"mitDuties",id),d);did=id;}
    if(o.plan&&tid&&did&&canAll()){const bt=writeBatch(db);bt.set(doc(db,"statics",tid,"mit",did),{comp:o.plan.comp||{},rows:o.plan.rows||{},updatedAt:Date.now(),by:me.uid});
      Object.keys(o.plan.slots||{}).forEach(s=>bt.set(doc(db,"statics",tid,"mit",did,"slots",s),{a:(o.plan.slots[s]||{}).a||{},updatedAt:Date.now(),by:me.uid}));await bt.commit();}
    closeModal();switchDuty(did);toast(o.plan&&!tid?"已匯入機制與技能（分工要從固團頁面進來才會匯入）":"已匯入");
  }catch(e){console.error(e);toast("匯入失敗："+(e.code||e.message));}}

/* ===== 即時同步 ===== */
function switchDuty(id){did=id;cur=0;sel=null;renderDrawer();
  const u=new URL(location.href);if(id)u.searchParams.set("duty",id);history.replaceState(null,"",u);
  if(unDuty)unDuty();if(unPlan)unPlan();if(unSlots)unSlots();duty=null;plan={comp:{},rows:{}};slotDocs={};
  if(!id){render();return;}
  unDuty=onSnapshot(doc(db,"mitDuties",id),s=>{if(dutyDirty)return;duty=s.exists()?{id:s.id,...s.data()}:null;if(duty)(duty.stages||[]).forEach(x=>(x.rows||[]).forEach(normRow));if(duty&&cur>=(duty.stages||[]).length)cur=0;render();if(sel)renderDrawer();},e=>{console.error(e);toast("副本讀取失敗");});
  if(tid){
    unPlan=onSnapshot(doc(db,"statics",tid,"mit",id),s=>{if(planDirty)return;plan=s.exists()?s.data():{comp:{},rows:{}};plan.comp=plan.comp||{};plan.rows=plan.rows||{};render();if(sel)renderDrawer();},e=>console.error(e));
    unSlots=onSnapshot(collection(db,"statics",tid,"mit",id,"slots"),s=>{s.docChanges().forEach(c=>{if(c.type==="removed")delete slotDocs[c.doc.id];else if(!c.doc.metadata.hasPendingWrites)slotDocs[c.doc.id]=c.doc.data();});renderGrid();if(sel)renderDrawer();},e=>console.error(e));
  }
  render();
}
async function loadUser(u){if(!u||users[u])return;try{const s=await getDoc(doc(db,"users",u));if(s.exists()){users[u]=s.data();render();}}catch(e){}}
function start(){
  onSnapshot(collection(db,"mitDuties"),s=>{duties=s.docs.map(d=>({id:d.id,name:d.data().name||d.id})).sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));ready.duties=true;
    if(!did&&duties.length)switchDuty(duties[0].id);else render();},e=>{console.error(e);toast("副本清單讀取失敗");});
  onSnapshot(doc(db,"mitSkills","lib"),s=>{if(libDirty)return;lib=s.exists()?s.data():{jobs:{}};lib.jobs=lib.jobs||{};ready.lib=true;render();if(modal&&modal.k==="skills")renderModal();},e=>console.error(e));
  if(tid){
    onSnapshot(doc(db,"statics",tid),s=>{st=s.exists()?{id:s.id,...s.data()}:{name:"（找不到固團）"};Object.values(st.roles||{}).forEach(loadUser);render();},e=>console.error(e));
    onSnapshot(collection(db,"statics",tid,"members"),s=>{members={};s.forEach(d=>{members[d.id]=d.data();});render();},e=>console.error(e));
  }
  if(did)switchDuty(did);
}

document.getElementById("app").addEventListener("click",onClick);
document.addEventListener("change",e=>{if(e.target.id==="dutySel")switchDuty(e.target.value);else if(e.target.dataset&&e.target.dataset.lf){filt=e.target.value||"all";render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modal)closeModal();else if(sel){sel=null;renderDrawer();renderGrid();}}});
window.addEventListener("beforeunload",()=>{if(dutyDirty)saveDuty();if(libDirty)saveLib();if(planDirty&&tid)savePlan();});

let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){me=null;render();return;}
  me=u;try{const tr=await u.getIdTokenResult();isOwner=tr.claims.dc===OWNER_DISCORD_ID||(u.email===OWNER_EMAIL&&u.emailVerified);}catch(e){isOwner=false;}
  if(!started){started=true;start();}render();
});
