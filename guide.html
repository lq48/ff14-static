<script type="module">
import { FIREBASE_CONFIG, OWNER_EMAIL, OWNER_DISCORD_ID } from "./config.js";
import { mountNav } from "./nav.js?v=2";
import { safeUrl } from "./common.js?v=5";
import { xpIs, xpEncode } from "./xivplan.js?v=2";
import { xpMount } from "./xp-render.js?v=8";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb = initializeApp(FIREBASE_CONFIG), auth = getAuth(fb), db = getFirestore(fb);
mountNav({ page: "team", auth, bottom: false });

/* ===== 攻略法：圖文攻略（每個固團各寫各的）=====
   資料：statics/{tid}/guides/{gid} = {did, stage, title, order, blocks:[…], by, createdAt, updatedAt, updatedBy}
         statics/{tid}/guideImgs/{id} = {gid, data, by, createdAt}（壓縮後的圖片）
   區塊：h 小標題、p 文字、ul 條列、img 圖片、xp 站位圖（文章自己的）、xpref 站位圖（從減傷軸挑）、video 影片
   文字裡可以用 **粗體**、[文字](連結)；連結只接受：mit:列 id（減傷軸）、g:文章 id#區塊 id（攻略）、https 網址
   顯示時一律跳脫成純文字，影片只接受 YouTube／Bilibili 的影片編號，圖片只接受我們自己存的圖 */
const qs = new URLSearchParams(location.search);
const tid = qs.get("team") || "";
let did = qs.get("duty") || "", gid = qs.get("g") || "";
let me = null, isOwner = false, st = null, members = {}, users = {}, duties = [], dutyDoc = {}, guides = [], plans = {}, ready = { guides: false, duties: false };
let editing = false, draft = null, dirty = false, saving = false, modal = null, toastT = null, guideErr = "", armT = null;
const imgCache = {};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const LIM = { title: 80, text: 4000, blocks: 300, items: 50, cap: 120 };
const IC = {
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg>',
  edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>'
};
function toast(m) { let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2400); }

/* ===== 權限（要和 firestore.rules 一致）===== */
const isLeader = () => !!(me && st && (st.leaders || {})[me.uid]);
const myMem = () => (me && members[me.uid]) || null;
const active = () => { const m = myMem(); return !!(m && m.status === "active"); };
const myPerm = () => ((myMem() || {}).perms || {}).guide || "none";
function canView() {
  if (!tid || !me) return false;
  if (isOwner || isLeader()) return true;
  if (!active()) return false;
  const s = ((st && st.modules) || {}).guide || "owner";
  return s === "all" || (s === "selected" && myPerm() !== "none");
}
const canAll = () => isOwner || isLeader() || (active() && canView() && myPerm() === "all");
const canOwn = () => canAll() || (active() && canView() && myPerm() === "own");
const canEdit = g => !!g && (canAll() || (canOwn() && g.by === me.uid));
const permTxt = () => canAll() ? "可編輯全部" : canOwn() ? "可寫自己的攻略" : "僅檢視";

/* ===== 文字格式：**粗體**、[文字](連結) ===== */
const MIT_ID = /^[A-Za-z0-9_-]{1,40}$/;
function linkHref(t) {
  t = String(t || "").trim();
  let m = t.match(/^mit:([A-Za-z0-9_-]{1,40})$/);
  if (m) return { href: "mit.html?team=" + encodeURIComponent(tid) + "&duty=" + encodeURIComponent(did) + "&row=" + encodeURIComponent(m[1]), cls: "gl", kind: "mit", id: m[1] };
  m = t.match(/^g:([A-Za-z0-9_-]{1,40})(?:#([A-Za-z0-9_-]{1,40}))?$/);
  if (m) return { href: "guide.html?team=" + encodeURIComponent(tid) + "&duty=" + encodeURIComponent(did) + "&g=" + encodeURIComponent(m[1]) + (m[2] ? "#b-" + m[2] : ""), cls: "gl", kind: "g", id: m[1], b: m[2] || "" };
  if (/^https:\/\/[^\s"<>]+$/i.test(t)) { const u = safeUrl(t); if (u && u !== "#") return { href: u, cls: "gl ext", kind: "ext", ext: true }; }
  return null;
}
function rich(s) {
  s = String(s || "").slice(0, LIM.text);
  let out = "", i = 0;
  const re = /\*\*([^*\n]{1,200})\*\*|\[([^\]\n]{1,120})\]\(([^)\s]{1,400})\)/g;
  let m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(i, m.index));
    if (m[1] != null) out += "<b>" + esc(m[1]) + "</b>";
    else { const L = linkHref(m[3]); out += L ? '<a class="' + L.cls + '" href="' + esc(L.href) + '"' + (L.ext ? ' target="_blank" rel="noopener noreferrer"' : "") + ">" + esc(m[2]) + "</a>" : esc(m[2]); }
    i = re.lastIndex;
  }
  return out + esc(s.slice(i));
}

/* ===== 影片：YouTube、Bilibili，從指定秒數開始 ===== */
function parseVideo(url) {
  url = String(url || "").trim();
  let m = url.match(/^https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) { const t = (url.match(/[?&](?:t|start)=([0-9hms]+)/) || [])[1]; return { src: "yt", vid: m[1], s: parseT(t) }; }
  m = url.match(/^https?:\/\/(?:www\.|m\.)?bilibili\.com\/video\/(BV[0-9A-Za-z]{10})/);
  if (m) { const p = +((url.match(/[?&]p=(\d{1,3})/) || [])[1] || 1), t = (url.match(/[?&]t=([0-9.hms]+)/) || [])[1]; return { src: "bili", vid: m[1], p: Math.max(1, p), s: parseT(t) }; }
  return null;
}
function parseT(t) {
  if (!t) return 0; t = String(t).trim();
  let m = t.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/); if (m) return m[3] != null ? +m[1] * 3600 + +m[2] * 60 + +m[3] : +m[1] * 60 + +m[2];
  m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s?)?$/); if (m && t) return Math.floor((+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0));
  return 0;
}
const fmtT = s => { s = Math.max(0, Math.floor(+s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function videoSrc(b) {
  const s = Math.max(0, Math.floor(+b.s || 0));
  if (b.src === "yt" && /^[A-Za-z0-9_-]{11}$/.test(b.vid || "")) return "https://www.youtube-nocookie.com/embed/" + b.vid + "?rel=0" + (s ? "&start=" + s : "");
  if (b.src === "bili" && /^BV[0-9A-Za-z]{10}$/.test(b.vid || "")) return "https://player.bilibili.com/player.html?bvid=" + b.vid + "&page=" + Math.max(1, Math.min(999, +b.p || 1)) + (s ? "&t=" + s : "") + "&autoplay=0&high_quality=1";
  return "";
}

/* ===== 資料 ===== */
const gRef = id => doc(db, "statics", tid, "guides", id);
const imgRef = id => doc(db, "statics", tid, "guideImgs", id);
const dutyName = d => (duties.find(x => x.id === d) || {}).name || "";
const stagesOf = d => ((dutyDoc[d] || {}).stages || []).map(s => ({ id: s.id, name: s.name || "" }));
const myGuides = () => guides.filter(g => g.did === did).sort((a, b) => (stageIdx(a.stage) - stageIdx(b.stage)) || ((+a.order || 0) - (+b.order || 0)) || String(a.title).localeCompare(String(b.title), "zh-Hant"));

/* 新文章用的空白站位圖：圓形場地、八個場地標記、王在中間、八個人站內圈 */

  let id = 1; const P = (b, r) => [Math.round(r * Math.sin(b * Math.PI / 180) * 10) / 10, Math.round(r * Math.cos(b * Math.PI / 180) * 10) / 10];
  const objs = [];
  [["A", "waymark_a.png", "circle", "#ff6a7b", 0], ["B", "waymark_b.png", "circle", "#ffe15a", 90], ["C", "waymark_c.png", "circle", "#5ab7ff", 180], ["D", "waymark_d.png", "circle", "#d48bff", 270],
   ["1", "waymark_1.png", "square", "#ff6a7b", 45], ["2", "waymark_2.png", "square", "#ffe15a", 135], ["3", "waymark_3.png", "square", "#5ab7ff", 225], ["4", "waymark_4.png", "square", "#d48bff", 315]]
    .forEach(([n, img, sh, c, b]) => { const [x, y] = P(b, 230); objs.push({ type: "marker", id: id++, name: n, image: "/marker/" + img, shape: sh, color: c, x, y, width: 34, height: 34, rotation: 0, opacity: 70 }); });
  objs.push({ type: "enemy", id: id++, name: "王", icon: "large", radius: 60, ring: "directional", rotation: 0, color: "#ff0000", opacity: 60, x: 0, y: 0 });
  const B = { MT: 0, D4: 45, H2: 90, D2: 135, ST: 180, D1: 225, H1: 270, D3: 315 }, IMG = { MT: "tank1", ST: "tank2", H1: "healer1", H2: "healer2", D1: "melee1", D2: "melee2", D3: "ranged1", D4: "ranged2" };
  Object.entries(B).forEach(([k, b]) => { const [x, y] = P(b, 110); objs.push({ type: "party", id: id++, name: k, image: "/actor/" + IMG[k] + ".png", x, y, width: 30, height: 30, rotation: 0, opacity: 100 }); });
  return { nextId: id, arena: { shape: "circle", width: 600, height: 600, padding: 120, grid: { type: "radial", angularDivs: 8, radialDivs: 2 }, ticks: { type: "radial", majorStart: 0, majorCount: 8, minorStart: 0, minorCount: 72 } }, steps: [{ objects: objs }] };
}

/* ===== 點擊 ===== */
async function onClick(e) {
  const b = e.target.closest("[data-a],[data-g]"); if (!b) return;
  if (b.dataset.g != null && !b.dataset.a) { if (editing) { e.preventDefault(); toast("先儲存或取消編輯"); return; } e.preventDefault(); gid = b.dataset.g; history.replaceState(null, "", gHref(gid)); render(); const d = b.closest("details"); if (d) d.open = false; scrollTo(0, 0); return; }
  const a = b.dataset.a;
  if (a === "newg") newGuide();
  else if (a === "edit") startEdit();
  else if (a === "cancel") { if (dirty && !armed(b, "再按一次放棄變更")) return; stopEdit(); }
  else if (a === "save") save();
  else if (a === "delg") { if (!canAll() || !armed(b, "再按一次刪除這篇")) return; const g = curGuide(); try { await deleteDoc(gRef(g.id)); guides = guides.filter(x => x.id !== g.id); stopEdit(); gid = (myGuides()[0] || {}).id || ""; history.replaceState(null, "", gid ? gHref(gid) : "guide.html?team=" + encodeURIComponent(tid) + "&duty=" + encodeURIComponent(did)); render(); toast("已刪除"); } catch (er) { toast("刪除失敗：" + (er.code === "permission-denied" ? "沒有權限" : er.code || er.message)); } }
  else if (a === "bup" || a === "bdown") { const i = draft.blocks.findIndex(x => x.id === b.dataset.b), j = i + (a === "bup" ? -1 : 1); if (i < 0 || j < 0 || j >= draft.blocks.length) return; [draft.blocks[i], draft.blocks[j]] = [draft.blocks[j], draft.blocks[i]]; touch(); render(); const n = document.querySelector('[data-a="' + a + '"][data-b="' + CSS.escape(b.dataset.b) + '"]'); if (n && !n.disabled) n.focus(); }
  else if (a === "bdel") { if (!armed(b, "再按一次")) return; draft.blocks = draft.blocks.filter(x => x.id !== b.dataset.b); touch(); render(); }
  else if (a === "fbold") insertAround(b.dataset.b, "**", "**", "粗體文字");
  else if (a === "flink") { modal = { k: "link", b: b.dataset.b, tab: "mit" }; renderModal(); }
  else if (a === "add") {
    const t = b.dataset.t;
    if (draft.blocks.length >= LIM.blocks) { toast("區塊太多了，分成兩篇吧"); return; }
    if (t === "img") { $("#up").click(); return; }
    if (t === "xpnew") { modal = { k: "xpnew" }; renderModal(); return; }
    if (t === "video") { modal = { k: "video" }; renderModal(); return; }
    const nb = { id: uid(), t, text: "", items: [], cap: "" }; draft.blocks.push(nb); touch(); render();
    const el = document.querySelector('[data-b="' + nb.id + '"][data-bf]'); if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
  }
  else if (a === "xped") openXpEditor(b.dataset.b);
  else if (a === "zoom") { const v = imgCache[b.dataset.id]; if (v) { modal = { k: "img", src: v }; renderModal(); } }
  else if (a === "copylink") { e.preventDefault(); const u = location.origin + location.pathname + "?team=" + encodeURIComponent(tid) + "&duty=" + encodeURIComponent(did) + "&g=" + encodeURIComponent(gid) + "#b-" + b.dataset.b; history.replaceState(null, "", "#b-" + b.dataset.b); document.getElementById("b-" + b.dataset.b)?.scrollIntoView({ block: "start" }); try { await navigator.clipboard.writeText(u); toast("已複製這一段的連結"); } catch (er) { } }
  else if (a === "vplay") { const src = b.dataset.src; if (!/^https:\/\/(www\.youtube-nocookie\.com\/embed\/|player\.bilibili\.com\/player\.html\?)/.test(src)) return; const f = document.createElement("iframe"); f.src = src.replace("autoplay=0", "autoplay=1") + (src.includes("youtube") ? "&autoplay=1" : ""); f.title = b.dataset.title; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true; f.referrerPolicy = "strict-origin-when-cross-origin"; b.replaceWith(f); }
  else if (a === "mclose") closeModal();
  else if (a === "ltab") { modal.tab = b.dataset.t; renderModal(); }
  else if (a === "lpick") { insertAround(modal.b, "[", "](" + b.dataset.v + ")", b.dataset.l); closeModal(); }
  else if (a === "lurl") { const u = ($("#lu").value || "").trim(), l = ($("#ll").value || "").trim() || u; if (!/^https:\/\/\S+$/i.test(u)) { toast("請貼 https:// 開頭的網址"); return; } insertAround(modal.b, "[", "](" + u + ")", l.replace(/[\[\]]/g, "")); closeModal(); }
  else if (a === "vadd") { const v = parseVideo($("#vu").value); if (!v) { toast("請貼 YouTube 或 Bilibili 的影片網址"); return; } const t = ($("#vt").value || "").trim(); if (t) v.s = parseT(t); draft.blocks.push({ id: uid(), t: "video", ...v, cap: ($("#vc").value || "").trim().slice(0, LIM.cap) }); touch(); closeModal(); render(); }
  else if (a === "xpblank") { try { const url = await xpEncode(blankScene()); const nb = { id: uid(), t: "xp", url, cap: "" }; draft.blocks.push(nb); touch(); closeModal(); render(); openXpEditor(nb.id); } catch (er) { console.error(er); toast("建立失敗"); } }
  else if (a === "xppaste") { const u = ($("#xu").value || "").trim(); if (!xpIs(u)) { toast("請貼 xivplan 的分享連結"); return; } draft.blocks.push({ id: uid(), t: "xp", url: u, cap: "" }); touch(); closeModal(); render(); }
  else if (a === "xpref") { draft.blocks.push({ id: uid(), t: "xpref", row: b.dataset.r, v: +b.dataset.v || 0, cap: "" }); touch(); closeModal(); render(); }
}
function onInput(e) {
  const t = e.target;
  if (t.dataset.f && draft) { if (t.dataset.f === "title") draft.title = t.value.slice(0, LIM.title); else if (t.dataset.f === "stage") { draft.stage = t.value; } touch(); return; }
  if (t.dataset.bf && draft) {
    const b = dB(t.dataset.b); if (!b) return;
    if (t.dataset.bf === "items") b.items = t.value.split("\n").slice(0, LIM.items);
    else if (t.dataset.bf === "s") b.s = parseT(t.value);
    else b[t.dataset.bf] = t.value;
    touch();
    if (b.t === "h") { const tc = document.querySelector('.toc a.sub[href="#b-' + CSS.escape(b.id) + '"]'); if (tc) tc.textContent = b.text; }
  }
}
async function onUpload(files) {
  const g = curGuide(); if (!g || !files || !files.length) return;
  for (const f of files) {
    try { const data = await compress(f), id = uid() + uid(); await setDoc(imgRef(id), { gid: g.id, data, by: me.uid, createdAt: Date.now() }); imgCache[id] = data; draft.blocks.push({ id: uid(), t: "img", img: id, cap: "" }); touch(); }
    catch (er) { console.error(er); toast(er.message === "too big" ? "這張圖太大，壓縮後還是超過上限" : er.message === "decode" ? "讀不到這張圖片" : "上傳失敗：" + (er.code === "permission-denied" ? "沒有權限" : er.code || er.message)); }
  }
  render(); toast("已上傳");
}

/* ===== 視窗 ===== */
function closeModal() { const m = $("#modal"); if (m) m.remove(); modal = null; }
function renderModal() {
  let m = $("#modal");
  if (!m) { m = document.createElement("div"); m.id = "modal"; m.className = "modal"; document.body.appendChild(m); m.addEventListener("click", ev => { if (ev.target === m) { if (modal && modal.k === "xped" && modal.h && modal.h.dirty()) { toast("還有沒儲存的調整：按「儲存」或「取消」"); return; } closeModal(); return; } onClick(ev); }); }
  const close = '<button class="ib" data-a="mclose" aria-label="關閉" style="float:right">' + IC.x + '</button>';
  if (modal.k === "img") { m.innerHTML = '<div class="sheet img" role="dialog" aria-modal="true" aria-label="圖片">' + close + '<img src="' + esc(modal.src) + '" alt=""></div>'; return; }
  if (modal.k === "video") { m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">' + close + '<h2 id="mh">加入影片</h2><label class="hint">YouTube 或 Bilibili 影片網址<input class="f" id="vu" inputmode="url" placeholder="https://www.youtube.com/watch?v=…"></label><div class="row" style="display:flex;gap:8px;margin-top:8px"><label class="hint" style="flex:1">從幾分幾秒開始（可不填，網址裡有 t= 也會自動讀）<input class="f" id="vt" placeholder="3:25"></label></div><label class="hint" style="display:block;margin-top:8px">說明（可不填）<input class="f" id="vc" maxlength="' + LIM.cap + '"></label><div class="end"><button class="btn" data-a="mclose">取消</button><button class="btn primary" data-a="vadd">加入</button></div></div>'; setTimeout(() => $("#vu") && $("#vu").focus(), 0); return; }
  if (modal.k === "xpnew") {
    const rows = ((dutyDoc[did] || {}).stages || []).flatMap(s => (s.rows || []).map(r => ({ ...r, stage: s.name }))).filter(r => rowXp(r.id).length);
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">' + close + '<h2 id="mh">加入站位圖</h2>' +
      '<div class="tabs"><button data-a="xptab" data-t="ref" aria-pressed="' + (modal.tab !== "new") + '">從減傷軸挑</button><button data-a="xptab" data-t="new" aria-pressed="' + (modal.tab === "new") + '">新增一張</button></div>' +
      (modal.tab === "new" ? '<p class="hint">不屬於任何時間點的示意圖。可以從空白圖開始拖人，或貼 xivplan 的分享連結。</p><div class="end" style="justify-content:flex-start"><button class="btn primary" data-a="xpblank">從空白圖開始</button></div><label class="hint" style="display:block;margin-top:12px">或貼 xivplan 分享連結<input class="f" id="xu" inputmode="url"></label><div class="end"><button class="btn" data-a="xppaste">加入</button></div>'
        : ((plans[did] || {}).err ? '<p class="warnbox">你沒有減傷軸的檢視權限，沒辦法從減傷軸挑。</p>' : rows.length ? '<div class="pick">' + rows.flatMap(r => rowXp(r.id).map((x, v) => '<button data-a="xpref" data-r="' + esc(r.id) + '" data-v="' + v + '">' + esc((r.t ? r.t + " " : "") + (r.mech || "")) + '<small>' + esc(r.stage || "") + "・" + esc(x.label || "站位圖") + '</small></button>')).join("") + '</div>' : '<p class="hint">減傷軸上還沒有站位圖。</p>')) + '</div>';
    m.querySelectorAll('[data-a="xptab"]').forEach(x => x.addEventListener("click", ev => { ev.stopPropagation(); modal.tab = x.dataset.t; renderModal(); }));
    return;
  }
  if (modal.k === "link") {
    const tab = modal.tab, rows = ((dutyDoc[did] || {}).stages || []).flatMap(s => (s.rows || []).filter(r => r.kind !== "head").map(r => ({ ...r, stage: s.name })));
    let body = "";
    if (tab === "mit") body = '<div class="pick">' + (rows.length ? rows.map(r => '<button data-a="lpick" data-v="mit:' + esc(r.id) + '" data-l="' + esc((r.t ? r.t + " " : "") + (r.mech || "")) + '">' + esc((r.t ? r.t + " " : "") + (r.mech || "（未命名）")) + '<small>' + esc(r.stage || "") + '</small></button>').join("") : '<p class="hint">減傷軸還沒有機制。</p>') + '</div>';
    else if (tab === "g") { const gs = myGuides(), bs = gs.flatMap(x => [{ g: x, b: null }].concat((x.id === gid && draft ? draft.blocks : x.blocks || []).filter(y => y.t === "h" && String(y.text || "").trim()).map(y => ({ g: x, b: y })))); body = '<div class="pick">' + bs.map(o => '<button data-a="lpick" data-v="g:' + esc(o.g.id) + (o.b ? "#" + esc(o.b.id) : "") + '" data-l="' + esc(o.b ? o.b.text : o.g.title) + '"' + (o.b ? ' style="margin-left:18px"' : "") + '>' + esc(o.b ? o.b.text : (o.g.title || "未命名")) + (o.b ? "" : "<small>整篇</small>") + '</button>').join("") + '</div>'; }
    else body = '<label class="hint">網址<input class="f" id="lu" inputmode="url" placeholder="https://"></label><label class="hint" style="display:block;margin-top:8px">顯示的文字<input class="f" id="ll"></label><div class="end"><button class="btn primary" data-a="lurl">插入</button></div>';
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">' + close + '<h2 id="mh">插入連結</h2><div class="tabs">' + [["mit", "減傷軸的機制"], ["g", "攻略的段落"], ["url", "網址"]].map(([k, t]) => '<button data-a="ltab" data-t="' + k + '" aria-pressed="' + (tab === k) + '">' + t + '</button>').join("") + '</div>' + body + '</div>';
    return;
  }
}
function openXpEditor(bid) {
  const b = dB(bid); if (!b || !xpIs(b.url)) return;
  modal = { k: "xped", b: bid };
  let m = $("#modal"); if (!m) { renderModal(); m = $("#modal"); }
  m.innerHTML = '<div class="sheet wide" role="dialog" aria-modal="true" aria-label="調整站位"><h2>調整站位</h2><div class="xpm"></div></div>';
  modal.h = xpMount(m.querySelector(".xpm"), [{ label: "站位圖", url: b.url }], { ...xpOpts(), me: "", edit: true, v: 0, i: 0,
    onClose: () => closeModal(), onError: () => toast("存檔失敗，請再試一次"),
    onSave: async url => { if (!xpIs(url)) throw new Error("站位圖太大或格式不對"); const x = dB(bid); if (x) { x.url = url; touch(); } closeModal(); render(); toast("站位圖已更新（記得按「儲存」）"); } });
}

/* ===== 啟動 ===== */
function switchDuty(d) { if (editing) return; did = d; gid = ""; const g = myGuides()[0]; if (g) gid = g.id; history.replaceState(null, "", did ? (gid ? gHref(gid) : "guide.html?team=" + encodeURIComponent(tid) + "&duty=" + encodeURIComponent(did)) : "guide.html?team=" + encodeURIComponent(tid)); watchDuty(did); watchPlan(did); render(); }
const dutyWatched = {};
function watchDuty(d) { if (!d || dutyWatched[d]) return; dutyWatched[d] = 1; onSnapshot(doc(db, "mitDuties", d), s => { dutyDoc[d] = s.exists() ? s.data() : {}; render(); }, e => console.error(e)); }
function start() {
  onSnapshot(doc(db, "statics", tid), s => { st = s.exists() ? { id: s.id, ...s.data() } : { name: "（找不到固團）" }; render(); }, e => console.error(e));
  onSnapshot(collection(db, "statics", tid, "members"), s => { members = {}; s.forEach(d => { members[d.id] = d.data(); }); render(); subGuides(); }, e => console.error(e));
  onSnapshot(collection(db, "mitDuties"), s => { duties = s.docs.map(d => ({ id: d.id, name: d.data().name || d.id })).sort((a, b) => a.name.localeCompare(b.name, "zh-Hant")); ready.duties = true; if (!did && duties.length) { switchDuty(duties[0].id); return; } render(); }, e => console.error(e));
  if (did) { watchDuty(did); watchPlan(did); }
}
let guideSub = null;
function subGuides() {
  if (guideSub || !canView()) return;
  guideSub = onSnapshot(collection(db, "statics", tid, "guides"), s => {
    guideErr = ""; guides = s.docs.map(d => ({ id: d.id, ...d.data() })); ready.guides = true;
    guides.forEach(g => loadUser(g.by));
    if (!gid || !guides.some(g => g.id === gid)) { const g = myGuides()[0]; if (g && !editing) gid = g.id; }
    if (editing && !curGuide()) { editing = false; draft = null; }
    if (!editing) render(); else { const tc = document.querySelector(".toc"); if (tc) tc.innerHTML = tocHTML(myGuides(), curGuide()); }
    if (location.hash && !editing) { const el = document.getElementById(location.hash.slice(1)); if (el && !jumped) { jumped = true; el.scrollIntoView({ block: "start" }); } }
  }, e => { console.error(e); guideErr = e.code || "error"; ready.guides = true; render(); });
}
let jumped = false;
document.getElementById("app").addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("change", e => { if (e.target.id === "dutySel") switchDuty(e.target.value); else if (e.target.id === "up") { onUpload([...e.target.files]); e.target.value = ""; } else onInput(e); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal) { if (modal.k === "xped" && modal.h && modal.h.dirty()) { toast("還有沒儲存的調整：按「儲存」或「取消」"); return; } closeModal(); } });
window.addEventListener("beforeunload", e => { if (editing && dirty) { e.preventDefault(); e.returnValue = ""; } });
let started = false;
onAuthStateChanged(auth, async u => {
  if (!u) { me = null; render(); return; }
  me = u; try { const tr = await u.getIdTokenResult(); isOwner = tr.claims.dc === OWNER_DISCORD_ID || (u.email === OWNER_EMAIL && u.emailVerified); } catch (e) { isOwner = false; }
  if (!started && tid) { started = true; start(); }
  subGuides(); render();
});
</script>
